    tr.r-sel td:first-child { border-left: 3px solid var(--emerald); }
    tr.r-sp td { height: 8px; padding: 0; background: var(--bg); border-left: none; border-right: none; }
    tr.r-ltz-sp td { height: 6px; padding: 0; background: rgba(6,10,18,0.65); border-left: none; border-right: none; }
    .act-pair { display: inline-flex; gap: 4px; align-items: center; justify-content: center; }

    /* ተንሳፋፊ የፒዲኤፍ አሞሌ */
    .pdf-bar { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 44px; background: rgba(6,78,59,0.92); border: 1.5px solid var(--emerald); border-radius: 22px; padding: 4px 8px; display: none; align-items: center; justify-content: space-between; gap: 5px; z-index: 45; backdrop-filter: blur(8px); }
    .pdf-pill { height: 30px; padding: 0 9px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.22); background: rgba(15,23,42,0.84); color: #fff; font-size: 10.5px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .pdf-send { height: 32px; padding: 0 11px; border-radius: 16px; border: none; background: var(--emerald); color: #052e16; font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }

    /* ካርታ */
    .rack-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 6px; flex-shrink: 0; }
    .rack-tab { min-width: 72px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .rack-tab.active { background: var(--primary); color: #fff; border-color: #7dd3fc; }
    .rack-wrap { flex: 1; overflow: auto; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px; margin-bottom: 62px; }
    .rack-grid { display: grid; gap: 5px; min-width: 280px; }
    .bin { min-height: 54px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; }
    .bin.used { background: #064e3b; border-color: var(--emerald); }
    .bin.hl { border: 2px dashed var(--amber); background: #451a03; }
    .bin.sel { border: 2px solid var(--primary); background: #0369a1; }
    .bin-id { font-size: 9.5px; font-weight: 900; color: var(--primary); }
    .bin-it { font-size: 8.5px; font-weight: 800; word-break: break-word; }

    /* የታችኛው አውራ ጣት ዳሰሳ */
    .bottom-nav { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 50px; background: rgba(15,23,42,0.78); border: 1px solid rgba(255,255,255,0.22); border-radius: 25px; display: flex; align-items: center; padding: 3px 4px; z-index: 50; backdrop-filter: blur(8px); }
    .nav-item { flex: 1; height: 42px; border-radius: 21px; border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .nav-item .ico { font-size: 15px; line-height: 1; }
    .nav-item.active { background: rgba(14,165,233,0.45); color: #fff; border: 1px solid rgba(56,189,248,0.7); }

    /* ሞዳል እና ማሳወቂያ */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; padding: 10px; z-index: 800; }
    .modal-bg.open { display: flex; }
    .modal-card { width: 100%; max-width: 440px; max-height: 88vh; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 900; color: var(--teal); }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .modal-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-top: 6px; border-top: 1px solid var(--border); }
    .btn { height: 40px; border-radius: 10px; border: none; font-size: 12px; font-weight: 900; cursor: pointer; padding: 0 12px; color: #fff; }
    .btn.teal { background: var(--teal); color: var(--teal-dark); }
    .btn.primary { background: var(--primary); }
    .btn.danger { background: var(--rose); }
    .btn.hard-del { background: #7f1d1d; border: 1px solid var(--rose); color: #fecaca; }
    .btn.muted { background: #1e293b; color: var(--text); }
    .sub-card { background: var(--surface-deep); border: 1px solid var(--border); border-radius: 10px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
    .lbl-sm { font-size: 10px; font-weight: 900; color: var(--muted); }
    .chk-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #042f2e; border: 1px solid var(--teal); color: #99f6e4; padding: 9px 14px; border-radius: 12px; font-size: 12px; font-weight: 900; z-index: 999; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.7); max-width: 92vw; }
    .toast-btn { background: var(--amber); color: #000; border: none; border-radius: 7px; padding: 4px 8px; font-size: 11px; font-weight: 900; cursor: pointer; }
    video.qr-video { width: 100%; border-radius: 12px; background: #000; max-height: 260px; object-fit: cover; }

    /* ባለገጽ ፒዲኤፍ መሳያ መድረክ */
    #pdfStage { position: fixed; left: -14000px; top: 0; background: #fff; color: #000; font-family: system-ui, Arial, sans-serif; }
    .pdf-page-box { background: #ffffff; color: #0f172a; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; position: relative; }
    .pdf-page-body { flex: 1; overflow: hidden; }
    .pdf-page-foot { margin-top: auto; padding-top: 6px; }
    @media (min-width: 640px) { .modal-bg { align-items: center; } }
  </style>
</head>
<body>

  <!-- መግቢያ -->
  <div id="loginGate" class="gate">
    <div class="gate-card">
      <div class="gate-mark" id="gateMark">መ</div>
      <div class="gate-title" id="lblGateTitle"></div>
      <div class="seg" style="margin-bottom:2px;">
        <button type="button" id="btnAuthEmail" class="seg-btn teal" onclick="setAuthMode('EMAIL')"></button>
        <button type="button" id="btnAuthPin" class="seg-btn" onclick="setAuthMode('PIN')"></button>
      </div>
      <div id="authEmailBox" style="display:flex;flex-direction:column;gap:10px;">
        <input type="email" id="inpLoginEmail" class="inp" style="height:42px;" autocomplete="email">
        <input type="password" id="inpLoginPass" class="inp" style="height:42px;" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div id="authPinBox" style="display:none;flex-direction:column;gap:10px;">
        <input type="text" id="inpOrgCode" class="inp mono" style="height:42px;text-transform:uppercase;" autocomplete="organization">
        <input type="password" id="inpLoginPin" class="inp gate-pin" maxlength="6" inputmode="numeric" placeholder="••••••" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <button type="button" class="btn teal" id="btnLoginSubmit" onclick="doLogin()"></button>
      <div id="loginErr" style="color:var(--rose);font-size:11.5px;font-weight:900;text-align:center;"></div>
      <button type="button" class="btn muted" style="height:34px;font-size:11px;" id="btnGateLang" onclick="toggleLang()"></button>
    </div>
  </div>

  <!-- ጎን ሜኑ -->
  <div id="drawerBg" class="drawer-bg" onclick="closeDrawer()"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <span id="drawerBrand" style="font-size:13px;font-weight:900;color:var(--teal);"></span>
      <button type="button" class="icon-btn" onclick="closeDrawer()">✕</button>
    </div>
    <div class="drawer-list" id="drawerList"></div>
    <div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:7px;">
      <button type="button" id="btnInstallApp" class="btn primary" style="display:none;height:36px;" onclick="triggerPwaInstall()"></button>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span id="drawerUserInfo" style="font-size:11px;font-weight:800;color:var(--muted);"></span>
        <span style="font-size:10px;font-weight:900;color:var(--teal);opacity:0.8;">v9</span>
      </div>
      <button type="button" class="btn danger" id="btnLogout" onclick="doLogout()"></button>
    </div>
  </aside>

  <!-- ዋና መተግበሪያ -->
  <div id="appShell" class="shell">
    <header class="topbar">
      <button type="button" class="icon-btn" onclick="openDrawer()">☰</button>
      <div class="brand-box">
        <span class="brand-name" id="topBrand"></span>
        <span class="brand-sub" id="topOrgSub"></span>
      </div>
      <button type="button" id="syncPill" class="sync-pill" onclick="syncOfflineQueue()"></button>
      <select id="selWarehouse" class="wh-sel" onchange="switchWarehouse(this.value)"></select>
      <button type="button" class="icon-btn" style="width:auto;padding:0 7px;font-size:10px;" id="btnTopLang" onclick="toggleLang()"></button>
    </header>

    <!-- ገጽ 1: መመዝገቢያ -->
    <section id="viewEntry" class="view active">
      <div class="seg">
        <button type="button" id="btnModeOut" class="seg-btn out" onclick="setEntryMode('OUT')"></button>
        <button type="button" id="btnModeIn" class="seg-btn" onclick="setEntryMode('IN')"></button>
      </div>
      <div class="card">
        <div id="entryOutForm">
          <div id="outMainRow" class="grid-3">
            <div class="doc-combo">
              <input type="text" id="inpDocNo" onfocus="checkDocSilently()">
              <button type="button" id="btnVoidMini" class="btn-void-mini" onclick="promptDirectVoid()"></button>
            </div>
            <input type="text" id="inpParty" class="inp">
            <input type="text" id="inpRef" class="inp">
          </div>
          <div id="outExtraFields" class="extra-fields"></div>
        </div>
        <div id="entryInForm" style="display:none;">
          <div class="grid-3">
            <input type="text" id="inpInSupplier" class="inp">
            <input type="text" id="inpInDriver" class="inp">
            <input type="text" id="inpInPlate" class="inp">
          </div>
          <div id="inExtraFields" class="extra-fields"></div>
        </div>
      </div>

      <div class="quick-row">
        <input type="text" id="inpSearch" class="inp" oninput="onSmartDimInput(this); renderTiles()" onkeydown="if(event.key==='Enter') quickAdd()">
        <input type="number" id="inpQuickQty" class="inp mono" min="1" inputmode="numeric" onkeydown="if(event.key==='Enter') quickAdd()">
        <button type="button" id="btnQuickAdd" class="btn-ok-sq" onclick="quickAdd()">✓</button>
      </div>
      <div id="tilesGrid" class="tiles"></div>
      <div id="basketWrap" class="basket-wrap"><div id="basketList" class="basket-list"></div></div>
      <div id="submitDock" class="dock">
        <span id="lblDockTot" style="font-size:11px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <div class="dock-actions">
          <button type="button" id="btnSendToTally" class="dock-btn tally" onclick="sendBasketToTally()"></button>
          <button type="button" id="btnCommitDoc" class="dock-btn out" onclick="handleDocumentSubmit(this)"></button>
        </div>
      </div>
    </section>

    <!-- ገጽ 2: ቆጠራ (ከመመዝገቢያ ቅጽ ጋር 100% የተዛመደ) -->
    <section id="viewTally" class="view">
      <div class="seg">
        <button type="button" id="btnTTicket" class="seg-btn teal" onclick="setTallyTab('TICKET')"></button>
        <button type="button" id="btnTFree" class="seg-btn" onclick="setTallyTab('FREE')"></button>
        <button type="button" id="btnTAudit" class="seg-btn" onclick="setTallyTab('AUDIT')"></button>
      </div>

      <div id="tallyTicketArea">
        <div id="ticketBar" class="ticket-bar"></div>
        <div class="card" style="padding:5px;">
          <div style="display:grid;grid-template-columns:auto 1fr auto;gap:4px;align-items:center;">
            <button type="button" id="btnTkDir" class="icon-btn" style="width:auto;padding:0 7px;font-size:10px;height:31px;" onclick="toggleTicketDir()"></button>
            <div id="tkMainRow" class="grid-3"></div>
            <button type="button" class="icon-btn" style="width:28px;height:31px;color:var(--rose);" onclick="deleteActiveTicket()">✕</button>
          </div>
          <div id="tkExtraFields" class="extra-fields"></div>
        </div>
        <div id="ticketItemsStrip" class="tk-items"></div>
      </div>

      <div id="tallyFreeArea" style="display:none;margin-bottom:5px;flex-shrink:0;">
        <div style="display:grid;grid-template-columns:1fr 0.9fr auto;gap:5px;">
          <input type="text" id="inpFreeLabel" class="inp" oninput="freeTally.label=this.value;saveTallyState()">
          <input type="number" id="inpFreeTarget" class="inp mono" min="0" inputmode="numeric" oninput="freeTally.target=Math.max(0,Math.floor(Number(this.value||0)));saveTallyState();renderTallyStats()">
          <button type="button" id="btnFreeLock" class="icon-btn" style="width:36px;height:34px;" onclick="toggleFreeLock()">🔒</button>
        </div>
      </div>

      <div id="tallyAuditArea" style="display:none;margin-bottom:5px;flex-shrink:0;">
        <div class="grid-2">
          <select id="selAuditItem" class="sel" onchange="onAuditItemChange()"></select>
          <input type="number" id="inpAuditSys" class="inp mono" readonly>
        </div>
      </div>

      <div class="card" style="padding:5px;">
        <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px;">
          <span id="lblPerCarry"></span>
          <span id="lblCarryVal" style="color:var(--teal);font-family:ui-monospace,monospace;"></span>
        </div>
        <div id="presetGrid" class="preset-grid"></div>
      </div>

      <div id="tallyAlert" class="alert-box"></div>
      <div id="tallyPad" class="tally-pad">
        <div id="tallyCanvas" class="tally-canvas"></div>
        <div class="t-stats">
          <div class="t-stat"><span class="t-lbl" id="lblTCounted"></span><span class="t-num" id="valTCounted">0</span></div>
          <div class="t-stat c"><span class="t-lbl" id="lblTStrokes"></span><span class="t-num" style="font-size:18px;color:var(--teal);" id="valTStrokes">0</span></div>
          <div class="t-stat r"><span class="t-lbl" id="lblTRight"></span><span class="t-num" style="color:var(--amber);" id="valTRight">∞</span></div>
        </div>
      </div>
      <div class="t-actions">
        <button type="button" class="t-btn" style="color:#fca5a5;" onclick="undoTally()"><span>↩️</span><span id="lblTUndo"></span></button>
        <button type="button" class="t-btn" style="color:var(--amber);" onclick="openNumModal('odd')"><span>➕</span><span id="lblTOdd"></span></button>
        <button type="button" class="t-btn" onclick="clearTallyUndoable()"><span>🧹</span><span id="lblTClear"></span></button>
        <button type="button" class="t-btn commit" id="btnTCommit" onclick="commitTally(this)"></button>
      </div>
    </section>

    <!-- ገጽ 3: ዕለታዊ -->
    <section id="viewDaily" class="view">
      <div class="card">
        <div style="display:grid;grid-template-columns:1fr auto auto auto auto;gap:4px;">
          <input type="text" id="inpDailySearch" class="inp" oninput="onSmartDimInput(this); renderDaily()">
          <button type="button" id="btnDailySort" class="icon-btn" style="width:auto;padding:0 7px;font-size:10.5px;" onclick="toggleDailySort()">#</button>
          <button type="button" id="btnZeroOnly" class="icon-btn" style="width:auto;padding:0 8px;color:var(--amber);" onclick="toggleZeroFilter()">0</button>
          <button type="button" id="btnDailyActToggle" class="icon-btn on" style="width:30px;" onclick="toggleActionsCol('daily')">⚙️</button>
          <button type="button" id="btnDailyPdf" class="icon-btn" style="width:auto;padding:0 8px;font-size:10.5px;color:var(--teal);" onclick="openDailyPdfChoice()"></button>
        </div>
        <div class="metrics" id="dailyMetrics"></div>
      </div>
      <div id="dailyTblWrap" class="tbl-wrap"><table class="tbl"><thead id="dailyHead"></thead><tbody id="dailyBody"></tbody></table></div>
    </section>

    <!-- ገጽ 4: ስቶክ -->
    <section id="viewStock" class="view">
      <div class="seg">
        <button type="button" id="btnPWeek" class="seg-btn teal" onclick="setStockPeriod('WEEK')"></button>
        <button type="button" id="btnPLastWeek" class="seg-btn" onclick="setStockPeriod('LAST_WEEK')"></button>
        <button type="button" id="btnPMonth" class="seg-btn" onclick="setStockPeriod('MONTH')"></button>
        <button type="button" id="btnPAll" class="seg-btn" onclick="setStockPeriod('ALL')"></button>
      </div>
      <div class="card" style="display:flex;gap:5px;">
        <input type="text" id="inpStockSearch" class="inp" style="flex:1;" oninput="onSmartDimInput(this); renderStock()">
        <button type="button" id="btnStockActToggle" class="icon-btn on" style="width:30px;" onclick="toggleActionsCol('stock')">⚙️</button>
        <button type="button" id="btnStockPdf" class="icon-btn" style="width:auto;padding:0 8px;font-size:10.5px;color:var(--teal);" onclick="openStockPdfChoice()"></button>
      </div>
      <div id="stockTblWrap" class="tbl-wrap"><table class="tbl"><thead id="stockHead"></thead><tbody id="stockBody"></tbody></table></div>
    </section>

    <!-- ገጽ 5: ካርታ -->
    <section id="viewMap" class="view">
      <div class="card" style="display:flex;gap:5px;">
        <input type="text" id="inpMapSearch" class="inp" style="flex:1;" oninput="onSmartDimInput(this); renderMap()">
        <button type="button" class="icon-btn" style="width:auto;padding:0 8px;color:var(--teal);" onclick="openQrScanner()">📷</button>
        <button type="button" id="btnBulkMap" class="icon-btn" style="width:auto;padding:0 8px;" onclick="toggleBulkMap()">☑️</button>
        <button type="button" id="btnBulkAssign" class="icon-btn" style="display:none;width:auto;padding:0 8px;background:var(--emerald);color:#052e16;" onclick="openBinModal(null)"></button>
      </div>
      <div id="rackTabs" class="rack-tabs"></div>
      <div class="rack-wrap"><div id="rackGrid" class="rack-grid"></div></div>
    </section>

    <!-- ተንሳፋፊ የፒዲኤፍ አሞሌ -->
    <div id="pdfBar" class="pdf-bar">
      <button type="button" class="pdf-pill" id="btnPdfClear" onclick="clearPdfSelection()"></button>
      <div style="display:flex;gap:4px;">
        <button type="button" class="pdf-pill" id="btnPdfDownload" onclick="runSelectedPdf('download', this)"></button>
        <button type="button" class="pdf-pill" id="btnPdfShare" onclick="runSelectedPdf('share', this)"></button>
        <button type="button" class="pdf-send" id="btnPdfSend" onclick="openSelectedSendPicker()"></button>
      </div>
    </div>

    <!-- የታችኛው አውራ ጣት ዳሰሳ -->
    <nav class="bottom-nav">
      <button type="button" class="nav-item active" id="navEntry" onclick="switchView('entry')"><span class="ico">📝</span><span id="lblNavEntry"></span></button>
      <button type="button" class="nav-item" id="navTally" onclick="switchView('tally')"><span class="ico">🧮</span><span id="lblNavTally"></span></button>
      <button type="button" class="nav-item" id="navDaily" onclick="switchView('daily')"><span class="ico">📋</span><span id="lblNavDaily"></span></button>
      <button type="button" class="nav-item" id="navStock" onclick="switchView('stock')"><span class="ico">📊</span><span id="lblNavStock"></span></button>
      <button type="button" class="nav-item" id="navMap" onclick="switchView('map')"><span class="ico">🗺️</span><span id="lblNavMap"></span></button>
    </nav>
  </div>

  <!-- ሁለገብ ሞዳል -->
  <div id="mainModal" class="modal-bg" onclick="if(event.target===this) closeMainModal()">
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalTitle"></span>
        <button type="button" class="icon-btn" onclick="closeMainModal()">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFoot" class="modal-foot"></div>
    </div>
  </div>

  <div id="pdfStage"></div>

  <script>
