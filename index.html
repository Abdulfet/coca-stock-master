<!DOCTYPE html>
<html lang="am" id="docRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>መጋዘን</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="theme-color" content="#060a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #060a12; --surface: #0f172a; --surface-deep: #090f1d;
      --border: #1e293b; --border-strong: #334155;
      --text: #f8fafc; --muted: #94a3b8;
      --primary: #0ea5e9; --teal: #14b8a6; --teal-dark: #042f2e;
      --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444; --violet: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: auto; }
    html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    button { transition: transform 0.08s ease, opacity 0.12s ease; }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled, .btn-busy { opacity: 0.5 !important; pointer-events: none !important; }

    /* መግቢያ */
    .gate { position: fixed; inset: 0; z-index: 900; background: radial-gradient(circle at top, #172554 0%, #060a12 72%); display: flex; align-items: center; justify-content: center; padding: 14px; }
    .gate-card { width: 100%; max-width: 360px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 24px 48px rgba(0,0,0,0.75); }
    .gate-mark { width: 54px; height: 54px; margin: 0 auto; border-radius: 15px; border: 2px solid var(--teal); background: var(--surface-deep); color: var(--teal); font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .gate-title { text-align: center; font-size: 16px; font-weight: 900; }
    .gate-pin { height: 46px; text-align: center; font-size: 22px; letter-spacing: 8px; -webkit-text-security: disc; }

    /* ዋና ቅርፊት + ንጹህ Smart Focus Mode */
    .shell { max-width: 640px; height: 100vh; height: 100dvh; margin: 0 auto; display: none; flex-direction: column; padding: 6px 6px 0; position: relative; overflow: hidden; }
    .topbar { height: 44px; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 0 7px; margin-bottom: 6px; flex-shrink: 0; position: relative; z-index: 60; }
    .top-left-grp { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    #topFocusLeft { display: none; }
    .shell.focus-mode #topNormalLeft { display: none; }
    .shell.focus-mode #topFocusLeft { display: flex; }

    .tally-top-tools { display: none; align-items: center; gap: 5px; }
    .shell.view-tally .tally-top-tools { display: inline-flex; }

    .icon-btn { width: 34px; height: 32px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--primary); font-size: 14px; font-weight: 900; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
    .icon-btn.back-btn { color: #fff; font-size: 16px; border-color: var(--border-strong); }
    .icon-btn.on { background: rgba(14,165,233,0.28); border-color: var(--primary); color: #fff; }
    .icon-btn.fmt-on { background: rgba(20,184,166,0.28); border-color: var(--teal); color: #5eead4; }
    .icon-btn.voice-on { background: rgba(20,184,166,0.25); border-color: var(--teal); color: #5eead4; }
    .icon-btn.locked { background: rgba(239,68,68,0.24); border-color: var(--rose); color: #fca5a5; }
    .brand-box { display: flex; flex-direction: column; min-width: 0; flex-shrink: 1; line-height: 1.18; }
    .brand-name { font-size: 12px; font-weight: 900; letter-spacing: 0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 8.5px; font-weight: 800; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .focus-menu { position: absolute; top: 50px; left: 10px; min-width: 190px; background: #070d19; border: 1.5px solid var(--border-strong); border-radius: 14px; padding: 6px; display: none; flex-direction: column; gap: 4px; z-index: 500; box-shadow: 0 16px 36px rgba(0,0,0,0.82); }
    .focus-menu.open { display: flex; }
    .focus-menu-item { height: 36px; padding: 0 10px; border-radius: 9px; border: none; background: transparent; color: var(--text); font-size: 12px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 8px; text-align: left; }
    .focus-menu-item.active { background: rgba(14,165,233,0.25); color: #7dd3fc; }
    .wh-sel { margin-left: auto; max-width: 146px; height: 32px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--primary); background: var(--surface-deep); color: var(--primary); font-size: 11px; font-weight: 900; outline: none; flex-shrink: 0; }
    .sync-pill { display: none; height: 28px; padding: 0 8px; border-radius: 14px; border: 1px solid var(--amber); background: rgba(245,158,11,0.18); color: #fde68a; font-size: 10px; font-weight: 900; cursor: pointer; flex-shrink: 0; }

    /* ጎን ሜኑ */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.76); backdrop-filter: blur(4px); z-index: 600; display: none; }
    .drawer { position: fixed; top: 0; left: -295px; width: 285px; height: 100%; background: #070b14; border-right: 1px solid var(--border-strong); z-index: 601; transition: left 0.22s ease; display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; }
    .drawer.open { left: 0; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .drawer-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .drawer-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 10px; border-radius: 10px; background: transparent; border: none; color: var(--text); font-size: 12.5px; font-weight: 800; text-align: left; cursor: pointer; width: 100%; }
    .drawer-item:active { background: var(--surface); color: var(--teal); }
    .drawer-sep { height: 1px; background: var(--border); margin: 4px 2px; flex-shrink: 0; }
    .drawer-toggle { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 10px; border-radius: 10px; background: rgba(15,23,42,0.75); border: 1px solid var(--border); color: var(--text); font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .badge-cnt { background: var(--rose); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 10px; }
    .badge-cnt.amber { background: var(--amber); color: #000; }

    /* የጋራ ክፍሎች */
    .view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }
    .seg { display: flex; gap: 5px; margin-bottom: 6px; flex-shrink: 0; align-items: center; }
    .seg-btn { flex: 1; height: 34px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 11.5px; font-weight: 900; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
    .seg-btn.out { background: #3b0a0a; border-color: var(--rose); color: #fca5a5; }
    .seg-btn.in { background: #052e16; border-color: var(--emerald); color: #86efac; }
    .seg-btn.adj { background: #172554; border-color: var(--primary); color: #7dd3fc; }
    .seg-btn.teal { background: var(--teal-dark); border-color: var(--teal); color: #99f6e4; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 6px; margin-bottom: 5px; flex-shrink: 0; }
    .inp, .sel, .txtarea { width: 100%; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 12px; font-weight: 800; outline: none; }
    .txtarea { height: 120px; padding: 8px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
    .inp:focus, .sel:focus, .txtarea:focus { border-color: var(--teal); }
    .inp.mono { font-family: ui-monospace, monospace; text-align: center; color: var(--primary); }
    .inp.sm { height: 30px; font-size: 11.5px; padding: 0 6px; }
    .grid-3 { display: grid; grid-template-columns: 1.15fr 1fr 0.95fr; gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .doc-combo { display: flex; border: 1.5px solid var(--primary); border-radius: 8px; overflow: hidden; height: 34px; background: var(--surface-deep); }
    .doc-combo input { border: none; border-radius: 0; flex: 1; min-width: 0; text-align: center; color: var(--primary); font-family: ui-monospace, monospace; }
    .btn-void-mini { border: none; border-left: 1px solid #7f1d1d; background: #450a0a; color: #fca5a5; padding: 0 7px; font-size: 9.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; }
    .extra-fields { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .extra-fields:empty { display: none; margin-top: 0; }
    .extra-fields > * { flex: 1 1 110px; min-width: 96px; }

    /* ገጽ 1: መመዝገቢያ */
    .quick-row { display: grid; grid-template-columns: 1fr 68px 40px; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .btn-ok-sq { height: 34px; border: none; border-radius: 8px; background: var(--emerald); color: #052e16; font-size: 17px; font-weight: 900; cursor: pointer; }
    .tiles { flex: 1 1 auto; min-height: 90px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 5px; padding-bottom: 68px; }
    .tiles.has-basket { padding-bottom: 8px; }
    .shell.nav-hidden .tiles { padding-bottom: 14px; }
    .tile { background: var(--surface-deep); border: 1px solid var(--border-strong); border-radius: 10px; padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
    .tile.picked { border-color: var(--emerald); background: rgba(6, 78, 59, 0.34); }
    .tile-top { display: flex; justify-content: space-between; gap: 4px; align-items: center; }
    .tile-name { font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-bal { font-size: 11.5px; font-weight: 900; color: var(--emerald); font-family: ui-monospace, monospace; }
    .tile-bal.zero { color: var(--amber); }
    .tile-bot { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--muted); font-weight: 800; }
    .tile-cnt-btn { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--teal); background: rgba(20,184,166,0.14); color: var(--teal); font-size: 9.5px; font-weight: 900; cursor: pointer; }

    /* ቅርጫት + Dock */
    .basket-wrap { display: none; flex: 0 0 auto; max-height: 36vh; flex-direction: column; margin-top: auto; margin-bottom: 60px; padding-top: 4px; }
    .basket-list { overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 5px; }
    .b-row { height: 42px; background: rgba(15, 23, 42, 0.88); border: 1.5px solid rgba(56, 189, 248, 0.38); border-radius: 21px; padding: 4px 8px 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; backdrop-filter: blur(6px); }
    .b-row.dragging { border-color: var(--teal); background: rgba(20, 184, 166, 0.28); transform: scale(1.02); }
    .b-drag { min-width: 28px; height: 28px; border-radius: 14px; background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: none; cursor: grab; }
    .b-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .b-qty { width: 60px; height: 29px; border-radius: 14px; border: 1.5px solid var(--primary); background: var(--bg); color: #fff; text-align: center; font-size: 12.5px; font-weight: 900; }
    .b-del { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 900; cursor: pointer; }

    .dock { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 46px; background: rgba(15, 23, 42, 0.94); border: 1.5px solid rgba(56, 189, 248, 0.5); border-radius: 23px; padding: 4px 6px 4px 12px; display: none; align-items: center; justify-content: space-between; gap: 6px; z-index: 45; backdrop-filter: blur(8px); box-shadow: 0 10px 26px rgba(0,0,0,0.65); }
    .dock-actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .dock-btn { height: 35px; padding: 0 12px; border: none; border-radius: 18px; font-size: 11.5px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .dock-btn.tally { background: var(--teal-dark); border: 1px solid var(--teal); color: #99f6e4; }
    .dock-btn.out { background: var(--rose); color: #fff; }
    .dock-btn.in { background: var(--emerald); color: #052e16; }

    /* ==================== ገጽ 2: ዘመናዊ ቆጠራ (v15 Polished) ==================== */
    .t-cap-bar { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .t-cap-nav { width: 30px; height: 36px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--teal); font-size: 12px; font-weight: 900; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    .t-cap-main { flex: 1; min-width: 0; height: 36px; padding: 0 11px; border-radius: 18px; border: 1.5px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 11.5px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 6px; overflow: hidden; }
    .t-cap-main.dir-out { border-color: rgba(239,68,68,0.5); }
    .t-cap-main.dir-in, .t-cap-main.dir-free { border-color: rgba(16,185,129,0.55); }
    .t-cap-main.dir-audit { border-color: rgba(14,165,233,0.55); }
    .t-cap-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .t-cap-badge { font-family: ui-monospace, monospace; font-size: 11px; color: var(--teal); background: rgba(20,184,166,0.14); padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }
    .t-cap-mult { height: 36px; min-width: 58px; padding: 0 10px; border-radius: 18px; border: 1.5px solid var(--teal); background: var(--teal-dark); color: #99f6e4; font-family: ui-monospace, monospace; font-size: 12px; font-weight: 900; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 3px; }

    .t-top-actions { display: grid; grid-template-columns: 0.78fr 0.78fr 0.8fr 1.64fr; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .t-act-btn { position: relative; height: 36px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 11px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px; overflow: hidden; white-space: nowrap; touch-action: none; }
    .t-act-btn > span { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 3px; }
    .t-act-ico { font-size: 13px; line-height: 1; font-weight: 900; }
    .t-act-btn.commit { background: rgba(20,184,166,0.15); border: 1.5px solid var(--teal); color: #99f6e4; }
    .t-act-btn.commit.ready-done { background: var(--emerald); border-color: #6ee7b7; color: #022c22; box-shadow: 0 0 12px rgba(16,185,129,0.4); }
    .t-hold-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: rgba(239,68,68,0.52); pointer-events: none; z-index: 0; }

    .ticket-bar { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; }
    .tk-tab { height: 30px; padding: 0 11px; border-radius: 15px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .tk-tab.active { background: #172554; border-color: var(--primary); color: #fff; }
    .tk-tab.add { border-style: dashed; border-color: var(--teal); color: var(--teal); }
    .tk-items { display: flex; flex-wrap: wrap; gap: 5px; }
    .tk-pill { height: 32px; padding: 0 10px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
    .tk-pill.active { border-color: var(--teal); background: rgba(20,184,166,0.22); color: #99f6e4; }
    .tk-pill.done { border-color: var(--emerald); background: rgba(16,185,129,0.2); color: #86efac; }
    .tk-pill.add { border-style: dashed; border-color: var(--amber); color: var(--amber); }

    .preset-grid-modal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .preset-btn-lg { height: 42px; border-radius: 10px; border: 1.5px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-family: ui-monospace, monospace; font-size: 14px; font-weight: 900; cursor: pointer; }
    .preset-btn-lg.active { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); }

    .alert-box { display: none; padding: 6px 10px; border-radius: 10px; text-align: center; font-size: 11.5px; font-weight: 900; margin-bottom: 5px; flex-shrink: 0; }
    .alert-box.warn { display: block; background: rgba(245,158,11,0.22); border: 1.5px solid var(--amber); color: #fde68a; }
    .alert-box.clickable { cursor: pointer; box-shadow: 0 0 10px rgba(245,158,11,0.25); }
    .alert-box.stop { display: block; background: var(--emerald); color: #022c22; }
    .alert-box.over { display: block; background: rgba(14,165,233,0.18); border: 1.5px solid var(--primary); color: #7dd3fc; }

    .t-stage { position: relative; flex: 1; min-height: 0; background: radial-gradient(circle at 50% 0%, rgba(20,184,166,0.08) 0%, var(--surface-deep) 68%); border: 1.5px solid var(--border-strong); border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 8px; transition: border-color 0.25s ease, box-shadow 0.45s ease; }
    .t-stage.glow-ok { border-color: var(--emerald); box-shadow: inset 0 0 22px rgba(16,185,129,0.28), 0 0 14px rgba(16,185,129,0.25); }
    .t-stage.glow-batch { border-color: var(--amber); box-shadow: inset 0 0 26px rgba(245,158,11,0.34), 0 0 16px rgba(245,158,11,0.3); }
    .t-stage.done { border-color: var(--emerald); }
    .t-stage.near { border-color: var(--amber); }
    .t-prog-track { width: 100%; height: 4px; background: rgba(148,163,184,0.14); flex-shrink: 0; }
    .t-prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--emerald)); transition: width 0.2s ease; }

    .t-stats-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 7px 6px 6px; background: rgba(15,23,42,0.92); border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 25; }
    .t-kpi { background: rgba(6,10,18,0.62); border: 1px solid var(--border); border-radius: 9px; padding: 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; }
    .t-kpi-lbl { font-size: 8.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .t-kpi-val { font-family: ui-monospace, monospace; font-size: 17px; font-weight: 900; line-height: 1.18; color: var(--text); white-space: nowrap; }
    .t-kpi-val.sm { font-size: 12.5px; }
    .t-kpi-val.c-em { color: #6ee7b7; }
    .t-kpi-val.c-tl { color: #5eead4; }
    .t-kpi-val.c-am { color: #fcd34d; }
    .t-kpi-val.c-pr { color: #7dd3fc; }

    .t-stage-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .t-visual { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 10px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
    .t-visual.tally-mode { justify-content: flex-start; }

    .batch-summary { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(15,23,42,0.85); border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; }
    .batch-chip { font-family: ui-monospace, monospace; font-size: 11px; font-weight: 900; color: var(--teal); }
    .batch-sub { font-size: 10px; font-weight: 800; color: var(--muted); }
    .dot-ring { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 4px 6px; }

    .tally-compact-bar { background: rgba(20,184,166,0.14); border: 1px solid var(--teal); border-radius: 8px; padding: 4px 9px; font-size: 10.5px; font-weight: 900; color: #99f6e4; text-align: center; }
    .tally-row-5 { display: grid; grid-template-columns: repeat(5, 1fr) 44px; align-items: center; gap: 4px; padding: 3px 0; border-bottom: 1px dashed rgba(51,65,85,0.45); }
    .tally-row-tot { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 900; color: var(--muted); text-align: right; }

    /* መቆለፊያው 4ቱን KPI ሳይሸፍን የታችኛውን visual ብቻ ይሸፍናል */
    .t-pause-mask { position: absolute; inset: 0; z-index: 20; background: rgba(6,10,18,0.92); backdrop-filter: blur(5px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; text-align: center; }

    /* ብቸኛ የታችኛው የአውራ ጣት መቁጠሪያ ቀጠና (ሲቆለፍ በግልጽ ይደበዝዛል) */
    .t-trigger-wrap { margin-bottom: max(10px, env(safe-area-inset-bottom)); flex-shrink: 0; position: relative; transition: opacity 0.18s ease, filter 0.18s ease; }
    .t-trigger-wrap.paused { opacity: 0.32; filter: grayscale(0.75); }
    .sg-track { position: relative; height: 68px; border-radius: 34px; background: linear-gradient(90deg, rgba(15,23,42,0.96), rgba(4,47,46,0.92)); border: 2px solid var(--teal); overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 12px rgba(0,0,0,0.65); }
    .sg-track.odd-fin { border-color: var(--amber); background: linear-gradient(90deg, rgba(15,23,42,0.96), rgba(69,26,3,0.92)); }
    .sg-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, rgba(20,184,166,0.3), rgba(16,185,129,0.55)); pointer-events: none; }
    .sg-label { font-size: 14px; font-weight: 900; color: #99f6e4; letter-spacing: 0.2px; pointer-events: none; z-index: 1; padding-left: 44px; }
    .sg-thumb { position: absolute; left: 4px; top: 4px; width: 74px; height: 56px; border-radius: 28px; background: linear-gradient(135deg, #2dd4bf, #0d9488); color: #022c22; font-size: 18px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 16px rgba(20,184,166,0.5); cursor: grab; z-index: 2; will-change: transform; }
    .sg-track.odd-fin .sg-thumb { background: linear-gradient(135deg, #fbbf24, #d97706); color: #451a03; }
    .sg-thumb.snap { transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1); }

    .pp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pp-btn { height: 68px; border-radius: 18px; border: 2px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 13.5px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; opacity: 0.42; }
    .pp-btn.ready { opacity: 1; background: linear-gradient(135deg, rgba(20,184,166,0.28), rgba(16,185,129,0.22)); border-color: var(--teal); color: #ccfbf1; box-shadow: 0 0 14px rgba(20,184,166,0.25); }

    .tap-btn { position: relative; width: 100%; height: 68px; border-radius: 18px; border: 2px solid var(--teal); background: linear-gradient(135deg, rgba(20,184,166,0.28), rgba(14,165,233,0.18)); color: #ccfbf1; font-size: 15.5px; font-weight: 900; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tap-btn.odd-fin { border-color: var(--amber); background: linear-gradient(135deg, rgba(245,158,11,0.34), rgba(217,119,6,0.22)); color: #fef3c7; }
    .tap-cd-bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 0%; background: var(--amber); pointer-events: none; }

    .mc-grid { display: grid; gap: 6px; }
    .mc-btn { position: relative; height: 68px; border-radius: 16px; border: 2px solid var(--border-strong); background: var(--surface); color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
    .mc-btn.c0 { border-color: var(--primary); background: rgba(14,165,233,0.22); }
    .mc-btn.c1 { border-color: var(--emerald); background: rgba(16,185,129,0.22); }
    .mc-btn.c2 { border-color: var(--amber); background: rgba(245,158,11,0.22); }
    .mc-btn.c3 { border-color: var(--violet); background: rgba(168,85,247,0.22); }
    .mc-btn.cooling { opacity: 0.45; }
    .mc-cnt { font-family: ui-monospace, monospace; font-size: 15px; font-weight: 900; }

    /* ሠንጠረዦች + Live Google Sheets WYSIWYG Preview */
    .metrics { display: flex; justify-content: space-around; background: var(--surface-deep); border: 1px solid var(--border); border-radius: 7px; padding: 4px; margin-top: 5px; font-size: 10.5px; font-weight: 900; }
    .tbl-wrap { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; margin-bottom: max(8px, env(safe-area-inset-bottom)); transition: background 0.15s ease; }

    table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }

    tr.r-in { background: rgba(16,185,129,0.14); color: #a7f3d0; }
    tr.r-void { background: rgba(239,68,68,0.18); color: #fca5a5; }
    tr.r-adj { background: rgba(14,165,233,0.16); color: #bae6fd; }
    tr.r-zero { background: rgba(245,158,11,0.22); color: #fde68a; }
    tr.r-cat { background: #143323; color: #6ee7b7; cursor: pointer; }

    tr.r-sel td:first-child { border-left: 3px solid var(--emerald); }
    tr.r-sp td { height: 8px; padding: 0; background: var(--bg); border-left: none; border-right: none; }
    tr.r-ltz-sp td { height: 6px; padding: 0; background: rgba(6,10,18,0.65); border-left: none; border-right: none; }
    .act-pair { display: inline-flex; gap: 4px; align-items: center; justify-content: center; }

    .tbl-wrap.wysiwyg { background: var(--sh-page-bg, #fff); border: 2px solid var(--teal); }
    .tbl-wrap.wysiwyg table.tbl { font-size: var(--sh-font, 12px); table-layout: var(--sh-layout, auto); }
    .tbl-wrap.wysiwyg table.tbl th {
      background: var(--sh-th-bg, #0f172a) !important; color: var(--sh-th-clr, #fff) !important;
      border-color: var(--sh-brd-clr, #cbd5e1) !important; height: var(--sh-row-h, 26px);
      font-size: var(--sh-font, 12px); white-space: var(--sh-wrap, nowrap);
    }
    .tbl-wrap.wysiwyg table.tbl td {
      height: var(--sh-row-h, 26px); padding: var(--sh-pad-y, 4px) var(--sh-pad-x, 6px);
      border-color: var(--sh-brd-clr, #cbd5e1) !important; border-width: var(--sh-brd-w, 1px);
      font-weight: var(--sh-fw, 800); font-style: var(--sh-fs, normal);
      vertical-align: var(--sh-valign, middle); white-space: var(--sh-wrap, nowrap);
      word-break: var(--sh-break, normal);
    }
    .tbl-wrap.wysiwyg table.tbl tr { background: var(--sh-row-bg, #fff); color: var(--sh-row-clr, #0f172a); }
    .tbl-wrap.wysiwyg table.tbl tr.r-cat { background: var(--sh-cat-bg, #1c4532) !important; color: var(--sh-cat-clr, #fff) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-zero { background: var(--sh-zero-bg, #f8d7da) !important; color: var(--sh-zero-clr, #991b1b) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-low { background: var(--sh-low-bg, #fff3cd) !important; color: var(--sh-low-clr, #92400e) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-in { background: var(--sh-in-bg, #d1fae5) !important; color: var(--sh-row-clr, #0f172a) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-void { background: var(--sh-zero-bg, #f8d7da) !important; color: var(--sh-zero-clr, #991b1b) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-adj { background: var(--sh-adj-bg, #dbeafe) !important; color: var(--sh-row-clr, #0f172a) !important; }
    .tbl-wrap.wysiwyg table.tbl tr.r-sp td, .tbl-wrap.wysiwyg table.tbl tr.r-ltz-sp td { background: var(--sh-page-bg, #fff) !important; height: 5px; padding: 0; }
    .tbl-wrap.wysiwyg td.c-txt { text-align: var(--sh-txt-al, left) !important; }

    .tbl-wrap.wysiwyg .num-in, .tbl-wrap.wysiwyg .num-out { color: inherit !important; }

    /* Inline Google Sheets Formatting Bar (Bottom) */
    .sheet-fmt-bar { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 12px); max-width: 628px; height: 48px; background: rgba(9, 15, 29, 0.96); border: 1.5px solid var(--teal); border-radius: 16px; padding: 0 7px; display: none; align-items: center; gap: 5px; overflow-x: auto; z-index: 70; backdrop-filter: blur(10px); box-shadow: 0 12px 28px rgba(0,0,0,0.8); }
    .sheet-fmt-bar.open { display: flex; }
    .sheet-fmt-panel { position: fixed; bottom: calc(62px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; max-height: 44vh; overflow-y: auto; background: rgba(15, 23, 42, 0.97); border: 1.5px solid var(--border-strong); border-radius: 16px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 69; backdrop-filter: blur(10px); box-shadow: 0 16px 36px rgba(0,0,0,0.82); }
    .sheet-fmt-panel.open { display: flex; }

    .gs-bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .gs-btn { min-width: 32px; height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 12px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 3px; flex-shrink: 0; white-space: nowrap; }
    .gs-btn.on { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); }
    .gs-stepper { display: inline-flex; align-items: center; height: 32px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); overflow: hidden; flex-shrink: 0; }
    .gs-stepper button { width: 26px; height: 100%; border: none; background: transparent; color: var(--teal); font-size: 15px; font-weight: 900; cursor: pointer; }
    .gs-stepper span { min-width: 32px; text-align: center; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 900; color: var(--text); }
    .gs-col-row { display: grid; grid-template-columns: 88px 1fr 38px; gap: 6px; align-items: center; font-size: 11px; font-weight: 800; }
    .gs-range { width: 100%; accent-color: var(--teal); height: 18px; }
    .gs-swatches { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
    .gs-swatch { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-strong); cursor: pointer; }
    .gs-swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--teal); transform: scale(1.1); }

    /* ተንሳፋፊ የፒዲኤፍ ምርጫ አሞሌ */
    .pdf-bar { position: fixed; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 44px; background: rgba(6,78,59,0.94); border: 1.5px solid var(--emerald); border-radius: 22px; padding: 4px 8px; display: none; align-items: center; justify-content: space-between; gap: 5px; z-index: 65; backdrop-filter: blur(8px); }
    .pdf-pill { height: 30px; padding: 0 9px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.22); background: rgba(15,23,42,0.84); color: #fff; font-size: 10.5px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .pdf-send { height: 32px; padding: 0 11px; border-radius: 16px; border: none; background: var(--emerald); color: #052e16; font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }

    /* ካርታ */
    .rack-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 6px; flex-shrink: 0; }
    .rack-tab { min-width: 72px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .rack-tab.active { background: var(--primary); color: #fff; border-color: #7dd3fc; }
    .rack-wrap { flex: 1; overflow: auto; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px; margin-bottom: max(8px, env(safe-area-inset-bottom)); }
    .rack-grid { display: grid; gap: 5px; min-width: 280px; }
    .bin { min-height: 54px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; }
    .bin.used { background: #064e3b; border-color: var(--emerald); }
    .bin.hl { border: 2px dashed var(--amber); background: #451a03; }
    .bin.sel { border: 2px solid var(--primary); background: #0369a1; }
    .bin-id { font-size: 9.5px; font-weight: 900; color: var(--primary); }
    .bin-it { font-size: 8.5px; font-weight: 800; word-break: break-word; }

    /* የታችኛው አውራ ጣት ዳሰሳ */
    .bottom-nav { position: fixed; bottom: max(6px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 50px; background: rgba(15,23,42,0.84); border: 1px solid rgba(255,255,255,0.22); border-radius: 25px; display: flex; align-items: center; padding: 3px 4px; z-index: 50; backdrop-filter: blur(8px); }
    .shell.focus-mode .bottom-nav, .shell.nav-hidden .bottom-nav { display: none !important; }
    .nav-item { flex: 1; height: 42px; border-radius: 21px; border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .nav-item .ico { font-size: 15px; line-height: 1; }
    .nav-item.active { background: rgba(14,165,233,0.45); color: #fff; border: 1px solid rgba(56,189,248,0.7); }

    /* ሞዳል እና ማሳወቂያ */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; padding: 10px; z-index: 800; }
    .modal-bg.open { display: flex; }
    .modal-card { width: 100%; max-width: 440px; max-height: 90vh; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 900; color: var(--teal); }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .modal-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-top: 6px; border-top: 1px solid var(--border); }
    .btn { height: 40px; border-radius: 10px; border: none; font-size: 12px; font-weight: 900; cursor: pointer; padding: 0 12px; color: #fff; }
    .btn.teal { background: var(--teal); color: var(--teal-dark); }
    .btn.primary { background: var(--primary); }
    .btn.danger { background: var(--rose); }
    .btn.hard-del { background: #7f1d1d; border: 1px solid var(--rose); color: #fecaca; }
    .btn.muted { background: #1e293b; color: var(--text); }
    .sub-card { background: var(--surface-deep); border: 1px solid var(--border); border-radius: 10px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
    .lbl-sm { font-size: 10px; font-weight: 900; color: var(--muted); }
    .chk-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #042f2e; border: 1px solid var(--teal); color: #99f6e4; padding: 9px 14px; border-radius: 12px; font-size: 12px; font-weight: 900; z-index: 999; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.7); max-width: 92vw; }
    .toast-btn { background: var(--amber); color: #000; border: none; border-radius: 7px; padding: 4px 8px; font-size: 11px; font-weight: 900; cursor: pointer; }
    video.qr-video { width: 100%; border-radius: 12px; background: #000; max-height: 260px; object-fit: cover; }

    /* ባለገጽ ፒዲኤፍ መሳያ መድረክ */
    #pdfStage { position: fixed; left: -14000px; top: 0; background: #fff; color: #000; font-family: system-ui, Arial, sans-serif; }
    .pdf-page-box { background: #ffffff; color: #0f172a; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; position: relative; }
    .pdf-page-body { flex: 1; overflow: hidden; }
    .pdf-page-foot { margin-top: auto; padding-top: 6px; }
    @media (min-width: 640px) { .modal-bg { align-items: center; } }
  </style>
</head>
<body>

  <!-- መግቢያ -->
  <div id="loginGate" class="gate">
    <div class="gate-card">
      <div class="gate-mark" id="gateMark">መ</div>
      <div class="gate-title" id="lblGateTitle"></div>
      <div class="seg" style="margin-bottom:2px;">
        <button type="button" id="btnAuthEmail" class="seg-btn teal" onclick="setAuthMode('EMAIL')"></button>
        <button type="button" id="btnAuthPin" class="seg-btn" onclick="setAuthMode('PIN')"></button>
      </div>

      s = s.replace(/(\d|Ø)\s*[xX*](?=$|\s)/g, '$1×');
      return s;
    }

    function onSmartDimInput(el) {

    function parseLtzInfo(name) {
      const m = String(name || '').trim().match(/^(\d+(?:\.\d+)?)\s*([LTZ])\s*[×x*]\s*(\d+(?:\.\d+)?)/i);
      if (!m) return null;
      const letterRank = { L: 1, T: 2, Z: 3 }[m[2].toUpperCase()] || 9;
      return { size: parseFloat(m[1]), thick: parseFloat(m[3]), letterRank, groupKey: `${m[1]}_${m[3]}` };
    }

    function naturalTokens(str) { return String(str || '').toLowerCase().match(/(\d+(?:\.\d+)?|\D+)/g) || []; }

    function compareItemsSmart(aName, bName, catName = '') {
      const isLtzCat = /ltz/i.test(catName);
      const la = parseLtzInfo(aName), lb = parseLtzInfo(bName);
      if (isLtzCat || (la && lb)) {
        if (la && lb) {
          if (la.size !== lb.size) return la.size - lb.size;
          if (la.thick !== lb.thick) return la.thick - lb.thick;
          if (la.letterRank !== lb.letterRank) return la.letterRank - lb.letterRank;
        } else if (la) return -1;
        else if (lb) return 1;
      }
      const ta = naturalTokens(aName), tb = naturalTokens(bName);
      const len = Math.max(ta.length, tb.length);
      for (let i = 0; i < len; i++) {
        if (ta[i] === undefined) return -1;
        if (tb[i] === undefined) return 1;
        const na = parseFloat(ta[i]), nb = parseFloat(tb[i]);
        if (!isNaN(na) && !isNaN(nb)) { if (na !== nb) return na - nb; }
        else { const c = ta[i].localeCompare(tb[i]); if (c !== 0) return c; }
      }
      return 0;
    }

    function playTone(f, d, type = 'sine', vol = 0.12) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch {}
    }

    // ==================== የአማርኛ እና እንግሊዝኛ ድምፅ ቆጣሪ (am-ET + Phonetic + Android Fix) ====================
    function numberToAmharicWords(num) {
      const n = Math.floor(Math.abs(Number(num || 0)));
      if (n === 0) return 'ዜሮ';
      const ones = ['', 'አንድ', 'ሁለት', 'ሶስት', 'አራት', 'አምስት', 'ስድስት', 'ሰባት', 'ስምንት', 'ዘጠኝ'];
      const tens = ['', 'አስር', 'ሃያ', 'ሰላሳ', 'አርባ', 'ሃምሳ', 'ስልሳ', 'ሰባ', 'ሰማንያ', 'ዘጠና'];
      const sub100 = (x) => {
        if (x < 10) return ones[x];
        if (x === 10) return 'አስር';
        if (x < 20) return `አስራ ${ones[x - 10]}`;
        const tPart = tens[Math.floor(x / 10)];
        const oPart = ones[x % 10];
        return oPart ? `${tPart} ${oPart}` : tPart;
      };
      const sub1000 = (x) => {
        if (x < 100) return sub100(x);
        const h = Math.floor(x / 100);
        const r = x % 100;
        const hTxt = h === 1 ? 'መቶ' : `${ones[h]} መቶ`;
        return r ? `${hTxt} ${sub100(r)}` : hTxt;
      };
      if (n < 1000) return sub1000(n);
      const th = Math.floor(n / 1000);
      const rem = n % 1000;
      return rem ? `${sub1000(th)} ሺህ ${sub1000(rem)}` : `${sub1000(th)} ሺህ`;
    }

    function numberToAmharicPhonetic(num) {
      const n = Math.floor(Math.abs(Number(num || 0)));
      if (n === 0) return 'zero';
      const ones = ['', 'ahnd', 'hoo-let', 'sost', 'ah-rat', 'ah-mist', 'sid-dist', 'sa-bat', 'si-mint', 'ze-tegn'];
      const tens = ['', 'ah-sir', 'ha-ya', 'se-la-sa', 'ar-ba', 'ham-sa', 'sil-sa', 'se-ba', 'se-man-ya', 'ze-te-na'];
      const sub100 = (x) => {
        if (x < 10) return ones[x];
        if (x === 10) return 'ah-sir';
        if (x < 20) return `ah-sra ${ones[x - 10]}`;
        const tPart = tens[Math.floor(x / 10)];
        const oPart = ones[x % 10];
        return oPart ? `${tPart} ${oPart}` : tPart;
      };
      const sub1000 = (x) => {
        if (x < 100) return sub100(x);
        const h = Math.floor(x / 100);
        const r = x % 100;
        const hTxt = h === 1 ? 'me-to' : `${ones[h]} me-to`;
        return r ? `${hTxt} ${sub100(r)}` : hTxt;
      };
      if (n < 1000) return sub1000(n);
      const th = Math.floor(n / 1000);
      const rem = n % 1000;
      return rem ? `${sub1000(th)} shee ${sub1000(rem)}` : `${sub1000(th)} shee`;
    }

    function speakCount(loadsNum, totalQty) {
      if (!tallyCfg.voiceCallout || !('speechSynthesis' in window)) return;
      try {
        const val = tallyCfg.voiceMode === 'TOTAL' ? totalQty : loadsNum;
        const wantAm = tallyCfg.voiceLang !== 'en';
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const amVoice = voices.find((v) => /^am/i.test(v.lang) || /amharic/i.test(v.name));

        const u = new SpeechSynthesisUtterance();
        if (wantAm && amVoice) {
          u.text = numberToAmharicWords(val);
          u.voice = amVoice;
          u.lang = 'am-ET';
          u.rate = 1.1;
        } else if (wantAm) {
          u.text = numberToAmharicPhonetic(val);
          const enVoice = voices.find((v) => /^en/i.test(v.lang));
          if (enVoice) u.voice = enVoice;
          u.lang = 'en-US';
          u.rate = 1.05;
        } else {
          u.text = String(val);
          const enVoice = voices.find((v) => /^en/i.test(v.lang));
          if (enVoice) u.voice = enVoice;
          u.lang = 'en-US';
          u.rate = 1.15;
        }

        if (speakTimer) clearTimeout(speakTimer);
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
          speakTimer = setTimeout(() => { try { window.speechSynthesis.speak(u); } catch {} }, 55);
        } else {
          window.speechSynthesis.speak(u);
        }
      } catch {}
    }

    // ==================== API (Timeout + Safe Parse) & Offline Queue ====================
    async function callRpc(fnName, params = {}, timeoutMs = 15000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
          method: 'POST',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify(params),
        });
        const text = await res.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch { throw new Error(`HTTP_${res.status}`); }
        if (!res.ok) throw new Error(data.message || data.error || `HTTP_${res.status}`);
        return data;
      } finally {
        clearTimeout(timer);
      }
    }

    async function callBot(payload, timeoutMs = 20000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
          method: 'POST',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'x-session-token': session?.token || '' },
          body: JSON.stringify({ ...payload, token: session?.token || '', function_name: BOT_FUNCTION }),
        });
        const text = await res.text();
        try { return text ? JSON.parse(text) : { success: res.ok }; } catch { return { success: false, error: `HTTP_${res.status}` }; }
      } finally {
        clearTimeout(timer);
      }
    }

    async function syncOfflineQueue(onlyJobId = null) {
      if (isSyncingQueue || !navigator.onLine || !session?.token) return;
      const myJobs = getMyOfflineQueue().filter((j) => !onlyJobId || j.id === onlyJobId);
      if (!myJobs.length) return;
      isSyncingQueue = true;
      let synced = 0;
      try {
        for (const job of myJobs) {
          try {
            const r = await callRpc('rpc_post_document', { ...job.params, p_token: session.token }, 15000);
            if (r && r.success) {
              synced++;
              const cur = getAllOfflineQueue().filter((x) => x.id !== job.id);

    function startBasketDrag(rowEl, e) {
      if (basket.length <= 1) return;
      e.preventDefault();
      const list = document.getElementById('basketList');
      dragEl = rowEl; dragIdx = Array.from(list.children).indexOf(rowEl);
      rowEl.classList.add('dragging'); vib(30);

      const onMove = (ev) => {
        if (!dragEl) return;
        const rows = Array.from(list.children);
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i].getBoundingClientRect();
          if (ev.clientY >= r.top && ev.clientY <= r.bottom && i !== dragIdx) {
            const moved = basket.splice(dragIdx, 1)[0];
            basket.splice(i, 0, moved);
            list.insertBefore(dragEl, i < dragIdx ? rows[i] : rows[i].nextSibling);
            dragIdx = i; vib(14);
            Array.from(list.children).forEach((el, k) => el.querySelector('.b-drag').textContent = k + 1);
            break;
          }
        }
      };
      const onUp = () => {
        if (dragEl) dragEl.classList.remove('dragging');
        dragEl = null; dragIdx = -1;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    async function submitGenericDocument(docType, docNo, party, ref, itemsPayload, onSuccess, btnEl = null) {
      if (!itemsPayload.length) { showToast(t('errNeedCount')); return; }
      if (docType === 'OUT' && !docNo) { showToast(t('errNeedDoc')); return; }

      await withBusy(btnEl, async () => {
        if (docType === 'OUT' && navigator.onLine) {
          try {
            const chk = await callRpc('rpc_check_doc_sequence', { p_token: session.token, p_warehouse_id: currentWhId, p_doc_no: docNo }, 6000);
            if (chk && chk.is_duplicate) {
              openDuplicateModal(docNo, chk.existing, (adminPin) => executePostDocument(docType, docNo, party, ref, itemsPayload, null, adminPin, onSuccess));
              return;
            }
            const nVal = Number(docNo);
            if (whData.last_doc_num > 0 && nVal > whData.next_doc_num && !/^\d+-\d+$/.test(docNo)) {
              openSeqJumpModal(docNo, whData.next_doc_num, (voidRange) => executePostDocument(docType, docNo, party, ref, itemsPayload, voidRange, null, onSuccess));
              return;
            }
          } catch {}
        }
        await executePostDocument(docType, docNo, party, ref, itemsPayload, null, null, onSuccess);
      });
    }

    async function executePostDocument(docType, docNo, party, ref, itemsPayload, voidRangeFirst, adminPin, onSuccess) {
      const params = {
        p_token: session.token, p_warehouse_id: currentWhId, p_doc_type: docType,
        p_doc_no: docNo, p_party_name: party, p_ref_no: ref, p_items: itemsPayload,
        p_idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : 'k_' + Date.now() + '_' + Math.random()),
        p_void_range_first: voidRangeFirst, p_admin_override_pin: adminPin,
      };

      if (!navigator.onLine) {
        enqueueOfflineJob(params);
        if (onSuccess) onSuccess(); renderBasket();
        showToast(t('offlineSaved')); return;
      }

      try {
        const res = await callRpc('rpc_post_document', params);
        if (!res.success) { showToast(res.error === 'INSUFFICIENT_STOCK' ? t('errStock') : t('errGeneric')); return; }
        vib([35, 30, 50]); playTone(680, 0.1, 'triangle');
        if (docType === 'IN' && res.document_id) {
          callBot({ action: 'send_grn', warehouse_id: currentWhId, document_id: res.document_id }).catch(() => {});
        }
        if (onSuccess) onSuccess();
        showToast(t('savedOk') + (res.zero_out_items?.length ? ` ⚠️ 0: ${res.zero_out_items.join(', ')}` : ''));
        loadWarehouseData(currentWhId);
      } catch {
        enqueueOfflineJob(params);
        if (onSuccess) onSuccess(); renderBasket();
        showToast(t('offlineSaved'));
      }
    }

    async function executeDirectVoid(docNo) {
      closeMainModal();
      await withBusy(null, async () => {
        try {
          const res = await callRpc('rpc_post_document', {
            p_token: session.token, p_warehouse_id: currentWhId, p_doc_type: 'VOID',
            p_doc_no: docNo, p_party_name: t('voidLabel'), p_ref_no: '-', p_items: [],

    // ==================== ገጽ 2: ዘመናዊ ቆጠራ ሞተር (v15) ====================
    function getTallyStorageKey() { return TALLY_STATE_PREFIX + (currentWhId || 'default'); }

    function normalizeTicket(tk) {
      return {
        id: tk.id || ('tk_' + Date.now()),
        dir: tk.dir === 'IN' ? 'IN' : 'OUT',
        docNo: tk.docNo || '',
        party: tk.party || '',
        pad: tk.pad !== undefined ? tk.pad : (tk.dir !== 'IN' ? (tk.ref || '') : ''),
        driver: tk.driver || '',
        plate: tk.plate !== undefined ? tk.plate : (tk.dir === 'IN' ? (tk.ref || '') : ''),
        kg: tk.kg || '',
        note: tk.note || '',
        custom: tk.custom && typeof tk.custom === 'object' ? tk.custom : {},
        items: Array.isArray(tk.items) ? tk.items : [],
        activeItemId: tk.activeItemId || '',
      };
    }

    function loadTallyState() {
      const st = loadJson(getTallyStorageKey(), null);
      if (st) {
        tallyTab = st.tallyTab || 'TICKET'; carryMult = st.carryMult || 5;
        tickets = Array.isArray(st.tickets) ? st.tickets.map(normalizeTicket) : [];
        activeTicketId = st.activeTicketId || '';
        freeTally = { label: '', target: 0, lockTarget: true, strokes: [], ...(st.freeTally || {}) };
        auditTally = st.auditTally || { itemId: '', strokes: [] };
      } else {
        tallyTab = 'TICKET'; carryMult = 5; tickets = []; activeTicketId = '';
        freeTally = { label: '', target: 0, lockTarget: true, strokes: [] };
        auditTally = { itemId: '', strokes: [] };
      }
      ensureDefaultTicket();
    }

    function saveTallyState() {
      saveJson(getTallyStorageKey(), { tallyTab, carryMult, tickets, activeTicketId, freeTally, auditTally });
    }

    function ensureDefaultTicket() {
      if (!tickets.length) {
        const id = 'tk_' + Date.now();
        tickets.push(normalizeTicket({ id, dir: 'OUT', docNo: String(whData.next_doc_num || '') }));
        activeTicketId = id; saveTallyState();
      } else if (!tickets.some((x) => x.id === activeTicketId)) activeTicketId = tickets[0].id;
    }

    function getActiveTicket() { ensureDefaultTicket(); return tickets.find((x) => x.id === activeTicketId) || tickets[0]; }
    function getActiveTicketItem() {
      const tk = getActiveTicket();
      if (!tk || !tk.items.length) return null;
      let it = tk.items.find((x) => x.item_id === tk.activeItemId);
      if (!it) { it = tk.items[0]; tk.activeItemId = it.item_id; }
      return it;
    }

    function addNewTicket() {
      vib(20);
      const maxDoc = tickets.reduce((m, tk) => Math.max(m, docNumInt(tk.docNo)), Number(whData.last_doc_num || 0));
      const id = 'tk_' + Date.now() + '_' + Math.floor(Math.random() * 99);
      tickets.push(normalizeTicket({ id, dir: 'OUT', docNo: maxDoc > 0 ? String(maxDoc + 1) : '' }));
      activeTicketId = id; saveTallyState(); renderTally(true);
      if (document.getElementById('mainModal')?.classList.contains('open')) openTallyCapsuleModal();
    }

    function selectTicket(id) {
      vib(15); activeTicketId = id; saveTallyState(); renderTally(true);
      if (document.getElementById('mainModal')?.classList.contains('open')) openTallyCapsuleModal();
    }

    function confirmDeleteActiveTicket() {
      const tk = getActiveTicket();
      const hasStrokes = (tk.items || []).some((x) => (x.strokes || []).length > 0);
      if (!hasStrokes) { deleteActiveTicketNow(); return; }
      openMainModal(t('del'), `<div class="sub-card" style="font-size:12px;font-weight:800;">${esc(t('confirmDelAsk'))}</div>`,
        `<button type="button" class="btn muted" onclick="openTallyCapsuleModal()">${esc(t('cancel'))}</button>
         <button type="button" class="btn danger" onclick="deleteActiveTicketNow()">${esc(t('del'))}</button>`);
    }

    function deleteActiveTicketNow() {
      vib(22); tickets = tickets.filter((x) => x.id !== activeTicketId); ensureDefaultTicket(); saveTallyState(); renderTally(true);
      openTallyCapsuleModal();
    }

    function toggleTicketDir() {
      const tk = getActiveTicket(); tk.dir = tk.dir === 'OUT' ? 'IN' : 'OUT'; vib(16); saveTallyState(); renderTally(true);
      if (document.getElementById('mainModal')?.classList.contains('open')) openTallyCapsuleModal();
    }

    function updateTicketField(field, val) {
      const tk = getActiveTicket(); tk[field] = val; saveTallyState(); renderTallyCapsule();
    }

    function updateTicketCustomField(cfId, val) {
      const tk = getActiveTicket();
      if (!tk.custom) tk.custom = {};
      tk.custom[cfId] = val;
      saveTallyState();
    }

    function cycleTicketItem(delta) {
      const tk = getActiveTicket();
      if (!tk || tk.items.length <= 1) return;
      vib(15);
      const idx = Math.max(0, tk.items.findIndex((x) => x.item_id === tk.activeItemId));
      const next = (idx + delta + tk.items.length) % tk.items.length;
      tk.activeItemId = tk.items[next].item_id;
      saveTallyState(); renderTally(true);
    }

    function selectTicketItem(itemId, keepModal = false) {
      const tk = getActiveTicket(); tk.activeItemId = itemId; vib(15); saveTallyState(); renderTally(true);
      if (!keepModal) closeMainModal(); else openTallyCapsuleModal();
    }

    function setTallyTab(tab) { tallyTab = tab; vib(16); saveTallyState(); renderTally(true); }

    function renderTallyCapsule() {
      const bar = document.getElementById('tallyCapsuleBar');
      if (!bar) return;
      const multBtn = `<button type="button" class="t-cap-mult" onclick="openCarryMultModal()">×${carryMult} ▾</button>`;

      if (tallyTab === 'TICKET') {
        const tk = getActiveTicket();
        const tkIdx = Math.max(0, tickets.findIndex((x) => x.id === tk.id));
        const tkName = (tk.dir === 'OUT' && tk.docNo) ? tk.docNo : `${t('tkShort')} ${tkIdx + 1}`;
        const item = getActiveTicketItem();
        const cnt = item ? sumStrokes(item.strokes) : 0;
        const stat = item ? (item.target > 0 ? `${cnt}/${item.target}` : String(cnt)) : `+ ${t('tkAddItem')}`;
        const itemLabel = item ? item.name : t('tkAddItem');
        const dirTag = tk.dir === 'OUT' ? t('tkDirOut') : t('tkDirIn');
        const dirCls = tk.dir === 'OUT' ? 'dir-out' : 'dir-in';
        const hasMulti = tk.items.length > 1;

        bar.innerHTML = `
          ${hasMulti ? `<button type="button" class="t-cap-nav" onclick="cycleTicketItem(-1)">◀</button>` : ''}
          <button type="button" class="t-cap-main ${dirCls}" onclick="openTallyCapsuleModal()">
            <span class="t-cap-txt"><span>🚛 ${esc(tkName)}</span><span style="opacity:0.45;">·</span><span style="color:var(--muted);font-size:10px;">${esc(dirTag)}</span><span style="opacity:0.45;">·</span><span>${esc(itemLabel)}</span></span>
            <span class="t-cap-badge">${esc(stat)} ▾</span>
          </button>
          ${hasMulti ? `<button type="button" class="t-cap-nav" onclick="cycleTicketItem(1)">▶</button>` : ''}
          ${multBtn}`;
        return;
      }

      if (tallyTab === 'FREE') {
        const cnt = sumStrokes(freeTally.strokes);
        const hasTrg = freeTally.target > 0;
        const stat = hasTrg ? `${cnt}/${freeTally.target}` : String(cnt);
        const lbl = (freeTally.label || '').trim() || t('tFree');
        const trgTag = hasTrg ? `<span style="font-size:11px;">🎯</span>` : '';
        bar.innerHTML = `
          <button type="button" class="t-cap-main dir-free" onclick="openTallyCapsuleModal()">

            <span class="t-cap-badge">${esc(stat)} ▾</span>
          </button>
          ${multBtn}`;
        return;
      }

      const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
      const itName = it ? it.name : t('auditManageTitle');
      const sysBal = it ? `${t('tSysBal')}: ${Number(it.stock).toLocaleString()}` : '-';
      bar.innerHTML = `
        <button type="button" class="t-cap-main dir-audit" onclick="openTallyCapsuleModal()">
          <span class="t-cap-txt"><span>🔎 ${esc(itName)}</span></span>
          <span class="t-cap-badge">${esc(sysBal)} ▾</span>
        </button>
        ${multBtn}`;
    }

          <button type="button" class="icon-btn" style="width:24px;height:24px;color:var(--rose);" onclick="removeTicketItem('${escJs(x.item_id)}')">✕</button>
        </div>`).join('') || `<div class="lbl-sm" style="text-align:center;">${esc(t('noItems'))}</div>`;

      openMainModal(t('tkAddModalTitle'), `
        <div class="sub-card">

          <select id="tkModSel" class="sel">${itemOpts}</select>
          <div class="grid-2">
