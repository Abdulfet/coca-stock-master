    function filterTkItemSelect(q) {
      const clean = q.trim().toLowerCase();
      document.getElementById('tkModSel').innerHTML = (whData.items || [])
        .filter((it) => !clean || it.name.toLowerCase().includes(clean))
        .sort((a, b) => compareItemsSmart(a.name, b.name, a.category_name || ''))
        .map((it) => `<option value="${esc(it.id)}">${esc(it.name)} (${it.stock})</option>`).join('');
    }

    function pushItemToTicket() {
      const itemId = document.getElementById('tkModSel')?.value;
      const it = (whData.items || []).find((x) => x.id === itemId);
      if (!it) return;
      const target = Math.max(0, Math.floor(Number(document.getElementById('tkModTarget').value || 0)));
      const tk = getActiveTicket();
      const ex = tk.items.find((x) => x.item_id === itemId);
      if (ex) ex.target = target; else tk.items.push({ item_id: it.id, name: it.name, target, strokes: [] });
      tk.activeItemId = itemId; vib(20); saveTallyState(); openTicketAddItemModal();
    }

    function removeTicketItem(itemId) {
      vib(16);
      const tk = getActiveTicket();
      tk.items = tk.items.filter((x) => x.item_id !== itemId);
      if (tk.activeItemId === itemId) tk.activeItemId = tk.items[0]?.item_id || '';
      saveTallyState(); openTicketAddItemModal();
    }

    function getActiveStrokeContext() {
      if (tallyTab === 'FREE') {
        return { strokes: freeTally.strokes, target: Number(freeTally.target || 0), hardStop: Boolean(freeTally.lockTarget), isAudit: false, dir: 'FREE', enabled: true };
      }
      if (tallyTab === 'AUDIT') {
        const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
        return { strokes: auditTally.strokes, target: it ? Number(it.stock) : 0, hardStop: false, isAudit: true, dir: 'AUDIT', enabled: Boolean(it) };
      }
      const tk = getActiveTicket(), item = getActiveTicketItem();
      if (!item) return { strokes: [], target: 0, hardStop: false, isAudit: false, dir: tk.dir, enabled: false };
      return { strokes: item.strokes, target: Number(item.target || 0), hardStop: tk.dir === 'OUT', isAudit: false, dir: tk.dir, enabled: true };
    }

    function sumStrokes(arr) { return (arr || []).reduce((s, x) => s + Number(x.qty || 0), 0); }

    async function ensureWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } catch {}
    }

    function releaseWakeLock() {
      if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
    }

    function triggerStageGlow(isBatch) {
      if (!tallyCfg.showTimer) return;
      const st = document.getElementById('tallyStage');
      if (!st) return;
      st.classList.remove('glow-ok', 'glow-batch');
      void st.offsetWidth;
      st.classList.add(isBatch ? 'glow-batch' : 'glow-ok');
      if (stageGlowTimer) clearTimeout(stageGlowTimer);
      stageGlowTimer = setTimeout(() => st.classList.remove('glow-ok', 'glow-batch'), 2600);
    }

    function setTallyPausedState(paused) {
      tallyPaused = Boolean(paused);
      const mask = document.getElementById('tallyPauseMask');
      const btn = document.getElementById('btnTPause');
      const trig = document.getElementById('tallyTriggerArea');
      if (!mask || !btn) return;
      if (trig) trig.classList.toggle('paused', tallyPaused);
      if (tallyPaused) {
        const ctx = getActiveStrokeContext();
        document.getElementById('lblPauseTitle').textContent = t('pauseTitle');
        document.getElementById('lblPauseSub').textContent = t('pauseSub')(ctx.strokes.length, sumStrokes(ctx.strokes).toLocaleString());
        document.getElementById('btnResumeTally').textContent = t('resumeBtn');
        mask.classList.add('open');
        btn.textContent = '🔒'; btn.classList.add('locked');
      } else {
        mask.classList.remove('open');
        btn.textContent = '⏸'; btn.classList.remove('locked');
      }
    }

    function toggleManualTallyPause() { vib(20); setTallyPausedState(!tallyPaused); }
    function resumeTallyFromPause() { vib(35); setTallyPausedState(false); }
    function onTallyAlertClick() { if (pendingOddFinishQty > 0) addTallyStroke(pendingOddFinishQty, null); }

    function addTallyStroke(customQty = null, workerIdx = null) {
      if (tallyPaused) { vib(20); showToast(t('pauseLockedHint')); return false; }
      const ctx = getActiveStrokeContext();
      if (!ctx.enabled) { openTicketAddItemModal(); return false; }

      const now = Date.now();
      if (customQty === null) {
        if (workerIdx !== null && workerIdx >= 0) {
          const perWorkerCd = Math.max(2000, Number(tallyCfg.cooldownMs || 0));
          if (now - (workerLastTap[workerIdx] || 0) < perWorkerCd) return false;
          workerLastTap[workerIdx] = now;
        } else {
          const cd = Math.max(150, Number(tallyCfg.cooldownMs || 0));
          if (now - lastTapMs < cd) return false;
        }
      }
      lastTapMs = now;
      ensureWakeLock();

      const counted = sumStrokes(ctx.strokes);
      if (ctx.hardStop && ctx.target > 0 && counted >= ctx.target) {
        vib([110, 50, 140]); playTone(920, 0.16, 'square', 0.16); return false;
      }

      let add;
      if (customQty !== null) add = Math.floor(Number(customQty));
      else if (!ctx.isAudit && ctx.target > 0 && (ctx.target - counted) > 0 && (ctx.target - counted) < carryMult) add = ctx.target - counted;
      else add = Number(carryMult);

      if (!add || add <= 0) return false;
      let isOdd = add !== carryMult;
      if (ctx.hardStop && ctx.target > 0 && counted + add > ctx.target) { add = ctx.target - counted; isOdd = add !== carryMult; }

      const entry = { qty: add, isOdd, ts: now };
      if (workerIdx !== null && workerIdx >= 0) entry.worker = workerIdx;
      ctx.strokes.push(entry);
      saveTallyState();

      const newTotal = counted + add;
      const loads = ctx.strokes.length;
      const rem = ctx.target > 0 ? Math.max(0, ctx.target - newTotal) : 999999;
      const remLoads = Math.ceil(rem / Math.max(1, carryMult));
      const strong = Boolean(tallyCfg.strongHaptics);
      const isBatch10 = loads % 10 === 0;
      const isFive = loads % 5 === 0;

      if (ctx.hardStop && ctx.target > 0 && newTotal >= ctx.target) {
        vib([110, 50, 110, 50, 180]); playTone(880, 0.15, 'square'); setTimeout(() => playTone(1175, 0.22, 'square'), 160);
      } else if (ctx.target > 0 && rem > 0 && remLoads <= 3) {
        vib(strong ? [70, 35, 70] : [45, 30, 45]); playTone(780, 0.09, 'sawtooth', 0.14);
      } else if (isBatch10) {
        vib(strong ? [80, 40, 120] : [50, 30, 75]); playTone(760, 0.1, 'triangle');
      } else if (isFive) {
        vib(strong ? [65, 30, 65] : [40, 25, 45]); playTone(680, 0.07, 'triangle');
      } else {
        vib(strong ? 55 : 24); playTone(520, 0.05);
      }

      triggerStageGlow(isBatch10);
      speakCount(loads, newTotal);

      renderTallyCapsule(); renderTallyVisual(); renderTallyStats(); renderTallyTrigger(false); updateCadenceStrip();
      if (tallyCfg.carriers >= 2) updateMultiCarrierCounts();
      if (tallyCfg.carriers === 0 && tallyCfg.triggerMode === 'TAP' && tallyCfg.cooldownMs >= 400) animateTapCooldown();
      return true;
    }

    function undoTally() {
      const ctx = getActiveStrokeContext();
      if (!ctx.strokes.length) return;
      ctx.strokes.pop(); vib(24); saveTallyState();
      renderTallyCapsule(); renderTallyVisual(); renderTallyStats(); renderTallyTrigger(false); updateCadenceStrip();
      if (tallyCfg.carriers >= 2) updateMultiCarrierCounts();
    }

    function clearTallyUndoable() {
      const ctx = getActiveStrokeContext();
      if (!ctx.strokes.length) return;
      undoTallyBuf = ctx.strokes.slice();
      ctx.strokes.length = 0; vib([40, 25, 40]); saveTallyState();
      renderTallyCapsule(); renderTallyVisual(); renderTallyStats(); renderTallyTrigger(false); updateCadenceStrip();
      if (tallyCfg.carriers >= 2) updateMultiCarrierCounts();
      showToast(t('clear'), () => {
        if (undoTallyBuf) {
          undoTallyBuf.forEach((x) => ctx.strokes.push(x));
          undoTallyBuf = null; saveTallyState();
          renderTallyCapsule(); renderTallyVisual(); renderTallyStats(); renderTallyTrigger(false); updateCadenceStrip();
          if (tallyCfg.carriers >= 2) updateMultiCarrierCounts();
        }
      });
    }

    let clearHoldBound = false;
    function bindClearHoldBtn() {
      const btn = document.getElementById('btnTClearHold');
      const fill = document.getElementById('tClearFill');
      if (!btn || !fill || clearHoldBound) return;
      clearHoldBound = true;

      let timer = null, fired = false;
      const cancelHold = (wasUp) => {
        if (timer) { clearTimeout(timer); timer = null; }
        fill.style.transition = 'width 0.15s ease';
        fill.style.width = '0%';
        if (wasUp && !fired) {
          const ctx = getActiveStrokeContext();
          if (ctx.strokes && ctx.strokes.length > 0) showToast(t('holdClearHint'));
        }
      };

      btn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const ctx = getActiveStrokeContext();
        if (!ctx.strokes || !ctx.strokes.length) return;
        fired = false; vib(15);
        fill.style.transition = 'none'; fill.style.width = '0%'; void fill.offsetWidth;
        fill.style.transition = 'width 0.85s linear'; fill.style.width = '100%';
        timer = setTimeout(() => {
          fired = true; timer = null;
          fill.style.transition = 'none'; fill.style.width = '0%';
          clearTallyUndoable();
        }, 850);
      });
      btn.addEventListener('pointerup', () => cancelHold(true));
      btn.addEventListener('pointerleave', () => cancelHold(false));
      btn.addEventListener('pointercancel', () => cancelHold(false));
    }

    async function commitTally(btnEl) {
      if (tallyTab === 'FREE') {
        vib(20);
        const tot = sumStrokes(freeTally.strokes);
        if (tot <= 0) return;
        document.getElementById('inpQuickQty').value = String(tot);
        switchView('entry'); showToast(`${t('counted')}: ${tot}`); return;
      }

      if (tallyTab === 'AUDIT') {
        const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
        if (!it) return;
        const total = sumStrokes(auditTally.strokes);
        const diff = total - Number(it.stock || 0);
        const isZeroEmpty = auditTally.strokes.length === 0;
        const msg = isZeroEmpty
          ? t('auditZeroWarn')(it.name, Number(it.stock).toLocaleString())
          : t('auditConfirmMsg')(it.name, Number(it.stock).toLocaleString(), total.toLocaleString(), diff);

        openMainModal(t('tAudit'), `<div class="sub-card" style="font-size:12.5px;font-weight:900;color:${isZeroEmpty ? '#fde68a' : 'var(--text)'};">${esc(msg)}</div>`,
          `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('cancel'))}</button>
           <button type="button" class="btn ${isZeroEmpty ? 'danger' : 'teal'}" id="btnAudGo">${esc(t('ok'))}</button>`);
        document.getElementById('btnAudGo').onclick = () => {
          closeMainModal();
          submitAuditAdjustmentNow(it, total, btnEl);
        };
        return;
      }

      const tk = getActiveTicket();
      const payloadItems = tk.items
        .map((x) => ({ item_id: x.item_id, qty: sumStrokes(x.strokes), tally_proof: { mode: tk.dir, strokes: x.strokes } }))
        .filter((x) => x.qty > 0);
      if (!payloadItems.length) { showToast(t('errNeedCount')); return; }

      const hdr = buildHeaderPayload(tk.dir, tk);
      submitGenericDocument(tk.dir, hdr.docNo, hdr.party, hdr.ref, payloadItems, () => {
        tickets = tickets.filter((x) => x.id !== tk.id);
        ensureDefaultTicket(); saveTallyState(); renderTally(true);
      }, btnEl);
    }

    async function submitAuditAdjustmentNow(it, total, btnEl) {
      await withBusy(btnEl, async () => {
        try {
          const res = await callRpc('rpc_submit_adjustment', {
            p_token: session.token, p_warehouse_id: currentWhId, p_item_id: it.id, p_counted_qty: total,
            p_reason: total > it.stock ? t('adjPlusReason') : t('adjMinusReason'),
            p_tally_proof: { mode: 'AUDIT', strokes: auditTally.strokes },
          });
          if (!res.success) { showToast(t('errGeneric')); return; }
          callBot({ action: 'notify_adjustment', warehouse_id: currentWhId, adjustment_id: res.adjustment_id }).catch(() => {});
          auditTally.strokes = []; saveTallyState();
          showToast(res.status === 'APPROVED' ? t('adjApproved') : t('adjPending'));
          loadWarehouseData(currentWhId);
        } catch { showToast(t('errGeneric')); }
      });
    }

    function renderTally(forceTrigger = false) {
      document.getElementById('btnTTicket').className = 'seg-btn' + (tallyTab === 'TICKET' ? ' teal' : '');
      document.getElementById('btnTFree').className = 'seg-btn' + (tallyTab === 'FREE' ? ' in' : '');
      document.getElementById('btnTAudit').className = 'seg-btn' + (tallyTab === 'AUDIT' ? ' adj' : '');
      updateQuickVoiceBtn();

      document.getElementById('btnTCommit').textContent =
        tallyTab === 'TICKET' ? `✓ ${t('postDirect')}` : tallyTab === 'FREE' ? `➔ ${t('sendEntry')}` : `⚡ ${t('applyAdj')}`;

      renderTallyCapsule(); renderTallyVisual(); renderTallyStats(); renderTallyTrigger(forceTrigger);
      updateCadenceStrip(); setTallyPausedState(tallyPaused);
    }

    function renderTallyVisual() {
      const box = document.getElementById('tallyVisual');
      const ctx = getActiveStrokeContext();
      if (!ctx.enabled) {
        box.className = 't-visual';
        box.innerHTML = `<div style="margin:auto;text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:12px;cursor:pointer;" onclick="openTicketAddItemModal()">${esc(t('tkNoItems'))}</div>`;
        return;
      }

      const s = ctx.strokes, n = s.length;
      if (tallyCfg.visualMode !== 'TALLY5') {
        box.className = 't-visual';
        const compBatches = n === 0 ? 0 : Math.floor((n - 1) / 10);
        const compSum = sumStrokes(s.slice(0, compBatches * 10));
        const curSlice = s.slice(compBatches * 10);
        const curSum = sumStrokes(curSlice);

        const dots = [];
        for (let i = 0; i < 10; i++) {
          const st = curSlice[i];
          if (st) {
            const wCls = (st.worker !== undefined && st.worker >= 0) ? `w${st.worker % 4}` : (st.isOdd ? 'odd' : 'filled');
            const latestCls = i === curSlice.length - 1 ? 'latest' : '';
            dots.push(`<div class="b-dot ${wCls} ${latestCls}">+${st.qty}</div>`);
          } else dots.push(`<div class="b-dot">${i + 1}</div>`);
        }
        box.innerHTML = `
          <div class="batch-summary">
            <span class="batch-chip">${esc(t('batchDone')(compBatches, compSum.toLocaleString()))}</span>
            <span class="batch-sub">${esc(t('batchCur')(curSlice.length, curSum.toLocaleString()))}</span>
          </div>
          <div class="dot-ring">${dots.join('')}</div>`;
        return;
      }

      box.className = 't-visual tally-mode';
      if (!n) {
        box.innerHTML = `<div style="margin:auto;opacity:0.15;"><div class="t-grp" style="transform:scale(1.4);"><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-slash"></div></div></div>`;
        return;
      }

      const skipHundreds = n > 100 ? Math.floor((n - 1) / 100) * 100 : 0;
      let runningQty = sumStrokes(s.slice(0, skipHundreds));
      let html = skipHundreds > 0 ? `<div class="tally-compact-bar">${esc(t('tallyCompBar')(skipHundreds, runningQty.toLocaleString()))}</div>` : '';

      const vis = s.slice(skipHundreds);
      for (let r = 0; r < vis.length; r += 25) {
        const rowChunk = vis.slice(r, r + 25);
        runningQty += sumStrokes(rowChunk);
        let grps = '';
        for (let g = 0; g < 5; g++) {
          const ch = rowChunk.slice(g * 5, g * 5 + 5);
          if (!ch.length) { grps += '<div></div>'; continue; }
          grps += '<div class="t-grp">';
          for (let b = 0; b < Math.min(4, ch.length); b++) grps += `<div class="t-bar ${ch[b].isOdd ? 'odd' : ''}"></div>`;
          if (ch.length === 5) grps += '<div class="t-slash"></div>';
          grps += '</div>';
        }
        html += `<div class="tally-row-5">${grps}<span class="tally-row-tot">${runningQty.toLocaleString()}</span></div>`;
      }
      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;
    }

    function renderTallyStats() {
      const ctx = getActiveStrokeContext();
      const cnt = sumStrokes(ctx.strokes), loads = ctx.strokes.length, trg = ctx.target;
      const mult = Math.max(1, Number(carryMult || 1));

      document.getElementById('lblTCounted').textContent = ctx.dir === 'OUT' ? t('tLoaded') : (ctx.dir === 'IN' ? t('tUnloaded') : t('counted'));
      document.getElementById('lblTStrokes').textContent = t('tLoads');
      document.getElementById('valTCounted').textContent = cnt.toLocaleString();
      document.getElementById('valTStrokes').textContent = loads.toLocaleString();

      const rQtyLbl = document.getElementById('lblTRemQty'), rQtyVal = document.getElementById('valTRemQty');
      const rLdLbl = document.getElementById('lblTRemLoads'), rLdVal = document.getElementById('valTRemLoads');
      const box = document.getElementById('tallyAlert'), stage = document.getElementById('tallyStage');
      const prog = document.getElementById('tProgFill'), commitBtn = document.getElementById('btnTCommit');

      box.className = 'alert-box'; stage.classList.remove('done', 'near');
      commitBtn.classList.remove('ready-done'); rLdVal.className = 't-kpi-val c-pr';
      pendingOddFinishQty = 0;
      prog.style.width = trg > 0 ? `${Math.min(100, Math.round((cnt / trg) * 100))}%` : '0%';

      if (ctx.isAudit) {
        const d = cnt - trg;
        rQtyLbl.textContent = t('diff'); rQtyVal.textContent = (d > 0 ? '+' : '') + d.toLocaleString();
        rLdLbl.textContent = t('tSysBal'); rLdVal.textContent = trg.toLocaleString();
        if (cnt > 0) commitBtn.classList.add('ready-done');
        if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); }
        else if (d < 0 && cnt > 0) { box.className = 'alert-box warn'; box.textContent = t('shortWarn')(Math.abs(d)); }
        else if (d === 0 && cnt > 0) { box.className = 'alert-box stop'; box.textContent = t('exactMatch'); stage.classList.add('done'); }
      } else {
        rQtyLbl.textContent = t('tRemQty'); rLdLbl.textContent = t('tRemLoads');
        if (trg <= 0) {
          rQtyVal.textContent = '∞'; rLdVal.textContent = '∞';
          if (cnt > 0) commitBtn.classList.add('ready-done');
        } else {
          const rem = Math.max(0, trg - cnt);
          const fullL = Math.floor(rem / mult), oddR = rem % mult, remLoadsCeil = Math.ceil(rem / mult);
          if (rem === 0) rLdVal.textContent = '0';
          else if (oddR === 0) rLdVal.textContent = fullL.toLocaleString();
          else if (fullL === 0) rLdVal.textContent = `+${oddR}`;
          else { rLdVal.classList.add('sm'); rLdVal.textContent = t('remLoadMix')(fullL, oddR); }

          if (rem > 0 && rem < mult) pendingOddFinishQty = rem;

          if (ctx.hardStop) {
            rQtyVal.textContent = rem.toLocaleString();
            if (cnt >= trg) { box.className = 'alert-box stop'; box.textContent = t('stopAlert'); stage.classList.add('done'); commitBtn.classList.add('ready-done'); }
            else if (rem < mult) { box.className = 'alert-box warn clickable'; box.textContent = t('oddWarnTap')(rem); stage.classList.add('near'); }
            else if (remLoadsCeil <= 3) { box.className = 'alert-box warn'; box.textContent = t('nearAlert')(remLoadsCeil, rem); stage.classList.add('near'); }
          } else {
            const d = cnt - trg;
            rQtyVal.textContent = d > 0 ? `+${d.toLocaleString()}` : rem.toLocaleString();
            if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); commitBtn.classList.add('ready-done'); }
            else if (d === 0) { box.className = 'alert-box stop'; box.textContent = t('tTargetDone'); stage.classList.add('done'); commitBtn.classList.add('ready-done'); }
            else if (rem < mult) { box.className = 'alert-box warn clickable'; box.textContent = t('oddWarnTap')(rem); stage.classList.add('near'); }
            else if (remLoadsCeil <= 3) { box.className = 'alert-box warn'; box.textContent = t('nearAlert')(remLoadsCeil, rem); stage.classList.add('near'); }
          }
        }
      }
    }

    function updateCadenceStrip() {
      const bar = document.getElementById('cadenceBar');
      if (!bar) return;
      bar.style.display = tallyCfg.showTimer ? 'flex' : 'none';
      if (!tallyCfg.showTimer) return;

      const ctx = getActiveStrokeContext(), s = ctx.strokes;
      const timerEl = document.getElementById('cadenceTimer'), pillsEl = document.getElementById('cadencePills');
      if (!s.length) {
        timerEl.className = 'cadence-timer stale'; timerEl.textContent = t('noTapYet'); pillsEl.innerHTML = ''; return;
      }
      const diffSec = Math.max(0, Math.floor((Date.now() - (s[s.length - 1].ts || 0)) / 1000));
      timerEl.className = 'cadence-timer ' + (diffSec <= 4 ? 'fresh' : 'stale');
      if (diffSec < 60) timerEl.textContent = t('secAgo')(diffSec);
      else if (diffSec < 3600) timerEl.textContent = t('minAgo')(Math.floor(diffSec / 60), diffSec % 60);
      else if (diffSec < 86400) timerEl.textContent = t('hrAgo')(Math.floor(diffSec / 3600));
      else timerEl.textContent = t('dayAgo')(Math.floor(diffSec / 86400));

      const recent = s.slice(-3).reverse();
      pillsEl.innerHTML = recent.map((st, idx) => {
        const realIdx = s.length - 1 - idx;
        const prev = realIdx > 0 ? s[realIdx - 1] : null;
        const gap = prev && prev.ts ? ((st.ts - prev.ts) / 1000) : null;
        const isFast = gap !== null && gap < 1.3;
        let gapTxt = '•';
        if (gap !== null) {
          if (gap < 10) gapTxt = `${gap.toFixed(1)}s`;

    function bindSwipeGate() {
      const track = document.getElementById('sgTrack');
      const thumb = document.getElementById('sgThumb');
      const fill = document.getElementById('sgFill');
      if (!track || !thumb || !fill) return;

      let active = false, startX = 0, maxTravel = 1, triggered = false;
      const resetThumb = () => {
        thumb.classList.add('snap'); thumb.style.transform = 'translate3d(0,0,0)'; fill.style.width = '0%';
      };

      track.addEventListener('pointerdown', (e) => {
        if (!e.isPrimary) return;
        if (tallyPaused) { vib(20); showToast(t('pauseLockedHint')); return; }
        const rect = track.getBoundingClientRect();
        maxTravel = Math.max(40, rect.width - thumb.offsetWidth - 10);
        startX = Math.min(e.clientX, rect.left + rect.width * 0.45);
        active = true; triggered = false;
        thumb.classList.remove('snap');
        try { track.setPointerCapture(e.pointerId); } catch {}
      });

      track.addEventListener('pointermove', (e) => {
        if (!active || triggered) return;
        const dx = Math.max(0, Math.min(maxTravel, e.clientX - startX));
        thumb.style.transform = `translate3d(${dx}px,0,0)`;
        fill.style.width = `${Math.round((dx / maxTravel) * 100)}%`;
        const threshold = Math.min(maxTravel * 0.62, 165);
        if (dx >= threshold) {
          triggered = true; active = false;
          addTallyStroke(null, null);
          resetThumb();
        }
      });

      const endDrag = () => { if (!active) return; active = false; resetThumb(); };
      track.addEventListener('pointerup', endDrag);
      track.addEventListener('pointercancel', endDrag);
    }

    function normalizeDailyList(rows, includeOpening = false) {
      const seenVoidDoc = new Set();
      const cleaned = [];
      (rows || []).forEach((r) => {
        if (!includeOpening && String(r.doc_no || '').trim().toUpperCase() === 'OPENING') return;
        const isWholeVoid = r.status === 'VOIDED' || r.doc_type === 'VOID';
        if (!isWholeVoid && r.is_voided) return;
        if (isWholeVoid) {
          const dKey = String(r.document_id || r.doc_no);
          if (seenVoidDoc.has(dKey)) return;
          seenVoidDoc.add(dKey);
        }
        cleaned.push(r);
      });
      return cleaned;
    }

    function getSortedDailyRows(rows, forceDocAsc = false, includeOpening = false) {
      const cleanRows = normalizeDailyList(rows, includeOpening);
      const groups = [], map = new Map();
      cleanRows.forEach((r) => {
        const key = String(r.document_id || r.ledger_id);
        if (!map.has(key)) {
          const dNum = docNumInt(r.doc_no);
          const g = {
            docNum: dNum,
            docStr: String(r.doc_no || ''),
            isOpen: String(r.doc_no || '').trim().toUpperCase() === 'OPENING',
            origIdx: groups.length,
            lines: [],
          };
          map.set(key, g); groups.push(g);
        }
        map.get(key).lines.push(r);
      });

      if (dailySort === 'TIME' && !forceDocAsc) {
        groups.reverse();
      } else {
        const chrono = groups.slice().reverse();
        let lastAnchor = 0;
        chrono.forEach((g, idx) => {
          if (g.isOpen) g.sortKey = -1;
          else if (g.docNum > 0) { g.sortKey = g.docNum; lastAnchor = g.docNum; }
          else g.sortKey = lastAnchor + 0.5 + (idx * 0.0001);
        });
        groups.sort((a, b) => {
          if (a.sortKey !== b.sortKey) return a.sortKey - b.sortKey;
          return a.docStr.localeCompare(b.docStr);
        });
      }

      const out = [];
      groups.forEach((g) => g.lines.forEach((l) => out.push(l)));
      return out;
    }

    function markLineVoid(btnEl, lid) {
      const row = btnEl.closest('.ed-line-row');
      if (editVoidIds.includes(lid)) { editVoidIds = editVoidIds.filter((x) => x !== lid); row.style.opacity = '1'; }
      else { editVoidIds.push(lid); row.style.opacity = '0.35'; }
      vib(16);
    }

    function appendEditLine() {
      vib(16);
      const sel = document.getElementById('edNewItemSel');
      const qty = Math.floor(Number(document.getElementById('edNewItemQty').value || 0));
      if (!sel.value || qty <= 0) return;
      const name = sel.options[sel.selectedIndex]?.text || '';
      editAppendList.push({ item_id: sel.value, qty, name });
      document.getElementById('edNewItemQty').value = '';
      document.getElementById('edAppendedWrap').innerHTML = editAppendList.map((x, idx) => `

        </div>`).join('');
    }

    function prepareSaveEditDoc(docId, docType, origDocNo) {
      const rows = Array.from(document.querySelectorAll('#edLinesWrap .ed-line-row'));
      const changes = [], updates = [];
      rows.forEach((row) => {
        const lid = Number(row.dataset.lid);
        const origName = row.dataset.origName || '';
        const origQty = Number(row.dataset.origQty || 0);
        if (editVoidIds.includes(lid)) { changes.push(`• የተሰረዘ ረድፍ: ${origName} (${origQty})`); return; }
        const sel = row.querySelector('.ed-item-sel');
        const newName = sel.options[sel.selectedIndex]?.text || '';
        const newQty = Math.max(1, Number(row.querySelector('.ed-qty-inp').value || 1));
        updates.push({ ledger_id: lid, item_id: sel.value, qty: newQty });
        if (newName !== origName || newQty !== origQty) changes.push(`• ${origName} (${origQty}) ➔ ${newName} (${newQty})`);
      });
      editAppendList.forEach((x) => changes.push(`• የተጨመረ: ${x.name} (${x.qty})`));

      const newDocNo = document.getElementById('edDocNo').value.trim();
      const newParty = document.getElementById('edParty').value.trim();
      const rawRef = document.getElementById('edRef').value.trim();
      const newRef = docType === 'OUT' ? formatPadRef(rawRef) : rawRef;
      if (newDocNo !== origDocNo) changes.unshift(`• ሰነድ ቁጥር: ${origDocNo} ➔ ${newDocNo}`);

      const appendCopy = editAppendList.map((x) => ({ item_id: x.item_id, qty: x.qty }));
      const voidCopy = editVoidIds.slice();

      promptSecurityVerify(voidCopy.length > 0, async (actor) => {
        try {
          const res = await callRpc('rpc_edit_document', {
            p_token: session.token, p_document_id: docId,
            p_new_doc_no: newDocNo, p_new_party: newParty, p_new_ref: newRef,
            p_line_updates: updates, p_append_items: appendCopy, p_void_ledger_ids: voidCopy,
          });
          if (!res.success) { showToast(res.error === 'INSUFFICIENT_STOCK' ? t('errStock') : (res.error || t('errGeneric'))); return; }
          sendAuditLog(t('auditEditTitle'), `${newDocNo}`, changes.join('\n') || `ደንበኛ/ማጣቀሻ: ${newParty} (${newRef})`, actor.full_name);
          showToast(t('savedOk')); loadWarehouseData(currentWhId); loadDaily(false);
        } catch (e) { showToast(e?.message || t('errGeneric')); }
      });
    }

    function verifyAndVoidDoc(docId, docNo, partyName) {
      promptSecurityVerify(false, async (actor) => {
        try {
          const res = await callRpc('rpc_void_document', { p_token: session.token, p_document_id: docId });
          if (!res.success) { showToast(res.error || t('errGeneric')); return; }
          sendAuditLog(t('auditVoidTitle'), `${docNo}`, `ደንበኛ/አቅራቢ: ${partyName || '-'}`, actor.full_name);
          showToast(t('savedOk')); loadWarehouseData(currentWhId); loadDaily(false);
        } catch (e) { showToast(e?.message || t('errGeneric')); }
      });
    }

    // ==================== ገጽ 4: ስቶክ ====================
    let renderedStockGroups = [];

    function getPeriodBounds(p) {
      const now = new Date(), end = new Date(); let start = new Date(0);
      if (p === 'WEEK') { const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1)); start = d; }
      else if (p === 'LAST_WEEK') { const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1)); end.setTime(d.getTime() - 1); start = new Date(d.getTime() - 7 * 86400000); }
      else if (p === 'MONTH') start = new Date(now.getFullYear(), now.getMonth(), 1);
      return { start: start.toISOString(), end: end.toISOString() };
    }

    function setStockPeriod(p) { stockPeriod = p; vib(18); loadStock(); }

    async function loadStock() {
      ['WEEK','LAST_WEEK','MONTH','ALL'].forEach((k) => {
        const id = { WEEK:'btnPWeek', LAST_WEEK:'btnPLastWeek', MONTH:'btnPMonth', ALL:'btnPAll' }[k];
        document.getElementById(id).className = 'seg-btn' + (stockPeriod === k ? ' teal' : '');
      });
      try {
        const b = getPeriodBounds(stockPeriod);
        const res = await callRpc('rpc_get_period_stock_report', { p_token: session.token, p_warehouse_id: currentWhId, p_start: b.start, p_end: b.end, p_active_only: false });
        if (res.success) { stockRows = res.rows || []; renderStock(); }
      } catch { showToast(t('errGeneric')); }
    }

    function buildOrderedStockGroups(sourceRows, queryText = '') {
      const q = queryText.trim().toLowerCase();
      const byCat = {};
      sourceRows.forEach((r) => {
        const cat = (r.category_name || 'ጠቅላላ').trim();
        if (q && !r.item_name.toLowerCase().includes(q) && !cat.toLowerCase().includes(q)) return;
        if (!byCat[cat]) byCat[cat] = [];
        byCat[cat].push(r);
      });
      return Object.keys(byCat)
        .sort((a, b) => a.localeCompare(b))
        .map((cat) => ({ cat, items: byCat[cat].slice().sort((a, b) => compareItemsSmart(a.item_name, b.item_name, cat)) }));
    }

    function getActiveStockPdfCols(cfg, list) {
      const hasAdjData = (list || []).some((r) => Number(r.adj_net_qty || 0) !== 0);
      const showAdjCol = cfg.adjColMode === 'SHOW' || (cfg.adjColMode !== 'HIDE' && hasAdjData);
      const sm = t('sPdfMap');
      const cols = [{ k: 'item', lbl: sm.item }];
      if (cfg.showOpening) cols.push({ k: 'open', lbl: sm.open });
      cols.push({ k: 'inq', lbl: sm.inq }, { k: 'outq', lbl: sm.outq });
      if (showAdjCol) cols.push({ k: 'adj', lbl: sm.adj });
      cols.push({ k: 'bal', lbl: sm.bal });
      return cols;
    }

    function renderStock() {
      const q = document.getElementById('inpStockSearch').value;
      const isWys = activeFmtSheet === 'stock';
      const cfg = sheetCfgs.stock;
      const showAct = !isWys && Boolean(uiCfg.showStockActions);
      const colgroupEl = document.getElementById('stockColgroup');

      const filteredBase = isWys && !cfg.stockShowZero
        ? stockRows.filter((r) => Number(r.closing_qty || 0) > 0 || Number(r.in_qty || 0) > 0 || Number(r.out_qty || 0) > 0 || Number(r.adj_net_qty || 0) !== 0)
        : stockRows;
      renderedStockGroups = buildOrderedStockGroups(filteredBase, q);

      let cols;
      if (isWys) {
        cols = getActiveStockPdfCols(cfg, filteredBase);
        colgroupEl.innerHTML = buildColgroupInnerHtml(cols, cfg, DEFAULT_SHEET_STOCK.colW);
        document.getElementById('stockHead').innerHTML = `<tr>${cols.map((c) => `<th>${esc(c.lbl)}</th>`).join('')}</tr>`;
      } else {
        colgroupEl.innerHTML = '';
        const hCols = showAct ? t('sCols') : t('sCols').slice(0, -1);
        cols = hCols.map((lbl, idx) => ({ k: ['row','item','open','inq','outq','bal','act'][idx], lbl }));
        document.getElementById('stockHead').innerHTML = `<tr>${hCols.map((c) => `<th>${esc(c)}</th>`).join('')}</tr>`;
      }

      const colSpan = cols.length;
      const isBrAdm = whData.is_branch_admin || whData.is_org_admin || session?.user?.role === 'SUPER_ADMIN';
      const lowLim = whData.warehouse?.low_limit || 20;
      const html = [];
      let rowNum = 2;

      renderedStockGroups.forEach((grp, gIdx) => {
        if (gIdx > 0) { html.push(`<tr class="r-sp"><td colspan="${colSpan}"></td></tr>`); rowNum++; }
        const allSelected = grp.items.length > 0 && pdfSelectType === 'stock' && grp.items.every((it) => Boolean(selectedPdfIds[it.item_id]));
        const catRowNum = rowNum++;

        if (isWys) {
          html.push(`<tr class="r-cat ${allSelected ? 'cat-sel' : ''}" onclick="togglePdfCategory(${gIdx})"><td colspan="${colSpan}" class="c-txt">${esc(grp.cat)}</td></tr>`);
        } else {
          html.push(`
            <tr class="r-cat ${allSelected ? 'cat-sel' : ''}" onclick="togglePdfCategory(${gIdx})">
              <td style="text-align:center;color:var(--muted);">${catRowNum}</td>
              <td colspan="${colSpan - (showAct ? 2 : 1)}">📁 ${esc(grp.cat)} <small style="opacity:0.75;">(${grp.items.length})</small></td>
              ${showAct ? `<td style="text-align:center;"><span style="opacity:0.65;">${allSelected ? '☑️' : '📄'}</span></td>` : ''}
            </tr>`);
        }

        let prevLtzKey = null;
        grp.items.forEach((r) => {
          const ltz = parseLtzInfo(r.item_name);
          if (ltz && prevLtzKey && ltz.groupKey !== prevLtzKey) {
            html.push(`<tr class="r-ltz-sp"><td colspan="${colSpan}"></td></tr>`); rowNum++;
          }
          prevLtzKey = ltz ? ltz.groupKey : null;

          const curRow = rowNum++;
          const isSel = pdfSelectType === 'stock' && Boolean(selectedPdfIds[r.item_id]);
          const rowCls = isSel ? 'r-sel' : (r.closing_qty === 0 ? 'r-zero' : (isWys && r.closing_qty <= lowLim ? 'r-low' : ''));

          const tds = cols.map((c) => {
            if (c.k === 'row') return `<td style="text-align:center;color:var(--muted);">${curRow}</td>`;
            if (c.k === 'item') return `<td class="c-txt">${esc(r.item_name)}</td>`;
            if (c.k === 'open') return `<td class="c-num">${Number(r.opening_qty).toLocaleString()}</td>`;
            if (c.k === 'inq') return `<td class="c-num num-in" style="color:var(--emerald);">${isWys ? Number(r.in_qty).toLocaleString() : '+' + Number(r.in_qty).toLocaleString()}</td>`;
            if (c.k === 'outq') return `<td class="c-num num-out" style="color:var(--rose);">${isWys ? Number(r.out_qty).toLocaleString() : '-' + Number(r.out_qty).toLocaleString()}</td>`;
            if (c.k === 'adj') return `<td class="c-num">${Number(r.adj_net_qty || 0).toLocaleString()}</td>`;
            if (c.k === 'bal') return `<td class="c-num"><b>${Number(r.closing_qty).toLocaleString()}</b></td>`;
            return `<td style="text-align:center;">${isBrAdm ? `<button type="button" class="icon-btn" style="width:26px;height:24px;font-size:11px;" onclick="event.stopPropagation();openEditStockItemModal('${escJs(r.item_id)}')">⚙️</button>` : ''}</td>`;
          }).join('');

          html.push(`<tr class="${rowCls}" onclick="togglePdfRow('stock','${escJs(r.item_id)}',this)">${tds}</tr>`);
        });
      });

      document.getElementById('stockBody').innerHTML = html.length ? html.join('') : `<tr><td colspan="${colSpan}" style="text-align:center;padding:16px;color:var(--muted);">${esc(t('noItems'))}</td></tr>`;
      applyLiveSheetStyle('stock');
    }

    function togglePdfCategory(gIdx) {
      const grp = renderedStockGroups[gIdx];
      if (!grp || !grp.items.length) return;
      vib(24);
      if (activeFmtSheet) closeSheetFormatBar();
      if (pdfSelectType !== 'stock') { selectedPdfIds = {}; pdfSelectType = 'stock'; }
      const allSel = grp.items.every((it) => Boolean(selectedPdfIds[it.item_id]));
      grp.items.forEach((it) => { if (allSel) delete selectedPdfIds[it.item_id]; else selectedPdfIds[it.item_id] = true; });
      updatePdfBar(); renderStock();
    }

        showToast(t('savedOk')); await loadWarehouseData(currentWhId); loadStock();

    function togglePdfRow(type, key, trEl) {
      vib(20);
      if (activeFmtSheet) closeSheetFormatBar();
      if (pdfSelectType !== type) { selectedPdfIds = {}; pdfSelectType = type; }
      if (selectedPdfIds[key]) { delete selectedPdfIds[key]; trEl.classList.remove('r-sel'); }
      else { selectedPdfIds[key] = true; trEl.classList.add('r-sel'); }
      updatePdfBar();
    }

    function clearPdfSelection() {
      vib(16); selectedPdfIds = {}; updatePdfBar();
      if (pdfSelectType === 'daily') renderDaily(); else renderStock();
    }

    function updatePdfBar() {
      const cnt = Object.keys(selectedPdfIds).length;
      const show = cnt > 0 && !activeFmtSheet;
      document.getElementById('pdfBar').style.display = show ? 'flex' : 'none';
      document.getElementById('appShell')?.classList.toggle('pdf-sel-open', show);
      document.getElementById('btnPdfSend').textContent = `${t('pdfSend')} (${cnt})`;
    }

    // ==================== ቀጥታ የGoogle Sheets ቅርጸት አሞሌ (Inline WYSIWYG) ====================
    function saveSheetCfgs() { saveJson(SHEET_CFG_KEY, sheetCfgs); }

    function toggleSheetFormatBar(which) {
      vib(18);
      if (activeFmtSheet === which) { closeSheetFormatBar(); return; }
      activeFmtSheet = which;
      activeFmtSub = null;
      selectedPdfIds = {};
      updatePdfBar();
      document.getElementById('appShell')?.classList.add('fmt-open');
      document.getElementById('btnDailyFmt')?.classList.toggle('fmt-on', which === 'daily');
      document.getElementById('btnStockFmt')?.classList.toggle('fmt-on', which === 'stock');
      if (which === 'daily') renderDaily(); else renderStock();
      renderSheetFormatBar();
    }

    function closeSheetFormatBar() {
      const prev = activeFmtSheet;
      activeFmtSheet = null;
      activeFmtSub = null;
      document.getElementById('appShell')?.classList.remove('fmt-open');
      document.getElementById('sheetFmtBar')?.classList.remove('open');
      document.getElementById('sheetFmtPanel')?.classList.remove('open');
      document.getElementById('btnDailyFmt')?.classList.remove('fmt-on');
      document.getElementById('btnStockFmt')?.classList.remove('fmt-on');
      if (prev === 'daily') renderDaily();
      else if (prev === 'stock') renderStock();
    }

    function applyLiveSheetStyle(which) {
      const wrap = document.getElementById(which === 'daily' ? 'dailyTblWrap' : 'stockTblWrap');
      if (!wrap) return;
      if (activeFmtSheet !== which) {
        wrap.classList.remove('wysiwyg');
        return;
      }
      const cfg = sheetCfgs[which];
      const st = getPdfStyleTokens(cfg);
      wrap.classList.add('wysiwyg');
      wrap.style.setProperty('--sh-page-bg', st.theme.pageBg);
      wrap.style.setProperty('--sh-font', st.fSize);
      wrap.style.setProperty('--sh-layout', 'fixed');
      wrap.style.setProperty('--sh-th-bg', st.theme.thBg);
      wrap.style.setProperty('--sh-th-clr', st.theme.thClr);
      wrap.style.setProperty('--sh-brd-clr', st.brdColor);
      wrap.style.setProperty('--sh-brd-w', st.brdW);
      wrap.style.setProperty('--sh-row-h', `${st.rowH}px`);
      wrap.style.setProperty('--sh-pad-y', `${st.padY}px`);
      wrap.style.setProperty('--sh-pad-x', st.txtPadX);
      wrap.style.setProperty('--sh-fw', cfg.bold ? '800' : '500');
      wrap.style.setProperty('--sh-fs', cfg.italic ? 'italic' : 'normal');
      wrap.style.setProperty('--sh-valign', st.vAlign);
      wrap.style.setProperty('--sh-wrap', cfg.wrap ? 'normal' : 'nowrap');
      wrap.style.setProperty('--sh-break', cfg.wrap ? 'break-word' : 'normal');
      wrap.style.setProperty('--sh-row-bg', st.theme.rowNormalBg);
      wrap.style.setProperty('--sh-row-clr', st.theme.rowNormalClr);
      wrap.style.setProperty('--sh-cat-bg', st.theme.catBg);
      wrap.style.setProperty('--sh-cat-clr', st.theme.catClr);
      wrap.style.setProperty('--sh-zero-bg', st.theme.rowZeroBg);
      wrap.style.setProperty('--sh-zero-clr', st.theme.rowZeroClr);
      wrap.style.setProperty('--sh-low-bg', st.theme.rowLowBg);
      wrap.style.setProperty('--sh-low-clr', st.theme.rowLowClr);
      wrap.style.setProperty('--sh-in-bg', st.theme.rowInBg);
      wrap.style.setProperty('--sh-adj-bg', st.theme.rowAdjBg);
      wrap.style.setProperty('--sh-txt-al', st.txtAlign);
      wrap.style.setProperty('--sh-num-al', st.numAlign);
    }

    function updateSheetProp(key, val, rerenderSub = true) {
      if (!activeFmtSheet) return;
      vib(12);
      const cfg = sheetCfgs[activeFmtSheet];
      cfg[key] = val;
      if (key === 'stylePreset') cfg.headerBg = '';
      saveSheetCfgs();
      if (activeFmtSheet === 'daily') renderDaily(); else renderStock();
      renderSheetFormatBar();
      if (rerenderSub && activeFmtSub) renderSheetFormatPanel();
    }

    function stepSheetProp(key, delta, minV, maxV) {
      if (!activeFmtSheet) return;
      const cfg = sheetCfgs[activeFmtSheet];
      updateSheetProp(key, Math.max(minV, Math.min(maxV, Number(cfg[key] || minV) + delta)), true);
    }

    function setSheetColWidth(colKey, val) {
      if (!activeFmtSheet) return;
      const cfg = sheetCfgs[activeFmtSheet];
      cfg.colW[colKey] = Math.max(5, Math.min(65, Number(val || 12)));
      saveSheetCfgs();
      const sp = document.getElementById(`scw_${colKey}`);
      if (sp) sp.textContent = `${cfg.colW[colKey]}%`;
      if (activeFmtSheet === 'daily') renderDaily(); else renderStock();
    }

    function resetSheetColWidths() {
      if (!activeFmtSheet) return;
      vib(18);
      sheetCfgs[activeFmtSheet].colW = { ...(activeFmtSheet === 'daily' ? DEFAULT_SHEET_DAILY.colW : DEFAULT_SHEET_STOCK.colW) };
      saveSheetCfgs();
      if (activeFmtSheet === 'daily') renderDaily(); else renderStock();
      renderSheetFormatPanel();
    }

    function toggleSheetFmtSub(sub) {
      vib(14);
      activeFmtSub = activeFmtSub === sub ? null : sub;
      renderSheetFormatBar();
      renderSheetFormatPanel();
    }

    function cycleSheetAlign() {
      if (!activeFmtSheet) return;
      const cur = sheetCfgs[activeFmtSheet].textAlign || 'left';
      const next = cur === 'left' ? 'center' : (cur === 'center' ? 'right' : 'left');
      updateSheetProp('textAlign', next, false);
    }

    // ==================== PDF + Excel (CSV) Export Engine (WYSIWYG) ====================
    function getLockedPageSizeMm(cfg) {
      if (cfg.mode === 'MOBILE') return { w: 110, h: 215 };
      if (cfg.mode === 'A4_L') return { w: 297, h: 210 };
      if (cfg.mode === 'A5_P') return { w: 148, h: 210 };
      if (cfg.mode === 'LETTER_P') return { w: 216, h: 279 };
      if (cfg.mode === 'CUSTOM') return { w: Math.max(70, Number(cfg.widthMm) || 110), h: Math.max(100, Number(cfg.heightMm) || 215) };
      return { w: 210, h: 297 };
    }

    function buildColgroupInnerHtml(cols, cfg, fallbackW) {
      const cw = { ...fallbackW, ...(cfg?.colW || {}) };
      const raw = cols.map((c) => Math.max(5, Number(cw[c.k] || 12)));
      const sum = raw.reduce((s, n) => s + n, 0) || 100;
      return raw.map((w) => `<col style="width:${((w / sum) * 100).toFixed(2)}%;">`).join('');
    }

    function buildColgroupHtml(cols, cfg, fallbackW) {
      return `<colgroup>${buildColgroupInnerHtml(cols, cfg, fallbackW)}</colgroup>`;
    }

    function getPdfStyleTokens(cfg) {
      const c = cfg || DEFAULT_SHEET_STOCK;
      const fPx = Math.max(7, Math.min(20, Number(c.fontSizePx) || 12));
      const fSize = `${fPx}px`;
      const rowH = Math.max(18, Math.min(44, Number(c.rowHeight) || 26));
      const padY = Math.max(2, Math.round((rowH - fPx * 1.25) / 2));
      const vAlign = c.vAlign === 'top' || c.vAlign === 'bottom' ? c.vAlign : 'middle';
      const txtAlign = c.textAlign === 'center' || c.textAlign === 'right' ? c.textAlign : 'left';
      const numAlign = c.numAlign === 'left' || c.numAlign === 'right' ? c.numAlign : 'center';
      const txtPadX = `${Math.max(0, Number(c.textPadX ?? 6))}px`;
      const numPadX = `${Math.max(0, Number(c.numPadX ?? 4))}px`;
      const fontStyle = c.italic ? 'italic' : 'normal';
      const baseWt = c.bold ? 800 : 500;
      const keyWt = c.bold ? 900 : 700;
      const wrapCss = c.wrap ? 'white-space:normal;word-break:break-word;' : 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';

      const isDark = c.stylePreset === 'dark';
      const brdColor = c.borderStyle === 'bold' ? (isDark ? '#94a3b8' : '#0f172a') : (c.borderStyle === 'medium' ? (isDark ? '#475569' : '#64748b') : (isDark ? '#263244' : '#cbd5e1'));
      const brdW = c.borderStyle === 'bold' ? '1.6px' : (c.borderStyle === 'medium' ? '1.2px' : '1px');
      const border = `${brdW} solid ${brdColor}`;

      const presets = {
        classic: { pageBg:'#ffffff', textClr:'#0f172a', bannerBg:'#090e17', bannerClr:'#38bdf8', bannerBorder:'none', thBg:'#0f172a', thClr:'#ffffff', thBorder:'1px solid #334155', catBg:'#1c4532', catClr:'#ffffff', footBg:'#0f172a', footClr:'#38bdf8', footOpenClr:'#ffffff', footInClr:'#86efac', footOutClr:'#fca5a5', footAdjClr:'#7dd3fc', footBalClr:'#fde047', rowNormalBg:'#ffffff', rowNormalClr:'#0f172a', rowZeroBg:'#f8d7da', rowZeroClr:'#991b1b', rowLowBg:'#fff3cd', rowLowClr:'#92400e', rowInBg:'#d1fae5', rowAdjBg:'#dbeafe', spacerBg:'#ffffff', mutedClr:'#64748b' },
        dark: { pageBg:'#0b0f17', textClr:'#f1f5f9', bannerBg:'#0f172a', bannerClr:'#93c5fd', bannerBorder:'1px solid #334155', thBg:'#1e293b', thClr:'#e2e8f0', thBorder:'1px solid #475569', catBg:'#b7e1cd', catClr:'#052e16', footBg:'#1e293b', footClr:'#93c5fd', footOpenClr:'#f8fafc', footInClr:'#86efac', footOutClr:'#fca5a5', footAdjClr:'#7dd3fc', footBalClr:'#fde047', rowNormalBg:'#0b0f17', rowNormalClr:'#f1f5f9', rowZeroBg:'#3b1114', rowZeroClr:'#fca5a5', rowLowBg:'#3a290b', rowLowClr:'#fde68a', rowInBg:'#063322', rowAdjBg:'#122645', spacerBg:'#0b0f17', mutedClr:'#94a3b8' },
        bw: { pageBg:'#ffffff', textClr:'#000000', bannerBg:'#ffffff', bannerClr:'#000000', bannerBorder:'2px solid #000000', thBg:'#e2e8f0', thClr:'#000000', thBorder:'1.4px solid #000000', catBg:'#f1f5f9', catClr:'#000000', footBg:'#e2e8f0', footClr:'#000000', footOpenClr:'#000000', footInClr:'#000000', footOutClr:'#000000', footAdjClr:'#000000', footBalClr:'#000000', rowNormalBg:'#ffffff', rowNormalClr:'#000000', rowZeroBg:'#ffffff', rowZeroClr:'#000000', rowLowBg:'#ffffff', rowLowClr:'#000000', rowInBg:'#ffffff', rowAdjBg:'#ffffff', spacerBg:'#ffffff', mutedClr:'#334155' },
        minimal: { pageBg:'#ffffff', textClr:'#0f172a', bannerBg:'#f8fafc', bannerClr:'#0f172a', bannerBorder:'2px solid #0f172a', thBg:'#f1f5f9', thClr:'#0f172a', thBorder:border, catBg:'#ecfdf5', catClr:'#065f46', footBg:'#f8fafc', footClr:'#0f172a', footOpenClr:'#0f172a', footInClr:'#047857', footOutClr:'#b91c1c', footAdjClr:'#0369a1', footBalClr:'#0f172a', rowNormalBg:'#ffffff', rowNormalClr:'#0f172a', rowZeroBg:'#fef2f2', rowZeroClr:'#991b1b', rowLowBg:'#fffbeb', rowLowClr:'#92400e', rowInBg:'#ecfdf5', rowAdjBg:'#eff6ff', spacerBg:'#ffffff', mutedClr:'#64748b' },
      };

      const theme = { ...(presets[c.stylePreset] || presets.classic) };
      if (c.headerBg) { theme.thBg = c.headerBg; theme.thClr = '#ffffff'; theme.bannerBg = c.headerBg; theme.bannerClr = '#ffffff'; }

      const bannerCss = `background:${theme.bannerBg};color:${theme.bannerClr};border:${theme.bannerBorder};`;
      const tdTextCss = (isItem = false) => `height:${rowH}px;padding:${padY}px ${txtPadX};border:${border};text-align:${txtAlign};vertical-align:${vAlign};font-weight:${isItem ? keyWt : baseWt};font-style:${fontStyle};${wrapCss}`;
      const tdNumCss = (isBal = false) => `height:${rowH}px;padding:${padY}px ${numPadX};border:${border};text-align:${numAlign};vertical-align:${vAlign};font-weight:${isBal ? keyWt : baseWt};font-style:${fontStyle};${wrapCss}`;
      const thCss = `height:${Math.max(24, rowH)}px;padding:${padY}px 3px;border:${theme.thBorder};background:${theme.thBg};color:${theme.thClr};font-weight:900;vertical-align:middle;${wrapCss}`;
      const catCss = `height:${Math.max(22, rowH - 2)}px;padding:${padY}px ${txtPadX};border:${border};background:${theme.catBg};color:${theme.catClr};text-align:${txtAlign};vertical-align:${vAlign};font-weight:900;font-style:${fontStyle};`;

      return { fPx, fSize, rowH, padY, vAlign, txtAlign, numAlign, txtPadX, numPadX, border, brdColor, brdW, theme, bannerCss, tdTextCss, tdNumCss, thCss, catCss };
    }

    function isRowToday(dateStr) {
      const s = String(dateStr || '').trim();
      if (!s) return false;
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = String(now.getFullYear());
      return s.includes(`${dd}/${mm}/${yyyy}`) || s.includes(`${yyyy}-${mm}-${dd}`) || s.includes(`${now.getDate()}/${now.getMonth() + 1}/${yyyy}`);
    }

    function csvCell(v) {
      const s = String(v ?? '').replace(/"/g, '""');
      return /[",\n\r]/.test(s) ? `"${s}"` : s;
    }

    function exportSheetCsv(isStock, todayOnly = false) {
      vib(20);
      const dateStr = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
      const lines = [];
      if (isStock) {
        const cfg = sheetCfgs.stock;
        const baseList = cfg.stockShowZero
          ? stockRows
          : stockRows.filter((r) => Number(r.closing_qty || 0) > 0 || Number(r.in_qty || 0) > 0 || Number(r.out_qty || 0) > 0 || Number(r.adj_net_qty || 0) !== 0);
        const groups = buildOrderedStockGroups(baseList, '');
        const cols = getActiveStockPdfCols(cfg, baseList);
        lines.push(['Category', ...cols.map((c) => c.lbl)].map(csvCell).join(','));
        groups.forEach((g) => {
          g.items.forEach((r) => {
            const vals = [g.cat, ...cols.map((c) => {
              if (c.k === 'item') return r.item_name;
              if (c.k === 'open') return r.opening_qty;
              if (c.k === 'inq') return r.in_qty;
              if (c.k === 'outq') return r.out_qty;
              if (c.k === 'adj') return r.adj_net_qty || 0;
              return r.closing_qty;
            })];
            lines.push(vals.map(csvCell).join(','));
          });
        });
      } else {
        const cfg = sheetCfgs.daily;
        const raw = todayOnly ? dailyRows.filter((r) => isRowToday(r.date_str)) : dailyRows;
        const list = getSortedDailyRows(raw, true, Boolean(cfg.includeOpeningInDaily));
        const cols = getActiveDailyPdfCols(cfg);
        lines.push(cols.map((c) => csvCell(c.lbl)).join(','));
        list.forEach((r) => {
          const isV = r.status === 'VOIDED' || r.is_voided || r.doc_type === 'VOID';
          const vals = cols.map((c) => {
            if (c.k === 'doc') return r.doc_no;
            if (c.k === 'item') return isV ? t('voidLabel') : r.item_name;
            if (c.k === 'open') return isV ? '' : (r.opening_bal || 0);
            if (c.k === 'inq') return isV ? '' : (r.qty_in || 0);
            if (c.k === 'outq') return isV ? '' : (r.qty_out || 0);
            if (c.k === 'bal') return isV ? '' : (r.closing_bal || 0);
            if (c.k === 'party') return r.party_name;
            if (c.k === 'ref') return displayRef(r.ref_no, r.doc_type);
            return r.date_str;
          });
          lines.push(vals.map(csvCell).join(','));
        });
      }

      const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${isStock ? 'Stock' : (todayOnly ? 'Daily_Today' : 'Daily_Full')}_${dateStr}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      showToast(t('csvDone'));
    }

    async function generateAndDeliverPdf(isStock, onlyIds, deliveryMode, todayOnly = false, btnEl = null, channelId = '') {
      if (!window.html2canvas || !window.jspdf) { showToast(t('pdfLoading')); return; }

      await withBusy(btnEl, async () => {
        showToast(t('pdfLoading'));
        const stage = document.getElementById('pdfStage');
        try {
          const cfg = isStock ? sheetCfgs.stock : sheetCfgs.daily;
          const brand = getActiveBrand();
          const dateStr = new Date().toLocaleDateString('en-GB');
          const subTitle = (cfg.headerSub || '').trim() || (isStock ? t('pdfStockSub') : (todayOnly ? t('pdfTodaySub') : t('pdfDailySub')));
          const title = `${brand} — ${subTitle} (${dateStr})`;
          const st = getPdfStyleTokens(cfg);

          const sz = getLockedPageSizeMm(cfg);
          const pw = sz.w * 2.83465;
          const ph = sz.h * 2.83465;
          const orient = pw > ph ? 'l' : 'p';

          const stagePx = Math.max(360, Math.min(1150, Math.round(sz.w * 3.7795)));
          const pagePxH = Math.round(stagePx * (sz.h / sz.w));
          const padPx = stagePx <= 520 ? 8 : 20;
          const innerW = stagePx - padPx * 2;
          const renderScale = stagePx <= 520 ? 1.9 : 1.45;

          let colgroupHtml = '';
          const tableStyleExtra = 'table-layout:fixed;';
          let headHtml = '';
          let footTableHtml = '';
          let endListRow = '';
          const units = [];

          if (isStock) {
            let movedThisWeek = null;
            if (!onlyIds && !cfg.stockShowZero && stockPeriod !== 'WEEK') {
              try {
                const wb = getPeriodBounds('WEEK');
                const wr = await callRpc('rpc_get_period_stock_report', { p_token: session.token, p_warehouse_id: currentWhId, p_start: wb.start, p_end: wb.end, p_active_only: false });
                if (wr?.success) {
                  movedThisWeek = new Set();
                  (wr.rows || []).forEach((w) => {
                    if (Number(w.in_qty || 0) > 0 || Number(w.out_qty || 0) > 0 || Number(w.adj_net_qty || 0) !== 0) movedThisWeek.add(w.item_id);
                  });
                }
              } catch {}
            }

            const baseList = onlyIds
              ? stockRows.filter((r) => onlyIds.includes(r.item_id))
              : stockRows.filter((r) => {
                  if (cfg.stockShowZero) return true;
                  if (Number(r.closing_qty || 0) > 0) return true;
                  if (movedThisWeek) return movedThisWeek.has(r.item_id);
                  return Number(r.in_qty || 0) > 0 || Number(r.out_qty || 0) > 0 || Number(r.adj_net_qty || 0) !== 0;
                });

            const groups = buildOrderedStockGroups(baseList, '');
            const cols = getActiveStockPdfCols(cfg, baseList);
            colgroupHtml = buildColgroupHtml(cols, cfg, DEFAULT_SHEET_STOCK.colW);
            headHtml = `<thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>`;
            endListRow = `<tr><td colspan="${cols.length}" style="text-align:center;padding:5px;color:${st.theme.mutedClr};font-size:9.5px;font-weight:700;border:none;">${esc(t('pdfEndList'))}</td></tr>`;

            let opT = 0, inT = 0, outT = 0, adjT = 0, clT = 0, totalItems = 0;
            const makeItemTr = (r) => {
              totalItems++;
              opT += Number(r.opening_qty); inT += Number(r.in_qty); outT += Number(r.out_qty); adjT += Number(r.adj_net_qty); clT += Number(r.closing_qty);
              const lowLim = whData.warehouse?.low_limit || 20;
              const bg = r.closing_qty === 0 ? st.theme.rowZeroBg : (r.closing_qty <= lowLim ? st.theme.rowLowBg : st.theme.rowNormalBg);
              const txtClr = r.closing_qty === 0 ? st.theme.rowZeroClr : (r.closing_qty <= lowLim ? st.theme.rowLowClr : st.theme.rowNormalClr);
              const tds = cols.map((c) => {
                if (c.k === 'item') return `<td style="${st.tdTextCss(true)}">${esc(r.item_name)}</td>`;
                if (c.k === 'open') return `<td style="${st.tdNumCss(false)}">${Number(r.opening_qty).toLocaleString()}</td>`;
                if (c.k === 'inq') return `<td style="${st.tdNumCss(false)}">${Number(r.in_qty).toLocaleString()}</td>`;
                if (c.k === 'outq') return `<td style="${st.tdNumCss(false)}">${Number(r.out_qty).toLocaleString()}</td>`;
                if (c.k === 'adj') return `<td style="${st.tdNumCss(false)}">${Number(r.adj_net_qty).toLocaleString()}</td>`;
                return `<td style="${st.tdNumCss(true)}">${Number(r.closing_qty).toLocaleString()}</td>`;
              }).join('');
              return `<tr style="background:${bg};color:${txtClr};">${tds}</tr>`;
            };

            groups.forEach((grp, gIdx) => {
              const catTr = `<tr><td colspan="${cols.length}" style="${st.catCss}">${esc(grp.cat)}</td></tr>`;
              const spTr = gIdx > 0 ? `<tr style="background:${st.theme.spacerBg};"><td colspan="${cols.length}" style="height:6px;border:none;"></td></tr>` : '';
              let prevLtzKey = null;
              grp.items.forEach((r, idx) => {
                const ltz = parseLtzInfo(r.item_name);
                const ltzSp = (ltz && prevLtzKey && ltz.groupKey !== prevLtzKey)
                  ? `<tr style="background:${st.theme.spacerBg};"><td colspan="${cols.length}" style="height:4px;border-left:${st.border};border-right:${st.border};"></td></tr>` : '';
                prevLtzKey = ltz ? ltz.groupKey : null;
                const itemTr = makeItemTr(r);
                if (idx === 0) {
                  const bundle = []; if (spTr) bundle.push(spTr); bundle.push(catTr, itemTr);
                  units.push({ rows: bundle, noLeadSpacer: gIdx > 0 ? catTr + itemTr : null });
                } else units.push({ rows: ltzSp ? [ltzSp, itemTr] : [itemTr] });
              });
            });

            if (!units.length) units.push({ rows: [`<tr><td colspan="${cols.length}" style="text-align:center;padding:24px;color:${st.theme.mutedClr};border:${st.border};">${esc(t('noItems'))}</td></tr>`] });

            const footTds = cols.map((c) => {
              if (c.k === 'item') return `<td style="padding:6px ${st.txtPadX};text-align:${st.txtAlign};">${esc(t('pdfStockTot')(totalItems))}</td>`;
              if (c.k === 'open') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footOpenClr};">${opT.toLocaleString()}</td>`;
              if (c.k === 'inq') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footInClr};">${inT.toLocaleString()}</td>`;
              if (c.k === 'outq') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footOutClr};">${outT.toLocaleString()}</td>`;
              if (c.k === 'adj') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footAdjClr};">${adjT.toLocaleString()}</td>`;
              return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footBalClr};">${clT.toLocaleString()}</td>`;
            }).join('');
            footTableHtml = `<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}<tbody><tr style="background:${st.theme.footBg};color:${st.theme.footClr};font-weight:900;border:${st.theme.thBorder};">${footTds}</tr></tbody></table>`;
          } else {
            let rawList = onlyIds ? dailyRows.filter((r) => onlyIds.includes(String(r.ledger_id || r.document_id))) : dailyRows;
            if (todayOnly) rawList = rawList.filter((r) => isRowToday(r.date_str));
            const list = getSortedDailyRows(rawList, true, Boolean(onlyIds || cfg.includeOpeningInDaily));
            const cols = getActiveDailyPdfCols(cfg);
            colgroupHtml = buildColgroupHtml(cols, cfg, DEFAULT_SHEET_DAILY.colW);
            headHtml = `<thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>`;
            endListRow = `<tr><td colspan="${cols.length}" style="text-align:center;padding:5px;color:${st.theme.mutedClr};font-size:9.5px;font-weight:700;border:none;">${esc(t('pdfEndList'))}</td></tr>`;

            const docGroups = [], gMap = new Map();
            let inT = 0, outT = 0;
            list.forEach((r) => {
              const dk = String(r.document_id || r.ledger_id);
              if (!gMap.has(dk)) { const g = []; gMap.set(dk, g); docGroups.push(g); }
              gMap.get(dk).push(r);
            });

            docGroups.forEach((gLines, gIdx) => {
              const spTr = gIdx > 0 ? `<tr style="background:${st.theme.spacerBg};"><td colspan="${cols.length}" style="height:4px;border-left:${st.border};border-right:${st.border};"></td></tr>` : '';
              const trs = gLines.map((r, idx) => {
                const same = idx > 0;
                const isV = r.status === 'VOIDED' || r.is_voided || r.doc_type === 'VOID';
                if (!isV) { inT += Number(r.qty_in || 0); outT += Number(r.qty_out || 0); }
                const bg = isV ? st.theme.rowZeroBg : (r.doc_type === 'IN' ? st.theme.rowInBg : (r.doc_type === 'ADJ' ? st.theme.rowAdjBg : (r.is_zero_stock ? st.theme.rowLowBg : st.theme.rowNormalBg)));
                const clr = isV ? st.theme.rowZeroClr : (r.is_zero_stock ? st.theme.rowLowClr : st.theme.rowNormalClr);
                const tds = cols.map((c) => {
                  if (c.k === 'doc') return `<td style="${st.tdNumCss(false)}">${esc(same ? '↳' : r.doc_no)}</td>`;
                  if (c.k === 'item') return `<td style="${st.tdTextCss(true)}">${esc(isV ? t('voidLabel') : r.item_name)}</td>`;
                  if (c.k === 'open') return `<td style="${st.tdNumCss(false)}">${isV ? '-' : Number(r.opening_bal || 0).toLocaleString()}</td>`;
                  if (c.k === 'inq') return `<td style="${st.tdNumCss(false)}">${!isV && r.qty_in ? Number(r.qty_in).toLocaleString() : ''}</td>`;
                  if (c.k === 'outq') return `<td style="${st.tdNumCss(false)}">${!isV && r.qty_out ? Number(r.qty_out).toLocaleString() : ''}</td>`;
                  if (c.k === 'bal') return `<td style="${st.tdNumCss(true)}">${isV ? '-' : Number(r.closing_bal || 0).toLocaleString()}</td>`;
                  if (c.k === 'party') return `<td style="${st.tdTextCss(false)}">${esc(same ? '↳' : r.party_name)}</td>`;
                  if (c.k === 'ref') return `<td style="${st.tdNumCss(false)}">${esc(same ? '↳' : displayRef(r.ref_no, r.doc_type))}</td>`;
                  return `<td style="${st.tdNumCss(false)}">${esc(same ? '↳' : r.date_str)}</td>`;
                }).join('');
                return `<tr style="background:${bg};color:${clr};">${tds}</tr>`;
              });

              if (trs.length <= 8) units.push({ rows: spTr ? [spTr, ...trs] : trs, noLeadSpacer: trs.join('') });
              else trs.forEach((tr, i) => units.push({ rows: (i === 0 && spTr) ? [spTr, tr] : [tr], noLeadSpacer: tr }));
            });

            if (!units.length) units.push({ rows: [`<tr><td colspan="${cols.length}" style="text-align:center;padding:24px;color:${st.theme.mutedClr};border:${st.border};">${esc(t('noItems'))}</td></tr>`] });

            const inIdx = cols.findIndex((c) => c.k === 'inq');
            const outIdx = cols.findIndex((c) => c.k === 'outq');
            const rightSpan = cols.length - outIdx - 1;
            footTableHtml = `<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}<tbody><tr style="background:${st.theme.footBg};color:${st.theme.footClr};font-weight:900;border:${st.theme.thBorder};">
              <td colspan="${inIdx}" style="padding:5px 6px;text-align:left;">${esc(t('pdfTotLabel'))}</td>
              <td style="padding:5px 3px;text-align:${st.numAlign};color:${st.theme.footInClr};">${inT.toLocaleString()}</td>
              <td style="padding:5px 3px;text-align:${st.numAlign};color:${st.theme.footOutClr};">${outT.toLocaleString()}</td>
              ${rightSpan > 1
                ? `<td colspan="${rightSpan - 1}" style="padding:5px 4px;text-align:center;color:${st.theme.footOpenClr};">${esc(t('pdfRowsCount')(list.length))}</td><td style="padding:5px 3px;text-align:center;color:${st.theme.footClr};">${dateStr}</td>`
                : `<td style="padding:5px 3px;text-align:center;color:${st.theme.footClr};">${dateStr}</td>`}
            </tr></tbody></table>`;
          }

          const bannerFont = stagePx <= 520 ? Math.max(10.5, Math.min(14, st.fPx + 1)) : 13.5;
          const titleBannerHtml = `<div style="${st.bannerCss}padding:7px 8px;text-align:center;font-size:${bannerFont}px;font-weight:900;margin-bottom:2px;">${esc(title)}</div>`;
          const noteHtml = (cfg.footerNote || '').trim() ? `<div style="margin-top:6px;font-size:10px;font-weight:700;color:${st.theme.mutedClr};text-align:center;">${esc(cfg.footerNote.trim())}</div>` : '';
          const signHtml = cfg.showSign ? `<div style="display:flex;justify-content:space-between;margin-top:14px;padding:0 10px;font-size:10px;font-weight:800;color:${st.theme.textClr};"><span>${esc(t('pdfSignPrep'))}</span><span>${esc(t('pdfSignApp'))}</span></div>` : '';
          const finalFooterBlock = `${footTableHtml}${noteHtml}${signHtml}`;

          stage.style.width = `${innerW}px`;
          stage.innerHTML = `<div id="mHead">${titleBannerHtml}<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}${headHtml}</table></div>
            <div id="mFoot">${finalFooterBlock}</div>
            <table id="mProbe" style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}<tbody></tbody></table>`;

          const headH = document.getElementById('mHead').offsetHeight;
          const footH = document.getElementById('mFoot').offsetHeight + 22;
          const maxBodyNormal = Math.max(120, pagePxH - padPx * 2 - headH - 24);
          const maxBodyLast = Math.max(80, maxBodyNormal - footH);
          const probeBody = document.querySelector('#mProbe tbody');

          const measured = units.map((u) => {
            probeBody.innerHTML = u.rows.join('');
            return { html: u.rows.join(''), cleanTop: u.noLeadSpacer || u.rows.join(''), h: probeBody.offsetHeight || st.rowH };
          });

          const pages = [];
          let curRows = [], curH = 0;
          measured.forEach((m) => {
            if (curRows.length > 0 && curH + m.h > maxBodyNormal) {
              pages.push({ rows: curRows, usedH: curH });
              curRows = [m.cleanTop]; curH = m.h;
            } else {
              curRows.push(curRows.length === 0 ? m.cleanTop : m.html); curH += m.h;
            }
          });
          if (curRows.length) pages.push({ rows: curRows, usedH: curH });
          if (!pages.length) pages.push({ rows: [], usedH: 0 });
          if (pages[pages.length - 1].usedH > maxBodyLast) pages.push({ rows: [], usedH: 0 });

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: orient, unit: 'pt', format: [pw, ph], compress: true });
          const actualW = pdf.internal.pageSize.getWidth(), actualH = pdf.internal.pageSize.getHeight();
          const totalPages = pages.length;

          stage.style.width = `${stagePx}px`;
          for (let i = 0; i < totalPages; i++) {
            const isLast = i === totalPages - 1;
            const pRows = pages[i].rows.join('') + (isLast ? endListRow : '');
            stage.innerHTML = `
              <div class="pdf-page-box" style="width:${stagePx}px;height:${pagePxH}px;padding:${padPx}px;background:${st.theme.pageBg};color:${st.theme.textClr};">
                <div>${titleBannerHtml}</div>
                <div class="pdf-page-body">
                  <table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}${headHtml}<tbody>${pRows}</tbody></table>
                </div>
                <div class="pdf-page-foot">
                  ${isLast ? finalFooterBlock : ''}
                  <div style="text-align:right;font-size:10px;font-weight:800;color:${st.theme.mutedClr};margin-top:4px;">${i + 1} / ${totalPages}</div>
                </div>
              </div>`;
            const canvas = await window.html2canvas(stage.firstElementChild, {
              scale: renderScale, backgroundColor: st.theme.pageBg, width: stagePx, height: pagePxH,
              windowWidth: stagePx, windowHeight: pagePxH, scrollX: 0, scrollY: 0,
            });
            if (i > 0) pdf.addPage([pw, ph], orient);
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, actualW, actualH, undefined, 'FAST');
          }

          const reportType = isStock ? 'STOCK' : (todayOnly ? 'TODAY_DAILY' : 'FULL_DAILY');
          const fileName = `${isStock ? 'Stock' : (todayOnly ? 'Daily_Today' : 'Daily_Full')}_${dateStr.replace(/\//g, '-')}.pdf`;
          const blob = pdf.output('blob');

          if (deliveryMode === 'download') { pdf.save(fileName); vib([25, 25, 35]); showToast(t('pdfLocal')); return; }
          if (deliveryMode === 'share') {
            try {
              const fileObj = new File([blob], fileName, { type: 'application/pdf' });
              if (navigator.canShare && navigator.canShare({ files: [fileObj] })) { await navigator.share({ files: [fileObj], title }); vib([25, 25, 35]); return; }
            } catch {}
            pdf.save(fileName); showToast(t('pdfLocal')); return;
          }

          try {
            const fd = new FormData();
            fd.append('token', session.token); fd.append('warehouse_id', currentWhId);
            fd.append('report_title', title); fd.append('report_type', reportType);
            if (channelId) fd.append('channel_id', channelId);
            fd.append('file', blob, fileName);
            const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
              method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'x-session-token': session.token }, body: fd,
            }).then((r) => r.json());
            if (res.success) { vib([30, 25, 45]); showToast(t('savedOk')); }
            else { pdf.save(fileName); showToast(res.errors?.[0] || res.error || t('pdfLocal')); }
          } catch { pdf.save(fileName); showToast(t('pdfLocal')); }
        } finally {
          stage.innerHTML = '';
        }
      });
    }

    async function runBulkImport(btnEl) {
      await withBusy(btnEl, async () => {
        const raw = document.getElementById('bulkItemsTxt').value.trim(); if (!raw) return;
        let curCat = ''; const rows = [];
        raw.split(/\r?\n/).forEach((line) => {
          const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map((s) => s.trim());
          const c0 = parts[0] || '', c1 = parts[1] || '', c2 = parts[2] || '';
          if (!c0 && !c1 && !c2) return;
          if (/^(የዕቃ|item|category|ካቴጎሪ)/i.test(c0) && /^(መነሻ|open)/i.test(c1)) return;
          if (parts.length >= 3 && c2 !== '') {
            if (c0) curCat = c0;
            if (c1) rows.push({ category: curCat, name: formatSmartDim(c1), opening_qty: Math.max(0, parseInt(c2.replace(/[^\d-]/g, ''), 10) || 0) });
          } else if (parts.length >= 2 && c1 !== '') {
            if (/^-?\d[\d,]*$/.test(c1)) { if (c0) rows.push({ category: curCat, name: formatSmartDim(c0), opening_qty: Math.max(0, parseInt(c1.replace(/[^\d]/g, ''), 10) || 0) }); }
            else { if (c0) curCat = c0; if (c1) rows.push({ category: curCat, name: formatSmartDim(c1), opening_qty: 0 }); }
          } else if (c0 && !/^-?\d[\d,]*$/.test(c0)) curCat = c0;
        });
        if (!rows.length) return;
        const res = await callRpc('rpc_manage_catalog', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'BULK_IMPORT', p_payload: { rows } });
        if (res.success) { showToast(t('bulkDone')(res.imported_count || 0)); await loadWarehouseData(currentWhId); closeMainModal(); } else showToast(t('errGeneric'));
      });
    }

      switchView('entry', false);
    }

    function switchView(name, pushHist = true) {
      vib(16);
      document.getElementById('focusMenu')?.classList.remove('open');
      if (activeFmtSheet && activeFmtSheet !== name) closeSheetFormatBar();
      if (currentView === 'tally' && name !== 'tally') releaseWakeLock();

      const prevView = currentView;
      currentView = name;
      const map = { entry:'viewEntry', tally:'viewTally', daily:'viewDaily', stock:'viewStock', map:'viewMap' };
      const nav = { entry:'navEntry', tally:'navTally', daily:'navDaily', stock:'navStock', map:'navMap' };
      Object.values(map).forEach((id) => document.getElementById(id).classList.remove('active'));
      Object.values(nav).forEach((id) => document.getElementById(id).classList.remove('active'));
      document.getElementById(map[name]).classList.add('active');
      document.getElementById(nav[name]).classList.add('active');

      selectedPdfIds = {}; updatePdfBar();
      document.getElementById('submitDock').style.display = (name === 'entry' && basket.length) ? 'flex' : 'none';
      updateShellFocusState();

      if (pushHist && name !== 'entry' && prevView === 'entry') {
        try { history.pushState({ view: name }, ''); } catch {}
      }

      if (name === 'tally') { ensureWakeLock(); renderTally(true); }
      if (name === 'daily') loadDaily(true);
      if (name === 'stock') loadStock();
      if (name === 'map') renderMap();
    }

    window.addEventListener('popstate', () => {
      if (document.getElementById('mainModal')?.classList.contains('open')) { closeMainModal(); return; }
      if (activeFmtSheet) { closeSheetFormatBar(); return; }
      if (currentView !== 'entry') switchView('entry', false);
    });

    // ቆጠራ ገጽ ላይ ሙሉ ለሙሉ የጠፋ፤ ሌሎች ገጾች ላይ ደግሞ ከግራ ጥግ (≤20px) እስከ 78% ቀስ ብሎ ሲጎተት ብቻ የሚወጣ
    const ENABLE_EDGE_SWIPE = true; // ሙሉ ለሙሉ ለማጥፋት false አድርገው

    function bindEdgeSwipeBack() {
      const shell = document.getElementById('appShell');
      document.addEventListener('click', (e) => {
        const menu = document.getElementById('focusMenu');
        if (menu?.classList.contains('open') && !e.target.closest('#focusMenu, #btnEntryQuickJump')) {
          menu.classList.remove('open');
        }
      });

      if (!shell || !ENABLE_EDGE_SWIPE) return;

      let sx = 0, sy = 0, curDx = 0, tracking = false;
      const bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;left:0;top:0;height:4px;width:0%;z-index:850;background:var(--teal);pointer-events:none;transition:opacity 0.15s ease;opacity:0;';
      document.body.appendChild(bar);

      const reset = () => {
        tracking = false; curDx = 0;
        bar.style.width = '0%'; bar.style.opacity = '0';
      };

      shell.addEventListener('touchstart', (e) => {
        if (currentView === 'entry' || currentView === 'tally' || e.touches.length !== 1) return reset();
        if (document.getElementById('mainModal')?.classList.contains('open')) return reset();
        if (document.getElementById('drawer')?.classList.contains('open')) return reset();
        const tgt = e.target;
        if (tgt.closest('#sheetFmtBar, #sheetFmtPanel, input, select, textarea, button')) return reset();

        const x0 = e.touches[0].clientX;
        if (x0 > 20) return reset();

        const scroller = tgt.closest('.tbl-wrap, .rack-wrap, .rack-tabs');
        if (scroller && scroller.scrollLeft > 2) return reset();

        sx = x0;
        sy = e.touches[0].clientY;
        curDx = 0;
        tracking = true;
      }, { passive: true });

      shell.addEventListener('touchmove', (e) => {
        if (!tracking || !e.touches.length) return;
        const dx = e.touches[0].clientX - sx;
        const dy = Math.abs(e.touches[0].clientY - sy);
        if (dy > 45 || dx < 0) return reset();

        curDx = dx;
        const need = Math.max(240, window.innerWidth * 0.78);
        const pct = Math.min(100, Math.round((dx / need) * 100));
        if (dx > 20) {
          bar.style.opacity = '1';
          bar.style.width = `${pct}%`;
          bar.style.background = pct >= 100 ? 'var(--emerald)' : 'var(--teal)';
        }
      }, { passive: true });

      shell.addEventListener('touchend', () => {
        if (!tracking) return;
        const need = Math.max(240, window.innerWidth * 0.78);
        const ok = curDx >= need;
        reset();
        if (ok) exitFocusToEntry();
      }, { passive: true });

      shell.addEventListener('touchcancel', reset, { passive: true });
    }

    function toggleLang() {
      lang = (lang === 'am') ? 'en' : 'am'; localStorage.setItem(LANG_KEY, lang); vib(18);
      renderStaticLabels(); renderDynamicFormFields();
      if (session) {
        updateShellFocusState(); renderDrawerMenu(); renderTiles(); renderBasket();
        renderTally(true); renderDaily(); renderStock(); renderMap();
        if (activeFmtSheet) { renderSheetFormatBar(); renderSheetFormatPanel(); }
      }
    }

    function maybeAutoPauseTally() {
      if (!tallyCfg.autoPauseCall || tallyPaused) return;
      if (currentView !== 'tally') return;
      const ctx = getActiveStrokeContext();
      if (ctx.strokes && ctx.strokes.length > 0) setTallyPausedState(true);
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) maybeAutoPauseTally(); });

    setInterval(() => {
      if (currentView === 'tally') updateCadenceStrip();
    }, 1000);

    (function boot() {
      if ('speechSynthesis' in window && window.speechSynthesis.getVoices) {
        try { window.speechSynthesis.getVoices(); } catch {}
      }
      const urlOrg = new URLSearchParams(location.search).get('org');
      if (urlOrg) document.getElementById('inpOrgCode').value = urlOrg.toUpperCase();
      bindEdgeSwipeBack();
      renderStaticLabels();
      if (session?.token) enterApp();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
      }
    })();
  </script>
