<!DOCTYPE html>
<html lang="am" id="docRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>መጋዘን</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="theme-color" content="#060a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #060a12; --surface: #0f172a; --surface-deep: #090f1d;
      --border: #1e293b; --border-strong: #334155;
      --text: #f8fafc; --muted: #94a3b8;
      --primary: #0ea5e9; --teal: #14b8a6; --teal-dark: #042f2e;
      --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: auto; }
    html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

    /* መግቢያ */
    .gate { position: fixed; inset: 0; z-index: 900; background: radial-gradient(circle at top, #172554 0%, #060a12 72%); display: flex; align-items: center; justify-content: center; padding: 14px; }
    .gate-card { width: 100%; max-width: 360px; background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border-strong); border-radius: 22px; padding: 22px 18px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 24px 48px rgba(0,0,0,0.75); }
    .gate-mark { width: 54px; height: 54px; margin: 0 auto; border-radius: 15px; border: 2px solid var(--teal); background: var(--surface-deep); color: var(--teal); font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .gate-title { text-align: center; font-size: 16px; font-weight: 900; }
    .gate-pin { height: 46px; text-align: center; font-size: 22px; letter-spacing: 8px; -webkit-text-security: disc; }

    /* ዋና ቅርፊት */
    .shell { max-width: 640px; height: 100vh; height: 100dvh; margin: 0 auto; display: none; flex-direction: column; padding: 6px 6px 0; position: relative; overflow: hidden; }
    .topbar { height: 42px; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 0 7px; margin-bottom: 6px; flex-shrink: 0; }
    .icon-btn { width: 32px; height: 30px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--primary); font-size: 14px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-box { display: flex; flex-direction: column; min-width: 0; flex-shrink: 1; }
    .brand-name { font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 8.5px; font-weight: 800; color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wh-sel { margin-left: auto; max-width: 138px; height: 30px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--primary); background: var(--surface-deep); color: var(--primary); font-size: 11px; font-weight: 900; outline: none; }
    .sync-pill { display: none; height: 26px; padding: 0 7px; border-radius: 13px; border: 1px solid var(--amber); background: rgba(245,158,11,0.18); color: #fde68a; font-size: 10px; font-weight: 900; cursor: pointer; flex-shrink: 0; }

    /* ጎን ሜኑ */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.76); backdrop-filter: blur(4px); z-index: 600; display: none; }
    .drawer { position: fixed; top: 0; left: -295px; width: 285px; height: 100%; background: #070b14; border-right: 1px solid var(--border-strong); z-index: 601; transition: left 0.22s ease; display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; }
    .drawer.open { left: 0; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .drawer-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .drawer-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 10px; border-radius: 10px; background: transparent; border: none; color: var(--text); font-size: 12.5px; font-weight: 800; text-align: left; cursor: pointer; width: 100%; }
    .drawer-item:active { background: var(--surface); color: var(--teal); }
    .badge-cnt { background: var(--rose); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 10px; }

    /* የጋራ ክፍሎች */
    .view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }
    .seg { display: flex; gap: 5px; margin-bottom: 5px; flex-shrink: 0; }
    .seg-btn { flex: 1; height: 33px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; }
    .seg-btn.out { background: #3b0a0a; border-color: var(--rose); color: #fca5a5; }
    .seg-btn.in { background: #052e16; border-color: var(--emerald); color: #86efac; }
    .seg-btn.adj { background: #172554; border-color: var(--primary); color: #7dd3fc; }
    .seg-btn.teal { background: var(--teal-dark); border-color: var(--teal); color: #99f6e4; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 6px; margin-bottom: 5px; flex-shrink: 0; }
    .inp, .sel, .txtarea { width: 100%; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 12px; font-weight: 800; outline: none; }
    .txtarea { height: 120px; padding: 8px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
    .inp:focus, .sel:focus, .txtarea:focus { border-color: var(--teal); }
    .inp.mono { font-family: ui-monospace, monospace; text-align: center; color: var(--primary); }
    .grid-3 { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .doc-combo { display: flex; border: 1.5px solid var(--primary); border-radius: 8px; overflow: hidden; height: 34px; background: var(--surface-deep); }
    .doc-combo input { border: none; border-radius: 0; flex: 1; min-width: 0; text-align: center; color: var(--primary); font-family: ui-monospace, monospace; }
    .btn-void-mini { border: none; border-left: 1px solid #7f1d1d; background: #450a0a; color: #fca5a5; padding: 0 7px; font-size: 9.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; }
    .pad-combo { display: flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; height: 34px; background: var(--surface-deep); }
    .pad-tag { background: #0369a1; color: #fff; font-size: 10px; font-weight: 900; padding: 0 7px; display: inline-flex; align-items: center; flex-shrink: 0; }
    .pad-combo input { border: none; border-radius: 0; flex: 1; min-width: 0; }
    .extra-fields { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    .extra-fields > * { flex: 1 1 110px; }

    /* ገጽ 1: መመዝገቢያ */
    .quick-row { display: grid; grid-template-columns: 1fr 68px 40px; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .btn-ok-sq { height: 34px; border: none; border-radius: 8px; background: var(--emerald); color: #052e16; font-size: 17px; font-weight: 900; cursor: pointer; }
    .tiles { flex: 1 1 auto; min-height: 90px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 5px; padding-bottom: 70px; }
    .tiles.has-basket { padding-bottom: 8px; }
    .tile { background: var(--surface-deep); border: 1px solid var(--border-strong); border-radius: 10px; padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
    .tile.picked { border-color: var(--emerald); background: rgba(6, 78, 59, 0.34); }
    .tile-top { display: flex; justify-content: space-between; gap: 4px; align-items: center; }
    .tile-name { font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-bal { font-size: 11.5px; font-weight: 900; color: var(--emerald); font-family: ui-monospace, monospace; }
    .tile-bal.zero { color: var(--amber); }
    .tile-bot { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--muted); font-weight: 800; }
    .tile-cnt-btn { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--teal); background: rgba(20,184,166,0.14); color: var(--teal); font-size: 9.5px; font-weight: 900; cursor: pointer; }

    /* ቅርጫት */
    .basket-wrap { display: none; flex: 0 0 auto; max-height: 32vh; flex-direction: column; margin-top: auto; margin-bottom: 110px; padding-top: 4px; }
    .basket-list { overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 5px; }
    .b-row { height: 42px; background: rgba(15, 23, 42, 0.86); border: 1.5px solid rgba(56, 189, 248, 0.38); border-radius: 21px; padding: 4px 8px 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; backdrop-filter: blur(6px); }
    .b-row.dragging { border-color: var(--teal); background: rgba(20, 184, 166, 0.28); transform: scale(1.02); }
    .b-drag { min-width: 28px; height: 28px; border-radius: 14px; background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: none; cursor: grab; }
    .b-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .b-qty { width: 60px; height: 29px; border-radius: 14px; border: 1.5px solid var(--primary); background: var(--bg); color: #fff; text-align: center; font-size: 12.5px; font-weight: 900; }
    .b-del { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 900; cursor: pointer; }

    .dock { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 44px; background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(56, 189, 248, 0.45); border-radius: 22px; padding: 4px 6px 4px 14px; display: none; align-items: center; justify-content: space-between; z-index: 40; backdrop-filter: blur(8px); }
    .dock-btn { height: 34px; padding: 0 15px; border: none; border-radius: 17px; font-size: 12px; font-weight: 900; cursor: pointer; }
    .dock-btn.out { background: var(--rose); color: #fff; }
    .dock-btn.in { background: var(--emerald); color: #052e16; }

    /* ገጽ 2: ቆጠራ */
    .ticket-bar { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 5px; flex-shrink: 0; padding-bottom: 2px; }
    .tk-tab { height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tk-tab.active { background: #172554; border-color: var(--primary); color: #fff; }
    .tk-tab.add { border-style: dashed; border-color: var(--teal); color: var(--teal); }
    .tk-items { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 5px; flex-shrink: 0; padding-bottom: 2px; }
    .tk-pill { height: 32px; padding: 0 9px; border-radius: 9px; border: 1.5px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .tk-pill.active { border-color: var(--teal); background: rgba(20,184,166,0.22); color: #99f6e4; }
    .tk-pill.done { border-color: var(--emerald); background: rgba(16,185,129,0.2); color: #86efac; }
    .tk-pill.add { border-style: dashed; border-color: var(--amber); color: var(--amber); }

    .preset-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .preset-btn { height: 31px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-family: ui-monospace, monospace; font-size: 11px; font-weight: 900; cursor: pointer; }
    .preset-btn.active { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); }
    .preset-btn.custom { font-family: inherit; font-size: 10px; color: var(--amber); }
    .alert-box { display: none; padding: 6px 10px; border-radius: 10px; text-align: center; font-size: 11px; font-weight: 900; margin-bottom: 5px; flex-shrink: 0; }
    .alert-box.warn { display: block; background: rgba(245,158,11,0.22); border: 1.5px solid var(--amber); color: #fde68a; }
    .alert-box.stop { display: block; background: var(--emerald); color: #022c22; }
    .alert-box.over { display: block; background: rgba(14,165,233,0.18); border: 1.5px solid var(--primary); color: #7dd3fc; }
    .tally-pad { flex: 1; min-height: 0; background: var(--surface-deep); border: 2px dashed rgba(20,184,166,0.45); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; touch-action: pan-y; margin-bottom: 5px; }
    .tally-pad.flash { border-color: var(--emerald); background: rgba(16,185,129,0.08); }
    .tally-pad.near { border-color: var(--amber); background: rgba(245,158,11,0.08); }
    .tally-pad.done { border-style: solid; border-color: var(--emerald); }
    .tally-canvas { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 10px; }
    .t-grp { position: relative; width: 42px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .t-bar { width: 3.5px; height: 30px; background: var(--emerald); margin: 0 2.5px; border-radius: 2px; }
    .t-bar.odd { background: var(--amber); }
    .t-slash { position: absolute; width: 44px; height: 4px; background: var(--amber); border-radius: 2px; transform: rotate(-28deg); }
    .anim-b { animation: pBar 0.12s ease-out; }
    .anim-s { animation: pSlash 0.14s ease-out; }
    @keyframes pBar { from { transform: scaleY(0.3); opacity: 0.3; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes pSlash { from { transform: rotate(-28deg) scaleX(0.2); opacity: 0.3; } to { transform: rotate(-28deg) scaleX(1); opacity: 1; } }
    .t-stats { display: grid; grid-template-columns: 1fr 0.8fr 1fr; background: rgba(15,23,42,0.95); border-top: 1px solid var(--border); padding: 6px 12px; flex-shrink: 0; }
    .t-stat { display: flex; flex-direction: column; }
    .t-stat.c { align-items: center; }
    .t-stat.r { align-items: flex-end; }
    .t-lbl { font-size: 9px; font-weight: 800; color: var(--muted); }
    .t-num { font-family: ui-monospace, monospace; font-size: 21px; font-weight: 900; line-height: 1.1; }
    .t-actions { display: grid; grid-template-columns: 0.75fr 0.75fr 0.75fr 1.75fr; gap: 5px; margin-bottom: 62px; flex-shrink: 0; }
    .t-btn { height: 41px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 10.5px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .t-btn.commit { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); font-size: 11.5px; }

    /* ሠንጠረዦች */
    .metrics { display: flex; justify-content: space-around; background: var(--surface-deep); border: 1px solid var(--border); border-radius: 7px; padding: 4px; margin-top: 5px; font-size: 10.5px; font-weight: 900; }
    .tbl-wrap { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; margin-bottom: 62px; }
    table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
    table.tbl th { position: sticky; top: 0; z-index: 5; background: var(--surface-deep); color: var(--primary); padding: 7px 4px; border-bottom: 1.5px solid var(--border-strong); border-right: 1px solid var(--border); font-size: 10px; font-weight: 900; white-space: nowrap; }
    table.tbl td { padding: 6px 4px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-weight: 800; white-space: nowrap; }
    tr.r-in { background: rgba(16,185,129,0.14); color: #a7f3d0; }
    tr.r-void { background: rgba(239,68,68,0.18); color: #fca5a5; }
    tr.r-adj { background: rgba(14,165,233,0.16); color: #bae6fd; }
    tr.r-zero { background: rgba(245,158,11,0.22); color: #fde68a; }
    tr.r-cat { background: #143323; color: #6ee7b7; }
    tr.r-sel { background: rgba(14,165,233,0.34) !important; color: #7dd3fc !important; }
    tr.r-sel td:first-child { border-left: 3px solid var(--emerald); }
    tr.r-sp td { height: 7px; padding: 0; background: var(--bg); border-left: none; border-right: none; }

    /* ተንሳፋፊ የፒዲኤፍ አሞሌ */
    .pdf-bar { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 42px; background: rgba(6,78,59,0.9); border: 1.5px solid var(--emerald); border-radius: 21px; padding: 4px 8px; display: none; align-items: center; justify-content: space-between; gap: 6px; z-index: 45; backdrop-filter: blur(8px); }
    .pdf-pill { height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.22); background: rgba(15,23,42,0.82); color: #fff; font-size: 11px; font-weight: 900; cursor: pointer; }
    .pdf-send { height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: var(--emerald); color: #052e16; font-size: 11px; font-weight: 900; cursor: pointer; }

    /* ካርታ */
    .rack-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 6px; flex-shrink: 0; }
    .rack-tab { min-width: 72px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .rack-tab.active { background: var(--primary); color: #fff; border-color: #7dd3fc; }
    .rack-wrap { flex: 1; overflow: auto; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px; margin-bottom: 62px; }
    .rack-grid { display: grid; gap: 5px; min-width: 280px; }
    .bin { min-height: 54px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; }
    .bin.used { background: #064e3b; border-color: var(--emerald); }
    .bin.hl { border: 2px dashed var(--amber); background: #451a03; }
    .bin.sel { border: 2px solid var(--primary); background: #0369a1; }
    .bin-id { font-size: 9.5px; font-weight: 900; color: var(--primary); }
    .bin-it { font-size: 8.5px; font-weight: 800; word-break: break-word; }

    /* የታችኛው አውራ ጣት ዳሰሳ */
    .bottom-nav { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 50px; background: rgba(15,23,42,0.78); border: 1px solid rgba(255,255,255,0.22); border-radius: 25px; display: flex; align-items: center; padding: 3px 4px; z-index: 50; backdrop-filter: blur(8px); }
    .nav-item { flex: 1; height: 42px; border-radius: 21px; border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .nav-item .ico { font-size: 15px; line-height: 1; }
    .nav-item.active { background: rgba(14,165,233,0.45); color: #fff; border: 1px solid rgba(56,189,248,0.7); }

    /* ሞዳል እና ማሳወቂያ */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; padding: 10px; z-index: 800; }
    .modal-bg.open { display: flex; }
    .modal-card { width: 100%; max-width: 440px; max-height: 88vh; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 900; color: var(--teal); }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .modal-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-top: 6px; border-top: 1px solid var(--border); }
    .btn { height: 40px; border-radius: 10px; border: none; font-size: 12px; font-weight: 900; cursor: pointer; padding: 0 12px; color: #fff; }
    .btn.teal { background: var(--teal); color: var(--teal-dark); }
    .btn.primary { background: var(--primary); }
    .btn.danger { background: var(--rose); }
    .btn.muted { background: #1e293b; color: var(--text); }

    function playTone(f, d, type = 'sine', vol = 0.12) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch {}
    }

    // ==================== API እና Offline Sync ====================
    async function callRpc(fnName, params = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify(params),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || 'RPC_ERROR');
      return data;
    }

    async function callBot(payload) {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'x-session-token': session?.token || '' },
        body: JSON.stringify({ ...payload, token: session?.token || '', function_name: BOT_FUNCTION }),
      });
      return await res.json();
    }

    function updateSyncPill() {
      const q = getOfflineQueue();
      const pill = document.getElementById('syncPill');
      if (q.length > 0) { pill.style.display = 'inline-flex'; pill.style.alignItems = 'center'; pill.textContent = t('syncNow')(q.length); }
      else pill.style.display = 'none';
    }

    async function syncOfflineQueue() {
      const q = getOfflineQueue();
      if (!q.length || !navigator.onLine || !session?.token) return;
      const remaining = []; let synced = 0;
      for (const job of q) {
        try {
          const r = await callRpc('rpc_post_document', { ...job.params, p_token: session.token });
          if (r.success) {
            synced++;
            if (job.params.p_doc_type === 'IN' && r.document_id) {
              callBot({ action: 'send_grn', warehouse_id: job.params.p_warehouse_id, document_id: r.document_id }).catch(() => {});
            }
          } else remaining.push(job);
        } catch { remaining.push(job); }
      }
      saveJson(QUEUE_KEY, remaining); updateSyncPill();
      if (synced > 0) { showToast(t('syncedOk')); loadWarehouseData(currentWhId); }
    }
    window.addEventListener('online', syncOfflineQueue);

    function renderBasket() {
      const wrap = document.getElementById('basketWrap');
      const list = document.getElementById('basketList');
      const dock = document.getElementById('submitDock');
      const grid = document.getElementById('tilesGrid');
      const active = document.getElementById('viewEntry').classList.contains('active');

      if (!basket.length) {
        wrap.style.display = 'none'; dock.style.display = 'none'; grid.classList.remove('has-basket'); return;
      }
      wrap.style.display = 'flex'; dock.style.display = active ? 'flex' : 'none'; grid.classList.add('has-basket');

      list.innerHTML = '';
      basket.forEach((b, i) => {
        const row = document.createElement('div');
        row.className = 'b-row';
        row.innerHTML = `
          <span class="b-drag">${i + 1}</span>
          <span class="b-name">${esc(b.name)} ${b.tally_proof ? `<small style="color:var(--teal);">🧮${b.tally_proof.strokes.length}</small>` : ''}</span>
          <input type="number" class="b-qty" value="${b.qty}" min="1">

        row.querySelector('.b-drag').addEventListener('pointerdown', (e) => startBasketDrag(row, e));
        row.querySelector('.b-qty').addEventListener('input', (e) => {
          const curIdx = Array.from(list.children).indexOf(row);
          if (curIdx >= 0) { basket[curIdx].qty = Math.max(1, Math.floor(Number(e.target.value) || 1)); updateDockTot(); }
        });
        row.querySelector('.b-del').addEventListener('click', () => {
          const curIdx = Array.from(list.children).indexOf(row);
          if (curIdx >= 0) { basket.splice(curIdx, 1); vib(18); renderBasket(); renderTiles(); }
        });
        list.appendChild(row);
      });
      updateDockTot();
    }

    function updateDockTot() {
      const tot = basket.reduce((s, b) => s + Number(b.qty || 0), 0);
      document.getElementById('lblDockTot').textContent = t('dockTot')(basket.length, tot.toLocaleString());

    function startBasketDrag(rowEl, e) {
      if (basket.length <= 1) return;
      e.preventDefault();
      const list = document.getElementById('basketList');
      dragEl = rowEl; dragIdx = Array.from(list.children).indexOf(rowEl);
      rowEl.classList.add('dragging'); vib(30);

      const onMove = (ev) => {
        if (!dragEl) return;
        const rows = Array.from(list.children);
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i].getBoundingClientRect();
          if (ev.clientY >= r.top && ev.clientY <= r.bottom && i !== dragIdx) {
            const moved = basket.splice(dragIdx, 1)[0];
            basket.splice(i, 0, moved);
            list.insertBefore(dragEl, i < dragIdx ? rows[i] : rows[i].nextSibling);
            dragIdx = i; vib(14);
            Array.from(list.children).forEach((el, k) => el.querySelector('.b-drag').textContent = k + 1);
            break;
          }
        }
      };
      const onUp = () => {
        if (dragEl) dragEl.classList.remove('dragging');
        dragEl = null; dragIdx = -1;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    async function submitGenericDocument(docType, docNo, party, ref, itemsPayload, onSuccess) {
      if (!itemsPayload.length) { showToast(t('errNeedCount')); return; }
      if (docType === 'OUT' && !docNo) { showToast(t('errNeedDoc')); return; }

      if (docType === 'OUT' && navigator.onLine) {
        const chk = await callRpc('rpc_check_doc_sequence', { p_token: session.token, p_warehouse_id: currentWhId, p_doc_no: docNo });
        if (chk.is_duplicate) {
          openDuplicateModal(docNo, chk.existing, (adminPin) => executePostDocument(docType, docNo, party, ref, itemsPayload, null, adminPin, onSuccess));
          return;
        }
        const nVal = Number(docNo);
        if (whData.last_doc_num > 0 && nVal > whData.next_doc_num && !/^\d+-\d+$/.test(docNo)) {
          openSeqJumpModal(docNo, whData.next_doc_num, (voidRange) => executePostDocument(docType, docNo, party, ref, itemsPayload, voidRange, null, onSuccess));
          return;
        }
      }
      executePostDocument(docType, docNo, party, ref, itemsPayload, null, null, onSuccess);
    }

    async function executePostDocument(docType, docNo, party, ref, itemsPayload, voidRangeFirst, adminPin, onSuccess) {
      const params = {
        p_token: session.token, p_warehouse_id: currentWhId, p_doc_type: docType,
        p_doc_no: docNo, p_party_name: party, p_ref_no: ref, p_items: itemsPayload,
        p_idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : 'k_' + Date.now() + '_' + Math.random()),
        p_void_range_first: voidRangeFirst, p_admin_override_pin: adminPin,
      };

      if (!navigator.onLine) {
        const q = getOfflineQueue(); q.push({ params, ts: Date.now() }); saveJson(QUEUE_KEY, q);
        if (onSuccess) onSuccess(); renderBasket(); updateSyncPill();
        showToast(t('offlineSaved')); return;
      }

      try {
        const res = await callRpc('rpc_post_document', params);
        if (!res.success) { showToast(res.error === 'INSUFFICIENT_STOCK' ? t('errStock') : t('errGeneric')); return; }
        vib([35, 30, 50]); playTone(680, 0.1, 'triangle');
        if (docType === 'IN' && res.document_id) {
          callBot({ action: 'send_grn', warehouse_id: currentWhId, document_id: res.document_id }).catch(() => {});
        }
        if (onSuccess) onSuccess();
        showToast(t('savedOk') + (res.zero_out_items?.length ? ` ⚠️ 0: ${res.zero_out_items.join(', ')}` : ''));
        loadWarehouseData(currentWhId);
      } catch {
        const q = getOfflineQueue(); q.push({ params, ts: Date.now() }); saveJson(QUEUE_KEY, q);
        if (onSuccess) onSuccess(); renderBasket(); updateSyncPill();
        showToast(t('offlineSaved'));
      }
    }

    function promptDirectVoid() {
      const docNo = document.getElementById('inpDocNo').value.trim();
      if (!docNo) { showToast(t('errNeedDoc')); return; }
      openMainModal(t('voidLabel'), `<div class="sub-card" style="font-weight:900;text-align:center;">#${esc(docNo)} ➔ ${esc(t('voidLabel'))}</div>`,
        `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('cancel'))}</button>
         <button type="button" class="btn danger" id="btnDoVoid">${esc(t('voidShort'))}</button>`);
      document.getElementById('btnDoVoid').onclick = () => executeDirectVoid(docNo);
    }

    async function executeDirectVoid(docNo) {
      closeMainModal();
      const res = await callRpc('rpc_post_document', {
        p_token: session.token, p_warehouse_id: currentWhId, p_doc_type: 'VOID',
        p_doc_no: docNo, p_party_name: t('voidLabel'), p_ref_no: '-', p_items: [],
        p_idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : 'v_' + Date.now()),
      });
      if (res.success) { showToast(t('savedOk')); loadWarehouseData(currentWhId); } else showToast(t('errGeneric'));
    }

    // ==================== ገጽ 2: ቆጠራ (ግብ ማቆሚያ + የመጨረሻ ጭረት ማስጠንቀቂያ) ====================
    function loadTallyState() {
      const st = loadJson(TALLY_STATE_KEY, null);
      if (st) {
        tallyTab = st.tallyTab || 'TICKET'; carryMult = st.carryMult || 5;
        tickets = Array.isArray(st.tickets) ? st.tickets : [];
        activeTicketId = st.activeTicketId || '';
        freeTally = { label: '', target: 0, lockTarget: true, strokes: [], ...(st.freeTally || {}) };
        auditTally = st.auditTally || { itemId: '', strokes: [] };
      }
      ensureDefaultTicket();
    }

    function saveTallyState() { saveJson(TALLY_STATE_KEY, { tallyTab, carryMult, tickets, activeTicketId, freeTally, auditTally }); }

    function ensureDefaultTicket() {
      if (!tickets.length) {
        const id = 'tk_' + Date.now();
        tickets.push({ id, dir: 'OUT', docNo: String(whData.next_doc_num || ''), party: '', ref: '', items: [], activeItemId: '' });
        activeTicketId = id; saveTallyState();
      } else if (!tickets.some((x) => x.id === activeTicketId)) activeTicketId = tickets[0].id;
    }

    function getActiveTicket() { ensureDefaultTicket(); return tickets.find((x) => x.id === activeTicketId) || tickets[0]; }
    function getActiveTicketItem() {
      const tk = getActiveTicket();
      if (!tk || !tk.items.length) return null;
      let it = tk.items.find((x) => x.item_id === tk.activeItemId);
      if (!it) { it = tk.items[0]; tk.activeItemId = it.item_id; }
      return it;
    }

    function addNewTicket() {
      vib(20);
      const maxDoc = tickets.reduce((m, tk) => Math.max(m, docNumInt(tk.docNo)), Number(whData.last_doc_num || 0));
      const id = 'tk_' + Date.now() + '_' + Math.floor(Math.random() * 99);
      tickets.push({ id, dir: 'OUT', docNo: maxDoc > 0 ? String(maxDoc + 1) : '', party: '', ref: '', items: [], activeItemId: '' });
      activeTicketId = id; saveTallyState(); renderTally();
    }

    function selectTicket(id) { vib(15); activeTicketId = id; saveTallyState(); renderTally(); }
    function deleteActiveTicket() { vib(22); tickets = tickets.filter((x) => x.id !== activeTicketId); ensureDefaultTicket(); saveTallyState(); renderTally(); }
    function toggleTicketDir() { const tk = getActiveTicket(); tk.dir = tk.dir === 'OUT' ? 'IN' : 'OUT'; vib(16); saveTallyState(); renderTally(); }
    function updateTicketField(field, val) { const tk = getActiveTicket(); tk[field] = val; saveTallyState(); renderTicketBarOnly(); }
    function toggleFreeLock() { freeTally.lockTarget = !freeTally.lockTarget; vib(16); saveTallyState(); renderTally(); }

    function openInTally(itemId) {
      const it = (whData.items || []).find((x) => x.id === itemId);
      if (!it) return;
      tallyTab = 'TICKET';
      const tk = getActiveTicket();
      if (!tk.items.some((x) => x.item_id === itemId)) tk.items.push({ item_id: it.id, name: it.name, target: 0, strokes: [] });
      tk.activeItemId = itemId; saveTallyState(); switchView('tally');
    }

    function openTicketAddItemModal() {
      const tk = getActiveTicket();
      const itemOpts = (whData.items || []).map((it) => `<option value="${it.id}">${esc(it.name)} (${it.stock})</option>`).join('');
      const listHtml = tk.items.map((x) => `
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;padding:4px 0;border-bottom:1px solid var(--border);">
          <span>${esc(x.name)} ${x.target > 0 ? `<b style="color:var(--teal);">(${x.target})</b>` : ''}</span>
          <button type="button" class="icon-btn" style="width:24px;height:24px;color:var(--rose);" onclick="removeTicketItem('${x.item_id}')">✕</button>
        </div>`).join('') || `<div class="lbl-sm" style="text-align:center;">${esc(t('noItems'))}</div>`;

      openMainModal(t('tkAddModalTitle'), `
        <div class="sub-card">
          <input type="text" id="tkModFilter" class="inp" placeholder="${esc(t('searchPh'))}" oninput="filterTkItemSelect(this.value)">
          <select id="tkModSel" class="sel">${itemOpts}</select>
          <div class="grid-2">
            <input type="number" id="tkModTarget" class="inp mono" min="0" inputmode="numeric" placeholder="${esc(t('tkTargetPh'))}">
            <button type="button" class="btn teal" onclick="pushItemToTicket()">+ ${esc(t('add'))}</button>
          </div>
        </div>
        <div class="sub-card">${listHtml}</div>`,
        `<button type="button" class="btn primary" style="grid-column:span 2;" onclick="closeMainModal();renderTally();">${esc(t('ok'))}</button>`);
    }

    function filterTkItemSelect(q) {
      const clean = q.trim().toLowerCase();
      document.getElementById('tkModSel').innerHTML = (whData.items || [])
        .filter((it) => !clean || it.name.toLowerCase().includes(clean))
        .map((it) => `<option value="${it.id}">${esc(it.name)} (${it.stock})</option>`).join('');
    }

    function pushItemToTicket() {
      const itemId = document.getElementById('tkModSel')?.value;
      const it = (whData.items || []).find((x) => x.id === itemId);
      if (!it) return;
      const target = Math.max(0, Math.floor(Number(document.getElementById('tkModTarget').value || 0)));
      const tk = getActiveTicket();
      const ex = tk.items.find((x) => x.item_id === itemId);
      if (ex) ex.target = target; else tk.items.push({ item_id: it.id, name: it.name, target, strokes: [] });
      tk.activeItemId = itemId; vib(20); saveTallyState(); openTicketAddItemModal();
    }

    function removeTicketItem(itemId) {
      const tk = getActiveTicket();
      tk.items = tk.items.filter((x) => x.item_id !== itemId);
      if (tk.activeItemId === itemId) tk.activeItemId = tk.items[0]?.item_id || '';
      saveTallyState(); openTicketAddItemModal();
    }

    function selectTicketItem(itemId) { const tk = getActiveTicket(); tk.activeItemId = itemId; vib(15); saveTallyState(); renderTally(); }
    function setTallyTab(tab) { tallyTab = tab; vib(16); saveTallyState(); renderTally(); }
    function onAuditItemChange() { auditTally.itemId = document.getElementById('selAuditItem').value; auditTally.strokes = []; saveTallyState(); renderTally(); }

    function getActiveStrokeContext() {
      if (tallyTab === 'FREE') {
        return { strokes: freeTally.strokes, target: Number(freeTally.target || 0), hardStop: Boolean(freeTally.lockTarget), isAudit: false, enabled: true };
      }
      if (tallyTab === 'AUDIT') {
        const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
        return { strokes: auditTally.strokes, target: it ? Number(it.stock) : 0, hardStop: false, isAudit: true, enabled: Boolean(it) };
      }
      const tk = getActiveTicket(), item = getActiveTicketItem();
      if (!item) return { strokes: [], target: 0, hardStop: false, isAudit: false, enabled: false };
      return { strokes: item.strokes, target: Number(item.target || 0), hardStop: tk.dir === 'OUT', isAudit: false, enabled: true };
    }

    function sumStrokes(arr) { return (arr || []).reduce((s, x) => s + Number(x.qty || 0), 0); }

    async function ensureWakeLock() {
      if (!('wakeLock' in navigator) || wakeLock) return;
      try { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } catch {}
    }

    function addTallyStroke(customQty = null) {
      const ctx = getActiveStrokeContext();
      if (!ctx.enabled) { openTicketAddItemModal(); return; }

      const now = Date.now();
      if (customQty === null && now - lastTapMs < 130) return;
      lastTapMs = now; ensureWakeLock();

      const counted = sumStrokes(ctx.strokes);
      if (ctx.hardStop && ctx.target > 0 && counted >= ctx.target) {
        vib([90, 50, 120]); playTone(920, 0.16, 'square', 0.16); return;
      }

      let add = customQty !== null ? Math.floor(Number(customQty)) : Number(carryMult);
      if (!add || add <= 0) return;
      let isOdd = add !== carryMult;
      if (ctx.hardStop && ctx.target > 0 && counted + add > ctx.target) { add = ctx.target - counted; isOdd = add !== carryMult; }

      ctx.strokes.push({ qty: add, isOdd, ts: now });
      saveTallyState();

      const newTotal = counted + add;
      const rem = ctx.target > 0 ? Math.max(0, ctx.target - newTotal) : 999999;
      const remStrokes = Math.ceil(rem / Math.max(1, carryMult));

      const pad = document.getElementById('tallyPad');
      pad.classList.add('flash'); setTimeout(() => pad.classList.remove('flash'), 100);

      if (ctx.hardStop && ctx.target > 0 && newTotal >= ctx.target) {
        vib([90, 50, 90, 50, 140]); playTone(880, 0.15, 'square'); setTimeout(() => playTone(1175, 0.22, 'square'), 160);
      } else if (ctx.target > 0 && rem > 0 && remStrokes <= 3) {
        // የመጨረሻ 3 ጭረት ማስጠንቀቂያ ድምፅና ንዝረት
        vib([45, 30, 45]); playTone(780, 0.09, 'sawtooth', 0.14);
      } else if (ctx.strokes.length % 5 === 0) {
        vib([40, 25, 50]); playTone(720, 0.08, 'triangle');
      } else {
        vib(22); playTone(520, 0.05);
      }

      renderTicketItemsStrip(); renderTallyCanvas(true); renderTallyStats();
      const c = document.getElementById('tallyCanvas'); c.scrollTop = c.scrollHeight;
    }

    function undoTally() {
      const ctx = getActiveStrokeContext();
      if (!ctx.strokes.length) return;
      ctx.strokes.pop(); vib(18); saveTallyState();
      renderTicketItemsStrip(); renderTallyCanvas(false); renderTallyStats();
    }

    function clearTallyUndoable() {
      const ctx = getActiveStrokeContext();
      if (!ctx.strokes.length) return;
      undoTallyBuf = ctx.strokes.slice();
      ctx.strokes.length = 0; vib(28); saveTallyState();
      renderTicketItemsStrip(); renderTallyCanvas(false); renderTallyStats();
      showToast(t('clear'), () => {
        if (undoTallyBuf) {
          undoTallyBuf.forEach((x) => ctx.strokes.push(x));
          undoTallyBuf = null; saveTallyState();
          renderTicketItemsStrip(); renderTallyCanvas(false); renderTallyStats();
        }
      });
    }

    async function commitTally() {
      if (tallyTab === 'FREE') {
        const tot = sumStrokes(freeTally.strokes);
        if (tot <= 0) return;
        document.getElementById('inpQuickQty').value = String(tot);
        switchView('entry'); showToast(`${t('counted')}: ${tot}`); return;
      }

      if (tallyTab === 'AUDIT') {
        const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
        if (!it) return;
        const total = sumStrokes(auditTally.strokes);
        const res = await callRpc('rpc_submit_adjustment', {
          p_token: session.token, p_warehouse_id: currentWhId, p_item_id: it.id, p_counted_qty: total,
          p_reason: total > it.stock ? t('adjPlusReason') : t('adjMinusReason'),
          p_tally_proof: { mode: 'AUDIT', strokes: auditTally.strokes },
        });
        if (!res.success) { showToast(t('errGeneric')); return; }
        callBot({ action: 'notify_adjustment', warehouse_id: currentWhId, adjustment_id: res.adjustment_id }).catch(() => {});
        auditTally.strokes = []; saveTallyState();
        showToast(res.status === 'APPROVED' ? t('adjApproved') : t('adjPending'));
        loadWarehouseData(currentWhId); return;
      }

      const tk = getActiveTicket();
      const payloadItems = tk.items
        .map((x) => ({ item_id: x.item_id, qty: sumStrokes(x.strokes), tally_proof: { mode: tk.dir, strokes: x.strokes } }))
        .filter((x) => x.qty > 0);
      if (!payloadItems.length) { showToast(t('errNeedCount')); return; }

      const refFormatted = tk.dir === 'OUT' ? formatPadRef(tk.ref) : (tk.ref.trim() || '-');
      submitGenericDocument(tk.dir, tk.docNo.trim(), tk.party.trim(), refFormatted, payloadItems, () => {
        tickets = tickets.filter((x) => x.id !== tk.id);
        ensureDefaultTicket(); saveTallyState(); renderTally();
      });
    }

    function renderTicketBarOnly() {
      const bar = document.getElementById('ticketBar');
      bar.innerHTML = tickets.map((tk, i) => {
        const label = tk.docNo ? `#${tk.docNo}` : `${t('tkShort')} ${i + 1}`;
        const sub = tk.party ? ` · ${tk.party.slice(0, 8)}` : '';
        return `<button type="button" class="tk-tab ${tk.id === activeTicketId ? 'active' : ''}" onclick="selectTicket('${tk.id}')">🚛 ${esc(label + sub)}</button>`;
      }).join('') + `<button type="button" class="tk-tab add" onclick="addNewTicket()">+ ${esc(t('tkNew'))}</button>`;
    }

    function renderTicketItemsStrip() {
      if (tallyTab !== 'TICKET') return;
      const tk = getActiveTicket();
      document.getElementById('ticketItemsStrip').innerHTML = tk.items.map((x) => {
        const cnt = sumStrokes(x.strokes);
        const isDone = x.target > 0 && cnt >= x.target;
        const cls = x.item_id === tk.activeItemId ? 'active' : (isDone ? 'done' : '');
        const stat = x.target > 0 ? `${cnt}/${x.target}` : String(cnt);
        return `<button type="button" class="tk-pill ${cls}" onclick="selectTicketItem('${x.item_id}')">${isDone ? '✅ ' : ''}${esc(x.name)} <span style="font-family:ui-monospace,monospace;">${stat}</span></button>`;
      }).join('') + `<button type="button" class="tk-pill add" onclick="openTicketAddItemModal()">+ ${esc(t('tkAddItem'))}</button>`;
    }

    function renderTally() {
      document.getElementById('btnTTicket').className = 'seg-btn' + (tallyTab === 'TICKET' ? ' teal' : '');
      document.getElementById('btnTFree').className = 'seg-btn' + (tallyTab === 'FREE' ? ' in' : '');
      document.getElementById('btnTAudit').className = 'seg-btn' + (tallyTab === 'AUDIT' ? ' adj' : '');
      document.getElementById('tallyTicketArea').style.display = tallyTab === 'TICKET' ? 'block' : 'none';
      document.getElementById('tallyFreeArea').style.display = tallyTab === 'FREE' ? 'block' : 'none';
      document.getElementById('tallyAuditArea').style.display = tallyTab === 'AUDIT' ? 'block' : 'none';

      if (tallyTab === 'TICKET') {
        const tk = getActiveTicket();
        renderTicketBarOnly();
        const dirBtn = document.getElementById('btnTkDir');
        dirBtn.textContent = tk.dir === 'OUT' ? t('tkDirOut') : t('tkDirIn');
        dirBtn.style.color = tk.dir === 'OUT' ? '#fca5a5' : '#86efac';
        dirBtn.style.borderColor = tk.dir === 'OUT' ? 'var(--rose)' : 'var(--emerald)';
        if (document.activeElement !== document.getElementById('inpTkDoc')) document.getElementById('inpTkDoc').value = tk.docNo || '';
        if (document.activeElement !== document.getElementById('inpTkParty')) document.getElementById('inpTkParty').value = tk.party || '';
        if (document.activeElement !== document.getElementById('inpTkRef')) document.getElementById('inpTkRef').value = tk.ref || '';
        document.getElementById('inpTkDoc').placeholder = t('docPh');
        document.getElementById('inpTkParty').placeholder = tk.dir === 'OUT' ? t('partyOutPh') : t('partyInPh');
        document.getElementById('inpTkRef').placeholder = tk.dir === 'OUT' ? t('refOutPh') : t('platePh');
        renderTicketItemsStrip();
      } else if (tallyTab === 'FREE') {
        document.getElementById('inpFreeLabel').value = freeTally.label || '';
        document.getElementById('inpFreeLabel').placeholder = t('freeLabelPh');
        document.getElementById('inpFreeTarget').value = freeTally.target > 0 ? freeTally.target : '';
        document.getElementById('inpFreeTarget').placeholder = t('freeTargetPh');
        const lk = document.getElementById('btnFreeLock');
        lk.textContent = freeTally.lockTarget ? '🔒' : '🔓';
        lk.style.borderColor = freeTally.lockTarget ? 'var(--teal)' : 'var(--border-strong)';
      } else {
        const sel = document.getElementById('selAuditItem');
        sel.innerHTML = (whData.items || []).map((it) => `<option value="${it.id}" ${it.id === auditTally.itemId ? 'selected' : ''}>${esc(it.name)} (${it.stock})</option>`).join('');
        const it = (whData.items || []).find((x) => x.id === auditTally.itemId);
        document.getElementById('inpAuditSys').value = it ? it.stock : 0;
      }

      document.getElementById('lblCarryVal').textContent = `1 = ${carryMult}`;
      const isP = PRESETS.includes(carryMult);
      document.getElementById('presetGrid').innerHTML =
        PRESETS.map((n) => `<button type="button" class="preset-btn ${carryMult === n ? 'active' : ''}" onclick="carryMult=${n};vib(15);saveTallyState();renderTally();">+${n}</button>`).join('') +
        `<button type="button" class="preset-btn custom ${!isP ? 'active' : ''}" onclick="openNumModal('custom')">${!isP ? '+' + carryMult : esc(t('other'))}</button>`;

      document.getElementById('btnTCommit').textContent =
        tallyTab === 'TICKET' ? `✅ ${t('postDirect')}` : tallyTab === 'FREE' ? `📥 ${t('sendEntry')}` : `⚡ ${t('applyAdj')}`;

      renderTallyCanvas(false); renderTallyStats();
    }

    function renderTallyCanvas(animLast) {
      const c = document.getElementById('tallyCanvas'), ctx = getActiveStrokeContext();
      if (!ctx.enabled) {
        c.innerHTML = `<div style="margin:auto;text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:12px;">${esc(t('tkNoItems'))}</div>`;
        return;
      }
      const s = ctx.strokes;
      if (!s.length) {
        c.innerHTML = `<div style="margin:auto;opacity:0.14;pointer-events:none;"><div class="t-grp" style="transform:scale(1.5);"><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-slash"></div></div></div>`;
        return;
      }
      let h = '';
      for (let i = 0; i < s.length; i += 5) {
        const ch = s.slice(i, i + 5);
        h += '<div class="t-grp">';
        for (let b = 0; b < Math.min(4, ch.length); b++) h += `<div class="t-bar ${ch[b].isOdd ? 'odd' : ''} ${animLast && i + b === s.length - 1 ? 'anim-b' : ''}"></div>`;
        if (ch.length === 5) h += `<div class="t-slash ${animLast && i + 4 === s.length - 1 ? 'anim-s' : ''}"></div>`;
        h += '</div>';
      }
      c.innerHTML = h;
    }

    function renderTallyStats() {
      const ctx = getActiveStrokeContext();
      const cnt = sumStrokes(ctx.strokes), trg = ctx.target;
      document.getElementById('valTCounted').textContent = cnt.toLocaleString();
      document.getElementById('valTStrokes').textContent = ctx.strokes.length.toLocaleString();
      const rLbl = document.getElementById('lblTRight'), rVal = document.getElementById('valTRight');
      const box = document.getElementById('tallyAlert'), pad = document.getElementById('tallyPad');
      box.className = 'alert-box'; pad.classList.remove('done', 'near');

      if (ctx.isAudit) {
        const d = cnt - trg;
        rLbl.textContent = t('diff'); rVal.textContent = (d > 0 ? '+' : '') + d;
        if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); }
        else if (d < 0 && cnt > 0) { box.className = 'alert-box warn'; box.textContent = t('shortWarn')(Math.abs(d)); }
        else if (d === 0 && cnt > 0) { box.className = 'alert-box stop'; box.textContent = t('exactMatch'); pad.classList.add('done'); }
      } else {
        rLbl.textContent = t('remaining');
        if (trg <= 0) rVal.textContent = '∞';
        else {
          const rem = Math.max(0, trg - cnt);
          const remStrokes = Math.ceil(rem / Math.max(1, carryMult));
          if (ctx.hardStop) {
            rVal.textContent = rem.toLocaleString();
            if (cnt >= trg) { box.className = 'alert-box stop'; box.textContent = t('stopAlert'); pad.classList.add('done'); }
            else if (rem < carryMult) { box.className = 'alert-box warn'; box.textContent = t('oddWarn')(rem); pad.classList.add('near'); }
            else if (remStrokes <= 3) { box.className = 'alert-box warn'; box.textContent = t('nearAlert')(remStrokes, rem); pad.classList.add('near'); }
          } else {
            const d = cnt - trg;
            rVal.textContent = d >= 0 ? `+${d}` : rem.toLocaleString();
            if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); }
            else if (d === 0) { box.className = 'alert-box stop'; box.textContent = t('exactMatch'); pad.classList.add('done'); }
            else if (rem < carryMult) { box.className = 'alert-box warn'; box.textContent = t('oddWarn')(rem); pad.classList.add('near'); }
            else if (remStrokes <= 3) { box.className = 'alert-box warn'; box.textContent = t('nearAlert')(remStrokes, rem); pad.classList.add('near'); }
          }
        }
      }
    }

    function openNumModal(mode) {
      openMainModal(mode === 'custom' ? t('perCarry') : t('odd'),
        `<input type="number" id="inpNumMod" class="inp mono" style="height:46px;font-size:20px;" min="1" inputmode="numeric" value="${mode === 'custom' ? carryMult : ''}">`,
        `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('cancel'))}</button>
         <button type="button" class="btn teal" id="btnNumGo">${esc(t('ok'))}</button>`);
      const inp = document.getElementById('inpNumMod'); setTimeout(() => { inp.focus(); inp.select(); }, 40);
      document.getElementById('btnNumGo').onclick = () => {
        const v = Math.floor(Number(inp.value || 0));
        if (v <= 0) return;
        closeMainModal();
        if (mode === 'custom') { carryMult = v; saveTallyState(); renderTally(); } else addTallyStroke(v);
      };
    }

    // ==================== ገጽ 3: ዕለታዊ (እርማት፣ ቅያሬ፣ መጨመር፣ ማጥፋት፣ ቮይድ፣ አንቮይድ) ====================
    function getSortedDailyRows(rows, ascendingDoc = false) {
      if (dailySort === 'TIME' && !ascendingDoc) return rows;
      const groups = [], map = new Map();
      rows.forEach((r) => {
        const key = String(r.document_id || r.ledger_id);
        if (!map.has(key)) {
          const g = { docNum: docNumInt(r.doc_no), docStr: String(r.doc_no || ''), lines: [] };
          map.set(key, g); groups.push(g);
        }
        map.get(key).lines.push(r);
      });
      groups.sort((a, b) => {
        if (a.docNum !== b.docNum) return ascendingDoc ? (a.docNum - b.docNum) : (b.docNum - a.docNum);
        return ascendingDoc ? a.docStr.localeCompare(b.docStr) : b.docStr.localeCompare(a.docStr);
      });
      const out = []; groups.forEach((g) => g.lines.forEach((l) => out.push(l)));
      return out;
    }

    // ==================== ገጽ 4: ስቶክ እና ፒዲኤፍ ====================
    function getPeriodBounds(p) {
      const now = new Date(), end = new Date(); let start = new Date(0);
      if (p === 'WEEK') { const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1)); start = d; }
      else if (p === 'LAST_WEEK') { const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1)); end.setTime(d.getTime() - 1); start = new Date(d.getTime() - 7 * 86400000); }
      else if (p === 'MONTH') start = new Date(now.getFullYear(), now.getMonth(), 1);
      return { start: start.toISOString(), end: end.toISOString() };
    }

    function setStockPeriod(p) { stockPeriod = p; vib(16); loadStock(); }

    async function loadStock() {
      ['WEEK','LAST_WEEK','MONTH','ALL'].forEach((k) => {
        const id = { WEEK:'btnPWeek', LAST_WEEK:'btnPLastWeek', MONTH:'btnPMonth', ALL:'btnPAll' }[k];
        document.getElementById(id).className = 'seg-btn' + (stockPeriod === k ? ' teal' : '');
      });
      const b = getPeriodBounds(stockPeriod);
      const res = await callRpc('rpc_get_period_stock_report', { p_token: session.token, p_warehouse_id: currentWhId, p_start: b.start, p_end: b.end, p_active_only: false });
      if (res.success) { stockRows = res.rows || []; renderStock(); }
    }

      const byCat = {};
      stockRows.forEach((r) => {
        if (q && !r.item_name.toLowerCase().includes(q) && !r.category_name.toLowerCase().includes(q)) return;
        if (!byCat[r.category_name]) byCat[r.category_name] = [];
        byCat[r.category_name].push(r);
      });
      const html = [];
      Object.keys(byCat).forEach((cat) => {
        html.push(`<tr class="r-cat"><td colspan="6">📁 ${esc(cat)}</td></tr>`);
        byCat[cat].forEach((r) => {
          const isSel = pdfSelectType === 'stock' && Boolean(selectedPdfIds[r.item_id]);
          const adjTxt = r.adj_net_qty === 0 ? '0' : (r.adj_net_qty > 0 ? `+${r.adj_net_qty}` : String(r.adj_net_qty));
          html.push(`

              <td style="color:var(--primary);">${adjTxt}</td>
              <td><b>${Number(r.closing_qty).toLocaleString()}</b></td>
            </tr>`);
        });
      });
      document.getElementById('stockBody').innerHTML = html.length ? html.join('') : `<tr><td colspan="6" style="text-align:center;padding:16px;color:var(--muted);">${esc(t('noItems'))}</td></tr>`;

          </tr>`;

        bodyHtml = `<table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr style="background:#0f172a;color:#fff;">${cols.map((c) => `<th style="padding:7px;border:1px solid #334155;">${esc(c)}</th>`).join('')}</tr></thead>

          </tr></tfoot></table>`;
      } else {
        let rawList = onlyIds ? dailyRows.filter((r) => onlyIds.includes(String(r.ledger_id || r.document_id))) : dailyRows;

            <td style="padding:5px 4px;border:1px solid #cbd5e1;text-align:center;font-weight:900;">${isV ? '-' : Number(r.closing_bal || 0).toLocaleString()}</td>
            <td style="padding:5px 6px;border:1px solid #cbd5e1;font-weight:700;">${esc(same ? '↳' : r.party_name)}</td>
            <td style="padding:5px 4px;border:1px solid #cbd5e1;text-align:center;font-weight:700;">${esc(same ? '↳' : (r.ref_no || '-'))}</td>

          <thead><tr style="background:#0f172a;color:#fff;">${t('dPdfCols').map((c) => `<th style="padding:6px 4px;border:1px solid #334155;">${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>
            ${trs || `<tr><td colspan="9" style="text-align:center;padding:16px;color:#64748b;">${esc(t('noItems'))}</td></tr>`}
            <tr><td colspan="9" style="text-align:center;padding:6px;color:#94a3b8;font-size:10px;font-weight:700;">${esc(t('pdfEndList'))}</td></tr>
          </tbody>
          <tfoot><tr style="background:#0f172a;color:#38bdf8;font-weight:900;">
            <td colspan="3" style="padding:7px 8px;text-align:left;">${esc(t('pdfTotLabel'))}</td>
            <td style="padding:7px 4px;text-align:center;color:#86efac;">${inT.toLocaleString()}</td>
            <td style="padding:7px 4px;text-align:center;color:#fca5a5;">${outT.toLocaleString()}</td>
            <td colspan="3" style="padding:7px 6px;text-align:center;color:#e2e8f0;">${esc(t('pdfRowsCount')(list.length))}</td>
            <td style="padding:7px 4px;text-align:center;color:#38bdf8;">${dateStr}</td>
          </tr></tfoot></table>`;
      }

      stage.innerHTML = `<div style="background:#090e17;color:#38bdf8;padding:10px;text-align:center;font-size:14.5px;font-weight:900;margin-bottom:2px;">${esc(title)}</div>${bodyHtml}`;
      const canvas = await window.html2canvas(stage, { scale: 2, backgroundColor: '#ffffff' });
      const { jsPDF } = window.jspdf;
      const pw = 595, margin = 10, imgW = pw - margin * 2, imgH = (canvas.height * imgW) / canvas.width;
      const imgData = canvas.toDataURL('image/png');

      let pdf;
      if (imgH <= 1800) {
        pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [pw, Math.max(220, imgH + margin * 2)] });
        pdf.addImage(imgData, 'PNG', margin, margin, imgW, imgH);
      } else {
        const ph = 842; pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        let leftH = imgH, pos = margin; pdf.addImage(imgData, 'PNG', margin, pos, imgW, imgH); leftH -= (ph - margin * 2);
        while (leftH > 0) { pos = leftH - imgH + margin; pdf.addPage(); pdf.addImage(imgData, 'PNG', margin, pos, imgW, imgH); leftH -= (ph - margin * 2); }
      }

      const fileName = `${isStock ? 'Stock' : (todayOnly ? 'Daily_Today' : 'Daily_Full')}_${dateStr.replace(/\//g, '-')}.pdf`;
      if (!sendToBot) { pdf.save(fileName); return; }

      try {
        const blob = pdf.output('blob');
        const fd = new FormData();
        fd.append('token', session.token); fd.append('warehouse_id', currentWhId);
        fd.append('report_title', title); fd.append('file', blob, fileName);
        const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
          method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'x-session-token': session.token }, body: fd,
        }).then((r) => r.json());
        if (res.success) showToast(t('savedOk')); else { pdf.save(fileName); showToast(t('pdfLocal')); }
      } catch { pdf.save(fileName); showToast(t('pdfLocal')); }
    }

    function toggleBulkMap() {
      bulkMapMode = !bulkMapMode; bulkMapSlots = {}; vib(16);
      document.getElementById('btnBulkMap').style.background = bulkMapMode ? 'var(--primary)' : 'var(--surface-deep)';

    function renderMap() {
      const racks = whData.racks || [];
      document.getElementById('rackTabs').innerHTML = racks.map((r) =>
        `<button type="button" class="rack-tab ${activeRack === r.code ? 'active' : ''}" onclick="activeRack='${r.code}';vib(15);renderMap();">${esc(r.name)}</button>`
      ).join('');
      const rk = racks.find((r) => r.code === activeRack) || racks[0];
      const grid = document.getElementById('rackGrid');
      if (!rk) { grid.innerHTML = ''; return; }
      const q = document.getElementById('inpMapSearch').value.trim().toLowerCase();
      grid.style.gridTemplateColumns = `repeat(${rk.cols}, 1fr)`;
      const cells = [];
      for (let i = 1; i <= rk.cols * rk.rows; i++) {
        const sid = `${rk.code}-${i < 10 ? '0' + i : i}`;
        const list = whData.slot_map?.[sid] || [];
        const names = list.map((x) => x.item_name);
        const hl = q && names.some((n) => n.toLowerCase().includes(q));
        const cls = bulkMapSlots[sid] ? 'sel' : (hl ? 'hl' : (names.length ? 'used' : ''));
        cells.push(`<div class="bin ${cls}" onclick="onBinClick('${sid}')"><span class="bin-id">${sid}</span><span class="bin-it">${names.length ? esc(names.join('፣ ')) : esc(t('emptySlot'))}</span></div>`);
      }
      grid.innerHTML = cells.join('');
    }

    function onBinClick(sid) {
      vib(18);
      if (bulkMapMode) {
        if (bulkMapSlots[sid]) delete bulkMapSlots[sid]; else bulkMapSlots[sid] = true;
        const n = Object.keys(bulkMapSlots).length;
        const btn = document.getElementById('btnBulkAssign');
        btn.style.display = n ? 'inline-flex' : 'none'; btn.textContent = `${t('assignBtn')} (${n})`;
        renderMap(); return;
      }
      openBinModal(sid);
    }

            qrLoopId = requestAnimationFrame(scan);
          };
          qrLoopId = requestAnimationFrame(scan);
        }
      } catch {}
    }

          <input id="chCred1" class="inp" placeholder="${esc(t('phChCred1'))}">
          <input id="chCred2" class="inp" style="display:none;" placeholder="${esc(t('phChCred2'))}">
          <button type="button" class="btn teal" onclick="saveNotifChannel()">+ ${esc(t('save'))}</button>
        </div>${cards}`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);

    function onChTypeChange() { const tp = document.getElementById('chType').value; document.getElementById('chCred2').style.display = (tp === 'WHATSAPP' || tp === 'SMS') ? 'block' : 'none'; }
    async function saveNotifChannel() {
      const tp = document.getElementById('chType').value, c1 = document.getElementById('chCred1').value.trim(), c2 = document.getElementById('chCred2').value.trim();
      const creds = tp === 'TELEGRAM' ? { bot_token: c1 } : tp === 'WHATSAPP' ? { access_token: c1, phone_number_id: c2 } : tp === 'SMS' ? { api_key: c1, sender_id: c2 } : { api_key: c1 };
      const res = await callRpc('rpc_manage_notification_channels', { p_token: session.token, p_action: 'UPSERT', p_payload: { organization_id: whData.warehouse.organization_id, warehouse_id: document.getElementById('chWh').value || null, channel_type: tp, label: document.getElementById('chLabel').value.trim() || chTypeLabel(tp), target_address: document.getElementById('chTarget').value.trim(), credentials: creds } });
      if (res.success) { if (tp === 'TELEGRAM' && res.channel_id) await linkTelegramWebhook(res.channel_id, true); showToast(t('savedOk')); openChannelsManager(); } else showToast(t('errGeneric'));
    }
    async function linkTelegramWebhook(channelId, silent = false) { const res = await callBot({ action: 'register_telegram_webhook', channel_id: channelId }); if (!silent) showToast(res.success ? t('savedOk') : t('errGeneric')); }
    async function testNotifChannel(channelId) { const res = await callBot({ action: 'test_channel', channel_id: channelId }); showToast(res.success ? t('savedOk') : t('errGeneric')); }
    async function deleteNotifChannel(channelId) { await callRpc('rpc_manage_notification_channels', { p_token: session.token, p_action: 'DELETE', p_payload: { organization_id: whData.warehouse.organization_id, channel_id: channelId } }); openChannelsManager(); }

    // ዕቃዎች + በጅምላ መገልበጫ
    function openCatalogManager() {
      const cats = whData.categories || [];
      openMainModal(t('mCatalog'), `
        <div class="sub-card">
          <div style="display:flex;gap:5px;"><input id="catNewName" class="inp" placeholder="${esc(t('phCatName'))}"><button type="button" class="btn primary" onclick="addCategoryNow()">+</button></div>
        </div>
        <div class="sub-card">
          <input id="itNewName" class="inp" placeholder="${esc(t('phItemName'))}">
          <select id="itNewCat" class="sel"><option value="">-</option>${cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          <input id="itNewOp" type="number" class="inp mono" value="0" min="0" placeholder="${esc(t('phOpening'))}">
          <button type="button" class="btn teal" onclick="addItemNow()">+ ${esc(t('add'))}</button>
        </div>
        <div class="sub-card">
          <b style="font-size:11.5px;color:var(--amber);">📥 ${esc(t('bulkTitle'))}</b>
          <span class="lbl-sm">${esc(t('bulkHint'))}</span>
          <textarea id="bulkItemsTxt" class="txtarea" placeholder="Angle, 30x2 Angle, 28&#10;Flat, 15x2.5 Flat, 591"></textarea>
          <button type="button" class="btn primary" onclick="runBulkImport()">${esc(t('bulkBtn'))}</button>
        </div>`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    async function addCategoryNow() {
      const n = document.getElementById('catNewName').value.trim(); if (!n) return;
      await callRpc('rpc_manage_catalog', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'ADD_CATEGORY', p_payload: { name: n } });
      await loadWarehouseData(currentWhId); openCatalogManager();
    }

    async function addItemNow() {
      const n = document.getElementById('itNewName').value.trim(); if (!n) return;
      const res = await callRpc('rpc_manage_catalog', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'UPSERT_ITEM', p_payload: { name: n, category_id: document.getElementById('itNewCat').value, opening_qty: Number(document.getElementById('itNewOp').value || 0) } });
      if (res.success) { showToast(t('savedOk')); await loadWarehouseData(currentWhId); openCatalogManager(); }
    }

    async function runBulkImport() {
      const raw = document.getElementById('bulkItemsTxt').value.trim();
      if (!raw) return;
      const rows = raw.split(/\r?\n/).map((line) => {
        const parts = line.includes('\t') ? line.split('\t') : line.split(',');
        if (parts.length >= 3) return { category: parts[0].trim(), name: parts[1].trim(), opening_qty: parseInt(parts[2].replace(/[^\d]/g, ''), 10) || 0 };
        if (parts.length === 2) return { category: '', name: parts[0].trim(), opening_qty: parseInt(parts[1].replace(/[^\d]/g, ''), 10) || 0 };
        return { category: '', name: parts[0].trim(), opening_qty: 0 };
      }).filter((r) => r.name);
      if (!rows.length) return;
      const res = await callRpc('rpc_manage_catalog', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'BULK_IMPORT', p_payload: { rows } });
      if (res.success) {
        showToast(t('bulkDone')(res.imported_count || 0));
        await loadWarehouseData(currentWhId); closeMainModal();
      } else showToast(t('errGeneric'));
    }

    // መደርደሪያዎች (ወደ ጎን + ወደ ላይ + ማስተካከያ + ማጥፊያ)
    function openRacksManager() {
      const rks = whData.racks || [];
      openMainModal(t('mRacks'), `
        <div class="sub-card">
          <div class="grid-2">
            <input id="rkCode" class="inp mono" placeholder="${esc(t('phRackCode'))}" style="text-transform:uppercase;">
            <input id="rkName" class="inp" placeholder="${esc(t('phRackName'))}">
          </div>
          <div class="grid-2">
            <input id="rkCols" type="number" class="inp mono" value="6" min="1" placeholder="${esc(t('phRackCols'))}">
            <input id="rkRows" type="number" class="inp mono" value="5" min="1" placeholder="${esc(t('phRackRows'))}">
          </div>
          <button type="button" class="btn teal" onclick="saveRackNow()">+ ${esc(t('save'))}</button>
        </div>
        ${rks.map((r, i) => `
          <div class="sub-card" style="flex-direction:row;align-items:center;justify-content:space-between;">
            <b>${esc(r.code)} — ${esc(r.name)} (${r.cols}×${r.rows})</b>
            <div style="display:flex;gap:4px;">
              <button type="button" class="icon-btn" style="width:28px;height:28px;" onclick="fillRackEdit(${i})">✏️</button>
              <button type="button" class="icon-btn" style="width:28px;height:28px;color:var(--rose);" onclick="deleteRackAt(${i})">🗑️</button>
            </div>
          </div>`).join('')}`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    function fillRackEdit(idx) {
      const r = (whData.racks || [])[idx]; if (!r) return;
      document.getElementById('rkCode').value = r.code;
      document.getElementById('rkName').value = r.name;
      document.getElementById('rkCols').value = r.cols;
      document.getElementById('rkRows').value = r.rows;
    }

    async function saveRackNow() {
      const code = document.getElementById('rkCode').value.trim().toUpperCase();
      const name = document.getElementById('rkName').value.trim() || code;
      const cols = Math.max(1, Number(document.getElementById('rkCols').value || 6));
      const rows = Math.max(1, Number(document.getElementById('rkRows').value || 5));
      if (!code) return;
      const list = (whData.racks || []).slice();
      const ex = list.findIndex((r) => r.code === code);
      if (ex >= 0) list[ex] = { code, name, cols, rows }; else list.push({ code, name, cols, rows });
      await callRpc('rpc_manage_racks', { p_token: session.token, p_warehouse_id: currentWhId, p_racks: list });
      await loadWarehouseData(currentWhId); openRacksManager();
    }

    async function deleteRackAt(idx) {
      const list = (whData.racks || []).filter((_, i) => i !== idx);
      await callRpc('rpc_manage_racks', { p_token: session.token, p_warehouse_id: currentWhId, p_racks: list });
      await loadWarehouseData(currentWhId); openRacksManager();
    }

    async function openApprovalsManager() {
      const res = await callRpc('rpc_get_pending_adjustments', { p_token: session.token, p_warehouse_id: currentWhId });
      const rows = res.rows || [];
      openMainModal(t('mApprovals'),
        rows.length ? rows.map((a) => `
          <div class="sub-card">
            <b>${esc(a.item_name)} (${a.system_bal} ➔ ${a.counted_qty} | ${a.diff_qty > 0 ? '+' : ''}${a.diff_qty})</b>

            <div class="grid-2"><button type="button" class="btn teal" onclick="reviewAdj('${a.id}',true)">${esc(t('approve'))}</button><button type="button" class="btn danger" onclick="reviewAdj('${a.id}',false)">${esc(t('reject'))}</button></div>
          </div>`).join('') : `<div class="sub-card" style="text-align:center;">${esc(t('noItems'))}</div>`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    async function reviewAdj(id, approve) { const res = await callRpc('rpc_review_adjustment', { p_token: session.token, p_adjustment_id: id, p_approve: approve }); if (res.success) { showToast(t('savedOk')); await loadWarehouseData(currentWhId); openApprovalsManager(); } }
    async function sendRiskAuditNow() { const res = await callBot({ action: 'send_risk_audit', warehouse_id: currentWhId }); showToast(res.success ? t('savedOk') : t('errGeneric')); }

    function openOwnPinModal() {
      openMainModal(t('mPin'), `<input id="pOld" type="password" class="inp mono" maxlength="6" inputmode="numeric" placeholder="${esc(t('phOldPin'))}"><input id="pNew" type="password" class="inp mono" maxlength="6" inputmode="numeric" placeholder="${esc(t('phNewPin'))}">`,

      Object.values(map).forEach((id) => document.getElementById(id).classList.remove('active'));
      Object.values(nav).forEach((id) => document.getElementById(id).classList.remove('active'));
      document.getElementById(map[name]).classList.add('active');
      document.getElementById(nav[name]).classList.add('active');
      selectedPdfIds = {}; updatePdfBar();
      document.getElementById('submitDock').style.display = (name === 'entry' && basket.length) ? 'flex' : 'none';
      if (name === 'tally') { ensureWakeLock(); renderTally(); }
      if (name === 'daily') loadDaily();
      if (name === 'stock') loadStock();
      if (name === 'map') renderMap();
    }

    (function setupTallyGestures() {
      const pad = document.getElementById('tallyPad');
      let sx = 0, sy = 0, st = 0;
      pad.addEventListener('pointerdown', (e) => { if (!e.isPrimary || e.target.closest('.t-stats')) return; sx = e.clientX; sy = e.clientY; st = Date.now(); });
      pad.addEventListener('pointerup', (e) => {
        if (!e.isPrimary || e.target.closest('.t-stats')) return;
        const dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - st;
        if ((Math.hypot(dx, dy) < 14 && dt < 450) || (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 0.9 && dt < 500)) addTallyStroke();
      });
    })();

    (function boot() {
      const urlOrg = new URLSearchParams(location.search).get('org');
      if (urlOrg) document.getElementById('inpOrgCode').value = urlOrg.toUpperCase();
      renderStaticLabels();
      if (session?.token) enterApp();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
