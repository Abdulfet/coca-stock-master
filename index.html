<!DOCTYPE html>
<html lang="am" id="docRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>መጋዘን</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#060a12">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #060a12; --surface: #0f172a; --surface-deep: #090f1d;
      --border: #1e293b; --border-strong: #334155;
      --text: #f8fafc; --muted: #94a3b8;
      --primary: #0ea5e9; --teal: #14b8a6; --teal-dark: #042f2e;
      --emerald: #10b981; --amber: #f59e0b; --rose: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: auto; }
    html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }

    /* መግቢያ */
    .gate { position: fixed; inset: 0; z-index: 900; background: radial-gradient(circle at top, #172554 0%, #060a12 72%); display: flex; align-items: center; justify-content: center; padding: 14px; }
    .gate-card { width: 100%; max-width: 350px; background: rgba(15, 23, 42, 0.94); border: 1px solid var(--border-strong); border-radius: 22px; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 48px rgba(0,0,0,0.75); }
    .gate-mark { width: 58px; height: 58px; margin: 0 auto; border-radius: 16px; border: 2px solid var(--teal); background: var(--surface-deep); color: var(--teal); font-size: 20px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .gate-title { text-align: center; font-size: 16px; font-weight: 900; }
    .gate-pin { height: 48px; text-align: center; font-size: 24px; letter-spacing: 8px; -webkit-text-security: disc; }

    /* ዋና ቅርፊት */
    .shell { max-width: 640px; height: 100vh; height: 100dvh; margin: 0 auto; display: none; flex-direction: column; padding: 6px 6px 0; position: relative; overflow: hidden; }
    .topbar { height: 42px; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 0 7px; margin-bottom: 6px; flex-shrink: 0; }
    .icon-btn { width: 32px; height: 30px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--primary); font-size: 14px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .brand-box { display: flex; flex-direction: column; min-width: 0; flex-shrink: 1; }
    .brand-name { font-size: 11.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-sub { font-size: 8.5px; font-weight: 800; color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wh-sel { margin-left: auto; max-width: 142px; height: 30px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--primary); background: var(--surface-deep); color: var(--primary); font-size: 11px; font-weight: 900; outline: none; }
    .sync-pill { display: none; height: 26px; padding: 0 7px; border-radius: 13px; border: 1px solid var(--amber); background: rgba(245,158,11,0.18); color: #fde68a; font-size: 10px; font-weight: 900; cursor: pointer; flex-shrink: 0; }

    /* ጎን ሜኑ */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.76); backdrop-filter: blur(4px); z-index: 600; display: none; }
    .drawer { position: fixed; top: 0; left: -295px; width: 285px; height: 100%; background: #070b14; border-right: 1px solid var(--border-strong); z-index: 601; transition: left 0.22s ease; display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; }
    .drawer.open { left: 0; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .drawer-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .drawer-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 10px; border-radius: 10px; background: transparent; border: none; color: var(--text); font-size: 12.5px; font-weight: 800; text-align: left; cursor: pointer; width: 100%; }
    .drawer-item:active { background: var(--surface); color: var(--teal); }
    .badge-cnt { background: var(--rose); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 6px; border-radius: 10px; }

    /* የጋራ ክፍሎች */
    .view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }
    .seg { display: flex; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .seg-btn { flex: 1; height: 34px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 11.5px; font-weight: 900; cursor: pointer; }
    .seg-btn.out { background: #3b0a0a; border-color: var(--rose); color: #fca5a5; }
    .seg-btn.in { background: #052e16; border-color: var(--emerald); color: #86efac; }
    .seg-btn.adj { background: #172554; border-color: var(--primary); color: #7dd3fc; }
    .seg-btn.teal { background: var(--teal-dark); border-color: var(--teal); color: #99f6e4; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 11px; padding: 6px; margin-bottom: 6px; flex-shrink: 0; }
    .inp, .sel { width: 100%; height: 35px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 12px; font-weight: 800; outline: none; }
    .inp:focus, .sel:focus { border-color: var(--teal); }
    .inp.mono { font-family: ui-monospace, monospace; text-align: center; color: var(--primary); }
    .grid-3 { display: grid; grid-template-columns: 1.2fr 1.05fr 0.85fr; gap: 5px; }
    .grid-2 { display: grid; grid-template-columns: 1.45fr 1fr; gap: 5px; }
    .doc-combo { display: flex; border: 1.5px solid var(--primary); border-radius: 8px; overflow: hidden; height: 35px; background: var(--surface-deep); }
    .doc-combo input { border: none; border-radius: 0; flex: 1; min-width: 0; text-align: center; color: var(--primary); font-family: ui-monospace, monospace; }
    .btn-void-mini { border: none; border-left: 1px solid #7f1d1d; background: #450a0a; color: #fca5a5; padding: 0 7px; font-size: 9.5px; font-weight: 900; cursor: pointer; display: inline-flex; align-items: center; }

    /* ገጽ 1: መመዝገቢያ */
    .quick-row { display: grid; grid-template-columns: 1fr 68px 40px; gap: 5px; margin-bottom: 6px; flex-shrink: 0; }
    .btn-ok-sq { height: 35px; border: none; border-radius: 8px; background: var(--emerald); color: #052e16; font-size: 17px; font-weight: 900; cursor: pointer; }
    .tiles { flex: 1 1 auto; min-height: 90px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(2, 1fr); align-content: start; gap: 5px; padding-bottom: 70px; }
    .tiles.has-basket { padding-bottom: 8px; }
    .tile { background: var(--surface-deep); border: 1px solid var(--border-strong); border-radius: 10px; padding: 7px 8px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
    .tile.picked { border-color: var(--emerald); background: rgba(6, 78, 59, 0.34); }
    .tile-top { display: flex; justify-content: space-between; gap: 4px; align-items: center; }
    .tile-name { font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile-bal { font-size: 11.5px; font-weight: 900; color: var(--emerald); font-family: ui-monospace, monospace; }
    .tile-bal.zero { color: var(--amber); }
    .tile-bot { display: flex; justify-content: space-between; align-items: center; font-size: 9.5px; color: var(--muted); font-weight: 800; }
    .tile-cnt-btn { padding: 2px 6px; border-radius: 6px; border: 1px solid var(--teal); background: rgba(20,184,166,0.14); color: var(--teal); font-size: 9.5px; font-weight: 900; cursor: pointer; }

    /* ቅርጫት + 60fps ጎትቶ ማደራደሪያ */
    .basket-wrap { display: none; flex: 0 0 auto; max-height: 32vh; flex-direction: column; margin-top: auto; margin-bottom: 110px; padding-top: 4px; }
    .basket-list { overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 5px; }
    .b-row { height: 42px; background: rgba(15, 23, 42, 0.86); border: 1.5px solid rgba(56, 189, 248, 0.38); border-radius: 21px; padding: 4px 8px 4px 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; backdrop-filter: blur(6px); }
    .b-row.dragging { border-color: var(--teal); background: rgba(20, 184, 166, 0.28); transform: scale(1.02); }
    .b-drag { min-width: 28px; height: 28px; border-radius: 14px; background: var(--primary); color: #fff; font-size: 11.5px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: none; cursor: grab; }
    .b-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .b-qty { width: 60px; height: 29px; border-radius: 14px; border: 1.5px solid var(--primary); background: var(--bg); color: #fff; text-align: center; font-size: 12.5px; font-weight: 900; }
    .b-del { width: 26px; height: 26px; border-radius: 50%; border: none; background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 900; cursor: pointer; }

    .dock { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 44px; background: rgba(15, 23, 42, 0.9); border: 1.5px solid rgba(56, 189, 248, 0.45); border-radius: 22px; padding: 4px 6px 4px 14px; display: none; align-items: center; justify-content: space-between; z-index: 40; backdrop-filter: blur(8px); }
    .dock-btn { height: 34px; padding: 0 15px; border: none; border-radius: 17px; font-size: 12px; font-weight: 900; cursor: pointer; }
    .dock-btn.out { background: var(--rose); color: #fff; }
    .dock-btn.in { background: var(--emerald); color: #052e16; }

    /* ገጽ 2: ቆጠራ */
    .preset-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .preset-btn { height: 33px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-family: ui-monospace, monospace; font-size: 11.5px; font-weight: 900; cursor: pointer; }
    .preset-btn.active { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); }
    .preset-btn.custom { font-family: inherit; font-size: 10px; color: var(--amber); }
    .alert-box { display: none; padding: 7px 10px; border-radius: 10px; text-align: center; font-size: 11.5px; font-weight: 900; margin-bottom: 5px; flex-shrink: 0; }
    .alert-box.warn { display: block; background: rgba(245,158,11,0.16); border: 1.5px solid var(--amber); color: #fde68a; }
    .alert-box.stop { display: block; background: var(--emerald); color: #022c22; }
    .alert-box.over { display: block; background: rgba(14,165,233,0.18); border: 1.5px solid var(--primary); color: #7dd3fc; }
    .tally-pad { flex: 1; min-height: 0; background: var(--surface-deep); border: 2px dashed rgba(20,184,166,0.45); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; cursor: pointer; touch-action: pan-y; margin-bottom: 6px; }
    .tally-pad.flash { border-color: var(--emerald); background: rgba(16,185,129,0.08); }
    .tally-pad.done { border-style: solid; border-color: var(--emerald); }
    .tally-canvas { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px 10px; }
    .t-grp { position: relative; width: 42px; height: 40px; display: inline-flex; align-items: center; justify-content: center; }
    .t-bar { width: 3.5px; height: 30px; background: var(--emerald); margin: 0 2.5px; border-radius: 2px; }
    .t-bar.odd { background: var(--amber); }
    .t-slash { position: absolute; width: 44px; height: 4px; background: var(--amber); border-radius: 2px; transform: rotate(-28deg); }
    .anim-b { animation: pBar 0.12s ease-out; }
    .anim-s { animation: pSlash 0.14s ease-out; }
    @keyframes pBar { from { transform: scaleY(0.3); opacity: 0.3; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes pSlash { from { transform: rotate(-28deg) scaleX(0.2); opacity: 0.3; } to { transform: rotate(-28deg) scaleX(1); opacity: 1; } }
    .t-stats { display: grid; grid-template-columns: 1fr 0.8fr 1fr; background: rgba(15,23,42,0.95); border-top: 1px solid var(--border); padding: 7px 12px; flex-shrink: 0; }
    .t-stat { display: flex; flex-direction: column; }
    .t-stat.c { align-items: center; }
    .t-stat.r { align-items: flex-end; }
    .t-lbl { font-size: 9.5px; font-weight: 800; color: var(--muted); }
    .t-num { font-family: ui-monospace, monospace; font-size: 22px; font-weight: 900; line-height: 1.1; }
    .t-actions { display: grid; grid-template-columns: 0.8fr 0.8fr 0.8fr 1.6fr; gap: 5px; margin-bottom: 62px; flex-shrink: 0; }
    .t-btn { height: 42px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 11px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .t-btn.commit { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); font-size: 11.5px; }

    /* ሠንጠረዦች */
    .metrics { display: flex; justify-content: space-around; background: var(--surface-deep); border: 1px solid var(--border); border-radius: 7px; padding: 4px; margin-top: 5px; font-size: 10.5px; font-weight: 900; }
    .tbl-wrap { flex: 1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; margin-bottom: 62px; }
    table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; }
    table.tbl th { position: sticky; top: 0; z-index: 5; background: var(--surface-deep); color: var(--primary); padding: 7px 4px; border-bottom: 1.5px solid var(--border-strong); border-right: 1px solid var(--border); font-size: 10px; font-weight: 900; white-space: nowrap; }
    table.tbl td { padding: 6px 4px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-weight: 800; white-space: nowrap; }
    tr.r-in { background: rgba(16,185,129,0.14); color: #a7f3d0; }
    tr.r-void { background: rgba(239,68,68,0.18); color: #fca5a5; }
    tr.r-adj { background: rgba(14,165,233,0.16); color: #bae6fd; }
    tr.r-zero { background: rgba(245,158,11,0.22); color: #fde68a; }
    tr.r-cat { background: #143323; color: #6ee7b7; }
    tr.r-sel { background: rgba(14,165,233,0.34) !important; color: #7dd3fc !important; }
    tr.r-sel td:first-child { border-left: 3px solid var(--emerald); }
    tr.r-sp td { height: 7px; padding: 0; background: var(--bg); border-left: none; border-right: none; }

    /* ተንሳፋፊ የፒዲኤፍ አሞሌ */
    .pdf-bar { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 42px; background: rgba(6,78,59,0.9); border: 1.5px solid var(--emerald); border-radius: 21px; padding: 4px 8px; display: none; align-items: center; justify-content: space-between; gap: 6px; z-index: 45; backdrop-filter: blur(8px); }
    .pdf-pill { height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.22); background: rgba(15,23,42,0.82); color: #fff; font-size: 11px; font-weight: 900; cursor: pointer; }
    .pdf-send { height: 32px; padding: 0 12px; border-radius: 16px; border: none; background: var(--emerald); color: #052e16; font-size: 11px; font-weight: 900; cursor: pointer; }

    /* ካርታ */
    .rack-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 6px; flex-shrink: 0; }
    .rack-tab { min-width: 72px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--muted); font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
    .rack-tab.active { background: var(--primary); color: #fff; border-color: #7dd3fc; }
    .rack-wrap { flex: 1; overflow: auto; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px; margin-bottom: 62px; }
    .rack-grid { display: grid; gap: 5px; min-width: 280px; }
    .bin { min-height: 54px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); padding: 4px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; cursor: pointer; }
    .bin.used { background: #064e3b; border-color: var(--emerald); }
    .bin.hl { border: 2px dashed var(--amber); background: #451a03; }
    .bin.sel { border: 2px solid var(--primary); background: #0369a1; }
    .bin-id { font-size: 9.5px; font-weight: 900; color: var(--primary); }
    .bin-it { font-size: 8.5px; font-weight: 800; word-break: break-word; }

    /* የታችኛው አውራ ጣት ዳሰሳ */
    .bottom-nav { position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%); width: calc(100% - 14px); max-width: 626px; height: 50px; background: rgba(15,23,42,0.78); border: 1px solid rgba(255,255,255,0.22); border-radius: 25px; display: flex; align-items: center; padding: 3px 4px; z-index: 50; backdrop-filter: blur(8px); }
    .nav-item { flex: 1; height: 42px; border-radius: 21px; border: none; background: transparent; color: var(--muted); font-size: 10px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .nav-item .ico { font-size: 15px; line-height: 1; }
    .nav-item.active { background: rgba(14,165,233,0.45); color: #fff; border: 1px solid rgba(56,189,248,0.7); }

    /* ሞዳል እና ማሳወቂያ */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; padding: 10px; z-index: 800; }
    .modal-bg.open { display: flex; }
    .modal-card { width: 100%; max-width: 440px; max-height: 88vh; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 9px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 900; color: var(--teal); }
    .modal-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .modal-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; padding-top: 6px; border-top: 1px solid var(--border); }
    .btn { height: 40px; border-radius: 10px; border: none; font-size: 12px; font-weight: 900; cursor: pointer; padding: 0 12px; color: #fff; }
    .btn.teal { background: var(--teal); color: var(--teal-dark); }
    .btn.primary { background: var(--primary); }
    .btn.danger { background: var(--rose); }
    .btn.muted { background: #1e293b; color: var(--text); }
    .sub-card { background: var(--surface-deep); border: 1px solid var(--border); border-radius: 10px; padding: 9px; display: flex; flex-direction: column; gap: 6px; }
    .lbl-sm { font-size: 10px; font-weight: 900; color: var(--muted); }
    .chk-row { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; }
    .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: #042f2e; border: 1px solid var(--teal); color: #99f6e4; padding: 9px 14px; border-radius: 12px; font-size: 12px; font-weight: 900; z-index: 999; display: flex; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.7); max-width: 92vw; }
    .toast-btn { background: var(--amber); color: #000; border: none; border-radius: 7px; padding: 4px 8px; font-size: 11px; font-weight: 900; cursor: pointer; }
    video.qr-video { width: 100%; border-radius: 12px; background: #000; max-height: 260px; object-fit: cover; }

    #pdfStage { position: fixed; left: -9999px; top: 0; width: 794px; background: #fff; color: #000; font-family: system-ui, Arial, sans-serif; padding: 14px; }
    @media (min-width: 640px) { .modal-bg { align-items: center; } }
  </style>
</head>
<body>

  <!-- መግቢያ -->
  <div id="loginGate" class="gate">
    <div class="gate-card">
      <div class="gate-mark" id="gateMark">መ</div>
      <div class="gate-title" id="lblGateTitle"></div>
      <input type="text" id="inpOrgCode" class="inp mono" style="height:42px;text-transform:uppercase;" autocomplete="organization">
      <input type="password" id="inpLoginPin" class="inp gate-pin" maxlength="6" inputmode="numeric" placeholder="••••••" onkeydown="if(event.key==='Enter') doLogin()">
      <button type="button" class="btn teal" id="btnLoginSubmit" onclick="doLogin()"></button>
      <div id="loginErr" style="color:var(--rose);font-size:11.5px;font-weight:900;text-align:center;"></div>
      <button type="button" class="btn muted" style="height:34px;font-size:11px;" id="btnGateLang" onclick="toggleLang()"></button>
    </div>
  </div>

  <!-- ጎን ሜኑ -->

    function playTone(f, d, type = 'sine', vol = 0.12) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = f;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch {}
    }

    function showToast(msg, undoCb = null) {

      if (undoCb) {
        const b = document.createElement('button');
        b.className = 'toast-btn'; b.textContent = t('undo');
        b.onclick = () => { el.remove(); undoCb(); };
        el.appendChild(b);
      }
      document.body.appendChild(el);
      setTimeout(() => el.remove(), undoCb ? 4500 : 2500);
    }

    // ==================== API እና Offline Sync ====================
    async function callRpc(fnName, params = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
        },
        body: JSON.stringify(params),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || data.error || 'RPC_ERROR');
      return data;
    }

    async function callBot(payload) {
      const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          'x-session-token': session?.token || '',
        },
        body: JSON.stringify({ ...payload, token: session?.token || '', function_name: BOT_FUNCTION }),
      });
      return await res.json();
    }

    function getOfflineQueue() { return loadJson(QUEUE_KEY, []); }
    function updateSyncPill() {
      const q = getOfflineQueue();
      const pill = document.getElementById('syncPill');
      if (q.length > 0) {
        pill.style.display = 'inline-flex';
        pill.style.alignItems = 'center';
        pill.textContent = t('syncNow')(q.length);
      } else {
        pill.style.display = 'none';
      }
    }

    async function syncOfflineQueue() {
      const q = getOfflineQueue();
      if (!q.length || !navigator.onLine || !session?.token) return;
      const remaining = [];
      let synced = 0;
      for (const job of q) {
        try {
          const r = await callRpc('rpc_post_document', { ...job.params, p_token: session.token });
          if (r.success) {
            synced++;
            if (job.params.p_doc_type === 'IN' && r.document_id) {
              callBot({ action: 'send_grn', warehouse_id: job.params.p_warehouse_id, document_id: r.document_id }).catch(() => {});
            }
          } else { remaining.push(job); }
        } catch { remaining.push(job); }
      }
      saveJson(QUEUE_KEY, remaining);
      updateSyncPill();
      if (synced > 0) { showToast(t('syncedOk')); loadWarehouseData(currentWhId); }
    }
    window.addEventListener('online', syncOfflineQueue);

        const res = await callRpc('rpc_login', { p_org_code: orgCode, p_pin: pin });
        if (!res.success) { errEl.textContent = t('errPin'); return; }
        session = res;
        saveJson(SESSION_KEY, session);
        errEl.textContent = '';

      if (!whId || !session?.token) return;
      currentWhId = whId;
      try {
        const res = await callRpc('rpc_get_initial_data', { p_token: session.token, p_warehouse_id: whId });
        if (!res.success) return;
        whData = res;
        if (res.org_warehouses && res.org_warehouses.length) {
          populateWarehouseSelector(res.org_warehouses.filter((w) => w.is_active !== false));
        }
        const w = res.warehouse || {};

        document.getElementById('drawerBrand').textContent = w.brand_title || t('defaultBrand');

        });

    function startBasketDrag(rowEl, e) {
      if (basket.length <= 1) return;
      e.preventDefault();
      const list = document.getElementById('basketList');
      dragEl = rowEl;
      dragIdx = Array.from(list.children).indexOf(rowEl);
      rowEl.classList.add('dragging');
      vib(30);

      const onMove = (ev) => {
        if (!dragEl) return;
        const rows = Array.from(list.children);
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i].getBoundingClientRect();
          if (ev.clientY >= r.top && ev.clientY <= r.bottom && i !== dragIdx) {
            const moved = basket.splice(dragIdx, 1)[0];
            basket.splice(i, 0, moved);
            list.insertBefore(dragEl, i < dragIdx ? rows[i] : rows[i].nextSibling);
            dragIdx = i;
            vib(14);
            Array.from(list.children).forEach((el, k) => el.querySelector('.b-drag').textContent = k + 1);
            break;
          }
        }
      };
      const onUp = () => {
        if (dragEl) dragEl.classList.remove('dragging');
        dragEl = null; dragIdx = -1;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    async function handleDocumentSubmit() {
      if (!basket.length) return;
      const docNo = document.getElementById('inpDocNo').value.trim();
      if (entryMode === 'OUT' && !docNo) { showToast(t('errNeedDoc')); return; }

      if (entryMode === 'OUT' && navigator.onLine) {
        const chk = await callRpc('rpc_check_doc_sequence', { p_token: session.token, p_warehouse_id: currentWhId, p_doc_no: docNo });
        if (chk.is_duplicate) {
          openDuplicateModal(docNo, chk.existing, (adminPin) => executePostDocument(docNo, null, adminPin));
          return;
        }
        const nVal = Number(docNo);
        if (whData.last_doc_num > 0 && nVal > 0 && nVal !== whData.next_doc_num && !/^\d+-\d+$/.test(docNo)) {
          openSeqJumpModal(docNo, whData.next_doc_num, (voidRange) => executePostDocument(docNo, voidRange, null));
          return;
        }
      }
      executePostDocument(docNo, null, null);
    }

    async function executePostDocument(docNo, voidRangeFirst, adminPin) {
      const params = {
        p_token: session.token,
        p_warehouse_id: currentWhId,
        p_doc_type: entryMode,
        p_doc_no: docNo,
        p_party_name: document.getElementById('inpParty').value.trim(),
        p_ref_no: document.getElementById('inpRef').value.trim(),
        p_items: basket.map((b) => ({ item_id: b.item_id, qty: b.qty, tally_proof: b.tally_proof || null })),
        p_idempotency_key: (crypto.randomUUID ? crypto.randomUUID() : 'k_' + Date.now() + '_' + Math.random()),
        p_void_range_first: voidRangeFirst,
        p_admin_override_pin: adminPin,
      };

      if (!navigator.onLine) {
        const q = getOfflineQueue(); q.push({ params, ts: Date.now() }); saveJson(QUEUE_KEY, q);
        basket = []; renderBasket(); updateSyncPill();
        showToast(t('offlineSaved'));
        return;
      }

      try {
        const res = await callRpc('rpc_post_document', params);
        if (!res.success) {
          showToast(res.error === 'INSUFFICIENT_STOCK' ? t('errStock') : t('errGeneric'));
          return;
        }

    function getTallyTotal() { return tally.strokes.reduce((s, x) => s + Number(x.qty || 0), 0); }

    function addTallyStroke(customQty = null) {
      const now = Date.now();
      if (customQty === null && now - lastTapMs < 140) return;
      lastTapMs = now;
      ensureWakeLock();

      const counted = getTallyTotal();
      const target = Number(tally.target || 0);
      const hardStop = tally.mode === 'OUT';

      if (hardStop && target > 0 && counted >= target) {
        vib([90, 50, 120]); playTone(920, 0.16, 'square', 0.16); return;
      }

      let add = customQty !== null ? Math.floor(Number(customQty)) : Number(tally.carryMult);
      if (!add || add <= 0) return;
      let isOdd = add !== tally.carryMult;
      if (hardStop && target > 0 && counted + add > target) { add = target - counted; isOdd = add !== tally.carryMult; }

      tally.strokes.push({ qty: add, isOdd, ts: now });
      const pad = document.getElementById('tallyPad');
      pad.classList.add('flash'); setTimeout(() => pad.classList.remove('flash'), 100);

      if (hardStop && target > 0 && counted + add >= target) {
        vib([90, 50, 90, 50, 140]); playTone(880, 0.15, 'square'); setTimeout(() => playTone(1175, 0.22, 'square'), 160);
      } else if (tally.strokes.length % 5 === 0) {
        vib([40, 25, 50]); playTone(720, 0.08, 'triangle');
      } else {
        vib(22); playTone(520, 0.05);
      }
      renderTallyCanvas(true);
      renderTallyStats();
      const c = document.getElementById('tallyCanvas'); c.scrollTop = c.scrollHeight;
    }

    function undoTally() { if (!tally.strokes.length) return; tally.strokes.pop(); vib(18); renderTallyCanvas(false); renderTallyStats(); }
    function clearTallyUndoable() {
      if (!tally.strokes.length) return;
      undoTallyBuf = tally.strokes.slice();
      tally.strokes = []; vib(28); renderTallyCanvas(false); renderTallyStats();
      showToast(t('clear'), () => { if (undoTallyBuf) { tally.strokes = undoTallyBuf; undoTallyBuf = null; renderTallyCanvas(false); renderTallyStats(); } });
    }

    async function commitTally() {
      const total = getTallyTotal();
      const it = (whData.items || []).find((x) => x.id === tally.itemId);
      if (!it) return;

      if (tally.mode === 'AUDIT') {
        const res = await callRpc('rpc_submit_adjustment', {
          p_token: session.token, p_warehouse_id: currentWhId,
          p_item_id: it.id, p_counted_qty: total,
          p_reason: total > it.stock ? t('adjPlusReason') : t('adjMinusReason'),
          p_tally_proof: { mode: 'AUDIT', strokes: tally.strokes },
        });
        if (!res.success) { showToast(t('errGeneric')); return; }
        callBot({ action: 'notify_adjustment', warehouse_id: currentWhId, adjustment_id: res.adjustment_id }).catch(() => {});
        tally.strokes = [];
        showToast(res.status === 'APPROVED' ? t('adjApproved') : t('adjPending'));
        loadWarehouseData(currentWhId);
        return;
      }

      if (total <= 0) return;
      setEntryMode(tally.mode);
      addToBasket(it.id, it.name, total, { mode: tally.mode, strokes: tally.strokes.slice() });
      tally.strokes = [];
      switchView('entry');
    }

    function renderTallyCanvas(animLast) {
      const c = document.getElementById('tallyCanvas'), s = tally.strokes;
      if (!s.length) {
        c.innerHTML = `<div style="margin:auto;opacity:0.14;pointer-events:none;"><div class="t-grp" style="transform:scale(1.5);"><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-slash"></div></div></div>`;
        return;
      }
      let h = '';
      for (let i = 0; i < s.length; i += 5) {
        const ch = s.slice(i, i + 5);
        h += '<div class="t-grp">';
        for (let b = 0; b < Math.min(4, ch.length); b++) {
          h += `<div class="t-bar ${ch[b].isOdd ? 'odd' : ''} ${animLast && i + b === s.length - 1 ? 'anim-b' : ''}"></div>`;
        }
        if (ch.length === 5) h += `<div class="t-slash ${animLast && i + 4 === s.length - 1 ? 'anim-s' : ''}"></div>`;
        h += '</div>';
      }
      c.innerHTML = h;
    }

    function renderTallyStats() {
      const cnt = getTallyTotal(), trg = Number(tally.target || 0), m = tally.mode;
      document.getElementById('valTCounted').textContent = cnt.toLocaleString();
      document.getElementById('valTStrokes').textContent = tally.strokes.length.toLocaleString();
      const rLbl = document.getElementById('lblTRight'), rVal = document.getElementById('valTRight');
      const box = document.getElementById('tallyAlert'), pad = document.getElementById('tallyPad');
      box.className = 'alert-box'; pad.classList.remove('done');

      if (m === 'AUDIT') {
        const d = cnt - trg;
        rLbl.textContent = t('diff'); rVal.textContent = (d > 0 ? '+' : '') + d;
        if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); }
        else if (d < 0 && cnt > 0) { box.className = 'alert-box warn'; box.textContent = t('shortWarn')(Math.abs(d)); }
        else if (d === 0 && cnt > 0) { box.className = 'alert-box stop'; box.textContent = t('exactMatch'); pad.classList.add('done'); }
      } else {
        rLbl.textContent = t('remaining');
        if (trg <= 0) rVal.textContent = '∞';
        else if (m === 'OUT') {
          const rem = Math.max(0, trg - cnt); rVal.textContent = rem.toLocaleString();
          if (cnt >= trg) { box.className = 'alert-box stop'; box.textContent = t('stopAlert'); pad.classList.add('done'); }
          else if (rem < tally.carryMult) { box.className = 'alert-box warn'; box.textContent = t('oddWarn')(rem); }
        } else {
          const d = cnt - trg; rVal.textContent = d >= 0 ? `+${d}` : String(trg - cnt);
          if (d > 0) { box.className = 'alert-box over'; box.textContent = t('overWarn')(d); }
          else if (d === 0) { box.className = 'alert-box stop'; box.textContent = t('exactMatch'); pad.classList.add('done'); }
        }
      }
    }

    function getPeriodBounds(p) {
      const now = new Date(), end = new Date();
      let start = new Date(0);
      if (p === 'WEEK') {
        const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1)); start = d;
      } else if (p === 'LAST_WEEK') {
        const d = new Date(now); const day = d.getDay() || 7; d.setHours(0,0,0,0); d.setDate(d.getDate() - (day - 1));
        end.setTime(d.getTime() - 1);
        start = new Date(d.getTime() - 7 * 86400000);
      } else if (p === 'MONTH') {
        start = new Date(now.getFullYear(), now.getMonth(), 1);
      }
      return { start: start.toISOString(), end: end.toISOString() };
    }

    async function generateAndDeliverPdf(isStock, onlyIds, sendToBot) {
      if (!window.html2canvas || !window.jspdf) { showToast(t('pdfLoading')); return; }
      const stage = document.getElementById('pdfStage');
      const brand = whData.warehouse?.brand_title || t('defaultBrand');

      const dateStr = new Date().toLocaleDateString('en-GB');

      if (isStock) {
        const list = onlyIds ? stockRows.filter((r) => onlyIds.includes(r.item_id)) : stockRows.filter((r) => r.closing_qty > 0 || r.in_qty > 0 || r.out_qty > 0 || r.adj_net_qty !== 0);
        let opT = 0, inT = 0, outT = 0, adjT = 0, clT = 0, lastCat = '';
        const trs = list.map((r) => {
          opT += Number(r.opening_qty); inT += Number(r.in_qty); outT += Number(r.out_qty); adjT += Number(r.adj_net_qty); clT += Number(r.closing_qty);

            catRow = `<tr style="background:#1e3a29;color:#fff;"><td colspan="6" style="padding:6px;font-weight:900;">📁 ${esc(lastCat)}</td></tr>`;
          }
          const bg = r.closing_qty === 0 ? '#f4cccc' : (r.closing_qty <= (whData.warehouse?.low_limit || 20) ? '#fff2cc' : '#ffffff');
          return catRow + `<tr style="background:${bg};">
            <td style="padding:5px;border:1px solid #cbd5e1;font-weight:700;">${esc(r.item_name)}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.opening_qty}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.in_qty}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.out_qty}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.adj_net_qty}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;font-weight:900;">${r.closing_qty}</td>
          </tr>`;
        }).join('');
        bodyHtml = `<table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr style="background:#0f172a;color:#fff;">${t('sCols').map((c) => `<th style="padding:7px;border:1px solid #334155;">${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${trs}</tbody>
          <tfoot><tr style="background:#0f172a;color:#38bdf8;font-weight:900;">
            <td style="padding:7px;">${list.length}</td><td style="text-align:center;">${opT}</td><td style="text-align:center;color:#86efac;">${inT}</td>
            <td style="text-align:center;color:#fca5a5;">${outT}</td><td style="text-align:center;">${adjT}</td><td style="text-align:center;">${clT}</td>
          </tr></tfoot></table>`;
      } else {
        const list = onlyIds ? dailyRows.filter((r) => onlyIds.includes(String(r.ledger_id || r.document_id))) : dailyRows;
        let lastDoc = null, inT = 0, outT = 0;
        const trs = list.map((r) => {
          let sp = '';
          if (lastDoc && lastDoc !== r.document_id) sp = `<tr style="background:#f1f5f9;"><td colspan="8" style="height:6px;"></td></tr>`;
          const same = lastDoc === r.document_id; lastDoc = r.document_id;
          const isV = r.status === 'VOIDED' || r.is_voided || r.doc_type === 'VOID';
          if (!isV) { inT += Number(r.qty_in || 0); outT += Number(r.qty_out || 0); }
          const bg = isV ? '#f4cccc' : (r.doc_type === 'IN' ? '#d9ead3' : (r.doc_type === 'ADJ' ? '#dbeafe' : (r.is_zero_stock ? '#ffe599' : '#ffffff')));
          return sp + `<tr style="background:${bg};">
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;font-weight:700;">${esc(same ? '↳' : r.doc_no)}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;font-weight:700;">${esc(isV ? t('voidLabel') : r.item_name)}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${isV ? '-' : r.opening_bal}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.qty_in || '-'}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${r.qty_out || '-'}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;font-weight:900;">${isV ? '-' : r.closing_bal}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;">${esc(same ? '↳' : r.party_name)}</td>
            <td style="padding:5px;border:1px solid #cbd5e1;text-align:center;">${esc(same ? '↳' : r.date_str)}</td>
          </tr>`;
        }).join('');
        bodyHtml = `<table style="width:100%;border-collapse:collapse;font-size:11.5px;">
          <thead><tr style="background:#0f172a;color:#fff;">${t('dCols').slice(0,8).map((c) => `<th style="padding:7px;border:1px solid #334155;">${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${trs}</tbody>
          <tfoot><tr style="background:#0f172a;color:#38bdf8;font-weight:900;">
            <td colspan="3" style="padding:7px;">${list.length}</td>
            <td style="text-align:center;color:#86efac;">${inT}</td><td style="text-align:center;color:#fca5a5;">${outT}</td>
            <td colspan="3" style="text-align:center;">${dateStr}</td>
          </tr></tfoot></table>`;
      }

      stage.innerHTML = `<div style="background:#090e17;color:#38bdf8;padding:12px;text-align:center;font-size:15px;font-weight:900;margin-bottom:6px;">${esc(title)}</div>${bodyHtml}`;
      const canvas = await window.html2canvas(stage, { scale: 2, backgroundColor: '#ffffff' });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
      const imgW = pw - 20, imgH = (canvas.height * imgW) / canvas.width;
      let leftH = imgH, pos = 10;
      const imgData = canvas.toDataURL('image/png');
      pdf.addImage(imgData, 'PNG', 10, pos, imgW, imgH);
      leftH -= (ph - 20);
      while (leftH > 0) {
        pos = leftH - imgH + 10;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 10, pos, imgW, imgH);
        leftH -= (ph - 20);
      }

      const fileName = `${isStock ? 'Stock' : 'Daily'}_${dateStr.replace(/\//g, '-')}.pdf`;
      if (!sendToBot) { pdf.save(fileName); return; }

      try {
        const blob = pdf.output('blob');
        const fd = new FormData();
        fd.append('token', session.token);
        fd.append('warehouse_id', currentWhId);
        fd.append('report_title', title);
        fd.append('file', blob, fileName);

        const res = await fetch(`${SUPABASE_URL}/functions/v1/${BOT_FUNCTION}`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'x-session-token': session.token },
          body: fd,
        }).then((r) => r.json());

        if (res.success) showToast(t('savedOk'));
        else { pdf.save(fileName); showToast(t('pdfLocal')); }
      } catch {
        pdf.save(fileName); showToast(t('pdfLocal'));
      }
    }

    function toggleBulkMap() {
      bulkMapMode = !bulkMapMode; bulkMapSlots = {}; vib(16);
      document.getElementById('btnBulkMap').style.background = bulkMapMode ? 'var(--primary)' : 'var(--surface-deep)';
      document.getElementById('btnBulkMap').style.color = bulkMapMode ? '#fff' : 'var(--primary)';
      document.getElementById('btnBulkAssign').style.display = 'none';
      renderMap();
    }

    function renderMap() {
      const racks = whData.racks || [];
      document.getElementById('rackTabs').innerHTML = racks.map((r) =>
        `<button type="button" class="rack-tab ${activeRack === r.code ? 'active' : ''}" onclick="activeRack='${r.code}';vib(15);renderMap();">${esc(r.name)}</button>`
      ).join('');
      const rk = racks.find((r) => r.code === activeRack) || racks[0];
      const grid = document.getElementById('rackGrid');
      if (!rk) { grid.innerHTML = ''; return; }
      const q = document.getElementById('inpMapSearch').value.trim().toLowerCase();
      grid.style.gridTemplateColumns = `repeat(${rk.cols}, 1fr)`;
      const cells = [];
      for (let i = 1; i <= rk.cols * rk.rows; i++) {
        const sid = `${rk.code}-${i < 10 ? '0' + i : i}`;
        const list = whData.slot_map?.[sid] || [];
        const names = list.map((x) => x.item_name);
        const hl = q && names.some((n) => n.toLowerCase().includes(q));
        const cls = bulkMapSlots[sid] ? 'sel' : (hl ? 'hl' : (names.length ? 'used' : ''));
        cells.push(`<div class="bin ${cls}" onclick="onBinClick('${sid}')"><span class="bin-id">${sid}</span><span class="bin-it">${names.length ? esc(names.join('፣ ')) : esc(t('emptySlot'))}</span></div>`);
      }
      grid.innerHTML = cells.join('');
    }

    function onBinClick(sid) {
      vib(18);
      if (bulkMapMode) {
        if (bulkMapSlots[sid]) delete bulkMapSlots[sid]; else bulkMapSlots[sid] = true;
        const n = Object.keys(bulkMapSlots).length;
        const btn = document.getElementById('btnBulkAssign');
        btn.style.display = n ? 'inline-flex' : 'none';
        btn.textContent = `${t('assignBtn')} (${n})`;
        renderMap();
        return;
      }
      openBinModal(sid);
    }

    function openBinModal(singleSlot) {
      activeModalSlots = singleSlot ? [singleSlot] : Object.keys(bulkMapSlots);
      if (!activeModalSlots.length) return;
      const curList = singleSlot ? (whData.slot_map?.[singleSlot] || []) : [];
      const curHtml = curList.map((x) => `
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:800;">
          <span>• ${esc(x.item_name)}</span>
          <button type="button" class="icon-btn" style="width:24px;height:24px;color:var(--rose);" onclick="removeBinItem('${singleSlot}','${x.item_id}')">✕</button>
        </div>`).join('');

      openMainModal(`📍 ${activeModalSlots.join(', ')}`, `
        ${curHtml ? `<div class="sub-card">${curHtml}</div>` : ''}
        <select id="selBinIt" class="sel">${(whData.items || []).map((it) => `<option value="${it.id}">${esc(it.name)}</option>`).join('')}</select>
        <label class="chk-row"><input type="checkbox" id="chkBinApp" checked><span>${esc(t('appendSlot'))}</span></label>`,
        `${singleSlot ? `<button type="button" class="btn danger" onclick="clearSingleBin('${singleSlot}')">${esc(t('clearSlot'))}</button>` : `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('cancel'))}</button>`}
         <button type="button" class="btn teal" onclick="saveBinAssign()">${esc(t('assignBtn'))}</button>`);
    }

    async function saveBinAssign() {
      const itemId = document.getElementById('selBinIt').value;
      const append = document.getElementById('chkBinApp').checked;
      if (!itemId || !activeModalSlots.length) return;
      const res = await callRpc('rpc_manage_bin_slots', {
        p_token: session.token, p_warehouse_id: currentWhId, p_action: 'ASSIGN',
        p_slots: activeModalSlots, p_item_id: itemId, p_append_mode: append,
      });
      if (res.success) { closeMainModal(); if (bulkMapMode) toggleBulkMap(); showToast(t('savedOk')); loadWarehouseData(currentWhId); }
    }

      await callRpc('rpc_manage_bin_slots', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'REMOVE_ITEM', p_slots: [slot], p_item_id: itemId });

    async function openQrScanner() {
      openMainModal(t('qrTitle'), `
        <video id="qrVideo" class="qr-video" autoplay playsinline muted></video>
        <input type="text" id="inpQrManual" class="inp mono" placeholder="${esc(t('qrManualPh'))}" onkeydown="if(event.key==='Enter') jumpToScannedSlot(this.value)">`,
        `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('close'))}</button>
         <button type="button" class="btn teal" onclick="jumpToScannedSlot(document.getElementById('inpQrManual').value)">${esc(t('ok'))}</button>`);

      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const vid = document.getElementById('qrVideo');
        vid.srcObject = qrStream;
        if ('BarcodeDetector' in window) {
          const detector = new BarcodeDetector({ formats: ['qr_code', 'code_128'] });
          const scan = async () => {
            if (!qrStream) return;
            try {
              const codes = await detector.detect(vid);
              if (codes.length && codes[0].rawValue) { jumpToScannedSlot(codes[0].rawValue); return; }
            } catch {}
            qrLoopId = requestAnimationFrame(scan);
          };
          qrLoopId = requestAnimationFrame(scan);
        }
      } catch {}
    }

    function stopQrCamera() {
      if (qrLoopId) { cancelAnimationFrame(qrLoopId); qrLoopId = null; }
      if (qrStream) { qrStream.getTracks().forEach((tr) => tr.stop()); qrStream = null; }
    }

    function jumpToScannedSlot(code) {
      const clean = String(code || '').trim().toUpperCase();
      if (!clean) return;
      closeMainModal();
      const rk = clean.split('-')[0];
      if ((whData.racks || []).some((r) => r.code === rk)) activeRack = rk;
      renderMap();
      openBinModal(clean);
    }

    async function saveNotifChannel() {
      const tp = document.getElementById('chType').value;
      const c1 = document.getElementById('chCred1').value.trim();
      const c2 = document.getElementById('chCred2').value.trim();
      const creds = tp === 'TELEGRAM' ? { bot_token: c1 }
        : tp === 'WHATSAPP' ? { access_token: c1, phone_number_id: c2 }
        : tp === 'SMS' ? { api_key: c1, sender_id: c2 }
        : { api_key: c1 };

      const res = await callRpc('rpc_manage_notification_channels', {
        p_token: session.token, p_action: 'UPSERT',
        p_payload: {
          organization_id: whData.warehouse.organization_id,
          warehouse_id: document.getElementById('chWh').value || null,
          channel_type: tp,
          label: document.getElementById('chLabel').value.trim() || chTypeLabel(tp),
          target_address: document.getElementById('chTarget').value.trim(),
          credentials: creds,
        },
      });
      if (res.success) {
        if (tp === 'TELEGRAM' && res.channel_id) await linkTelegramWebhook(res.channel_id, true);
        showToast(t('savedOk'));
        openChannelsManager();
      } else showToast(t('errGeneric'));
    }

    async function linkTelegramWebhook(channelId, silent = false) {
      const res = await callBot({ action: 'register_telegram_webhook', channel_id: channelId });
      if (!silent) showToast(res.success ? t('savedOk') : t('errGeneric'));
    }

    async function testNotifChannel(channelId) {
      const res = await callBot({ action: 'test_channel', channel_id: channelId });
      showToast(res.success ? t('savedOk') : t('errGeneric'));
    }

    async function deleteNotifChannel(channelId) {
      await callRpc('rpc_manage_notification_channels', {
        p_token: session.token, p_action: 'DELETE',
        p_payload: { organization_id: whData.warehouse.organization_id, channel_id: channelId },
      });
      openChannelsManager();
    }

    function openCatalogManager() {
      const cats = whData.categories || [];
      openMainModal(t('mCatalog'), `
        <div class="sub-card">
          <div style="display:flex;gap:5px;">
            <input id="catNewName" class="inp" placeholder="${esc(t('phCatName'))}">
            <button type="button" class="btn primary" onclick="addCategoryNow()">+</button>
          </div>
        </div>
        <div class="sub-card">
          <input id="itNewName" class="inp" placeholder="${esc(t('phItemName'))}">
          <select id="itNewCat" class="sel"><option value="">-</option>${cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
          <input id="itNewOp" type="number" class="inp mono" value="0" min="0" placeholder="${esc(t('phOpening'))}">
          <button type="button" class="btn teal" onclick="addItemNow()">+ ${esc(t('add'))}</button>
        </div>`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    async function addCategoryNow() {
      const n = document.getElementById('catNewName').value.trim();
      if (!n) return;
      await callRpc('rpc_manage_catalog', { p_token: session.token, p_warehouse_id: currentWhId, p_action: 'ADD_CATEGORY', p_payload: { name: n } });
      await loadWarehouseData(currentWhId); openCatalogManager();
    }

    async function addItemNow() {
      const n = document.getElementById('itNewName').value.trim();
      if (!n) return;
      const res = await callRpc('rpc_manage_catalog', {
        p_token: session.token, p_warehouse_id: currentWhId, p_action: 'UPSERT_ITEM',
        p_payload: { name: n, category_id: document.getElementById('itNewCat').value, opening_qty: Number(document.getElementById('itNewOp').value || 0) },
      });
      if (res.success) { showToast(t('savedOk')); await loadWarehouseData(currentWhId); openCatalogManager(); }
    }

    function openRacksManager() {
      const rks = whData.racks || [];
      openMainModal(t('mRacks'), `
        <div class="sub-card">
          <div class="grid-3">
            <input id="rkCode" class="inp mono" placeholder="${esc(t('phRackCode'))}" style="text-transform:uppercase;">
            <input id="rkName" class="inp" placeholder="${esc(t('phRackName'))}">
            <input id="rkCols" type="number" class="inp mono" value="6" placeholder="${esc(t('phRackCols'))}">
          </div>
          <button type="button" class="btn teal" onclick="addRackNow()">+ ${esc(t('add'))}</button>
        </div>
        ${rks.map((r) => `<div class="sub-card"><b>${esc(r.code)} — ${esc(r.name)} (${r.cols}×${r.rows})</b></div>`).join('')}`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    async function addRackNow() {
      const code = document.getElementById('rkCode').value.trim().toUpperCase();
      const name = document.getElementById('rkName').value.trim() || code;
      const cols = Number(document.getElementById('rkCols').value || 6);
      if (!code) return;
      const next = (whData.racks || []).concat([{ code, name, cols, rows: 5 }]);
      await callRpc('rpc_manage_racks', { p_token: session.token, p_warehouse_id: currentWhId, p_racks: next });
      await loadWarehouseData(currentWhId); openRacksManager();
    }

    async function openApprovalsManager() {
      const res = await callRpc('rpc_get_pending_adjustments', { p_token: session.token, p_warehouse_id: currentWhId });
      const rows = res.rows || [];
      openMainModal(t('mApprovals'),
        rows.length ? rows.map((a) => `
          <div class="sub-card">
            <b>${esc(a.item_name)} (${a.system_bal} ➔ ${a.counted_qty} | ${a.diff_qty > 0 ? '+' : ''}${a.diff_qty})</b>
            <span class="lbl-sm">${esc(a.requested_by)} — ${esc(a.reason)}</span>
            <div class="grid-2">
              <button type="button" class="btn teal" onclick="reviewAdj('${a.id}',true)">${esc(t('approve'))}</button>
              <button type="button" class="btn danger" onclick="reviewAdj('${a.id}',false)">${esc(t('reject'))}</button>
            </div>
          </div>`).join('') : `<div class="sub-card" style="text-align:center;">${esc(t('noItems'))}</div>`,
        `<button type="button" class="btn muted" style="grid-column:span 2;" onclick="closeMainModal()">${esc(t('close'))}</button>`);
    }

    async function reviewAdj(id, approve) {
      const res = await callRpc('rpc_review_adjustment', { p_token: session.token, p_adjustment_id: id, p_approve: approve });
      if (res.success) { showToast(t('savedOk')); await loadWarehouseData(currentWhId); openApprovalsManager(); }
    }

    async function sendRiskAuditNow() {
      const res = await callBot({ action: 'send_risk_audit', warehouse_id: currentWhId });
      showToast(res.success ? t('savedOk') : t('errGeneric'));
    }

    function openOwnPinModal() {
      openMainModal(t('mPin'), `
        <input id="pOld" type="password" class="inp mono" maxlength="6" inputmode="numeric" placeholder="${esc(t('phOldPin'))}">
        <input id="pNew" type="password" class="inp mono" maxlength="6" inputmode="numeric" placeholder="${esc(t('phNewPin'))}">`,
        `<button type="button" class="btn muted" onclick="closeMainModal()">${esc(t('cancel'))}</button>
         <button type="button" class="btn teal" onclick="saveOwnPin()">${esc(t('save'))}</button>`);
    }

    async function saveOwnPin() {
      const res = await callRpc('rpc_manage_staff', {
        p_token: session.token, p_action: 'CHANGE_OWN_PIN',
        p_payload: { old_pin: document.getElementById('pOld').value, new_pin: document.getElementById('pNew').value },
      });
      if (res.success) { closeMainModal(); showToast(t('savedOk')); } else showToast(t('errGeneric'));

    function openMainModal(title, bodyHtml, footHtml) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalFoot').innerHTML = footHtml;
      document.getElementById('mainModal').classList.add('open');
    }
    function closeMainModal() { stopQrCamera(); document.getElementById('mainModal').classList.remove('open'); }

    function switchView(name) {
      vib(16);
      const map = { entry:'viewEntry', tally:'viewTally', daily:'viewDaily', stock:'viewStock', map:'viewMap' };
      const nav = { entry:'navEntry', tally:'navTally', daily:'navDaily', stock:'navStock', map:'navMap' };
      Object.values(map).forEach((id) => document.getElementById(id).classList.remove('active'));
      Object.values(nav).forEach((id) => document.getElementById(id).classList.remove('active'));
      document.getElementById(map[name]).classList.add('active');
      document.getElementById(nav[name]).classList.add('active');
      selectedPdfIds = {}; updatePdfBar();
      document.getElementById('submitDock').style.display = (name === 'entry' && basket.length) ? 'flex' : 'none';
      if (name === 'tally') { ensureWakeLock(); renderTally(); }
      if (name === 'daily') loadDaily();
      if (name === 'stock') loadStock();
      if (name === 'map') renderMap();
    }

      lang = (lang === 'am') ? 'en' : 'am';

      vib(16);

      if (session) { renderDrawerMenu(); renderTiles(); renderBasket(); renderTally(); renderDaily(); renderStock(); renderMap(); }

    (function setupTallyGestures() {
      const pad = document.getElementById('tallyPad');
      let sx = 0, sy = 0, st = 0;
      pad.addEventListener('pointerdown', (e) => {
        if (!e.isPrimary || e.target.closest('.t-stats')) return;
        sx = e.clientX; sy = e.clientY; st = Date.now();
      });
      pad.addEventListener('pointerup', (e) => {
        if (!e.isPrimary || e.target.closest('.t-stats')) return;
        const dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - st;
        if ((Math.hypot(dx, dy) < 14 && dt < 450) || (Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 0.9 && dt < 500)) {
          addTallyStroke();
        }
      });
    })();

    (function boot() {
      const urlOrg = new URLSearchParams(location.search).get('org');
      if (urlOrg) document.getElementById('inpOrgCode').value = urlOrg.toUpperCase();
      renderStaticLabels();
      if (session?.token) enterApp();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    })();
